<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pocket Stat Card GPS</title>
<meta name="description" content="On-course stat card with GPS yards to the green and a club plan for every shot.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stat Card">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060A07" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one thumb, one screen. Status at the top, a tappable map of the hole in the middle, every action in the bottom thumb zone above a floating glass tab bar. */
:root{
  --c-bg:#EDF1EC;--c-surface:#FFFFFF;--c-raise:#F5F7F4;--c-ink:#101712;--c-muted:#5B6860;--c-hair:rgba(16,23,18,.1);
  --c-fill:rgba(20,40,26,.065);--c-fill-2:rgba(20,40,26,.16);--c-seg-on:#FFFFFF;
  --c-accent:#14864A;--c-accent-ink:#FFFFFF;--c-accent-soft:#DCF0E2;--c-link:#11733E;
  --c-bad:#D33B2C;--c-bad-soft:#FBE3DF;--c-warn:#A86B0C;--c-warn-soft:#F7EBD2;
  --c-glass:rgba(252,253,252,.97);--c-glass-edge:rgba(255,255,255,.75);--c-glass-hi:rgba(255,255,255,.8);
  --c-sheet:#F7F9F6;--c-scrim:rgba(8,14,10,.32);
  --c-shadow:0 .5px 1px rgba(16,23,18,.06),0 3px 10px -6px rgba(16,23,18,.18);
  --m-rough:#86AC5E;--m-fair:#A9D57D;--m-stripe:#B6DE8E;--m-fringe:#BDE39A;--m-green:#84DC5C;--m-green-hi:#93E56C;
  --m-sand:#EDDCAF;--m-sand-edge:#D9C48E;--m-trees:#4E7A42;--m-tree:#3B6533;--m-line:#FFFFFF;--m-ball:#FFFFFF;
  --m-label:#10260F;--m-chip:rgba(255,255,255,.86);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.4,.5,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --c-bg:#060A07;--c-surface:#131915;--c-raise:#1A211C;--c-ink:#EEF3EF;--c-muted:#98A79C;--c-hair:rgba(238,243,239,.11);
  --c-fill:rgba(220,240,226,.085);--c-fill-2:rgba(220,240,226,.2);--c-seg-on:#2B352E;
  --c-accent:#36D06E;--c-accent-ink:#03140A;--c-accent-soft:#11301C;--c-link:#5BDD8B;
  --c-bad:#FF6F5E;--c-bad-soft:#3A1612;--c-warn:#F2B650;--c-warn-soft:#33260E;
  --c-glass:rgba(24,30,26,.97);--c-glass-edge:rgba(255,255,255,.1);--c-glass-hi:rgba(255,255,255,.07);
  --c-sheet:#141A16;--c-scrim:rgba(0,0,0,.55);
  --c-shadow:0 0 0 .5px rgba(255,255,255,.07),0 14px 30px -14px rgba(0,0,0,.85);
  --m-rough:#33522A;--m-fair:#4C7D35;--m-stripe:#56883C;--m-fringe:#5C9140;--m-green:#62B843;--m-green-hi:#6EC54E;
  --m-sand:#8F7D50;--m-sand-edge:#7A6A42;--m-trees:#1E361C;--m-tree:#172C16;--m-line:#FFFFFF;--m-ball:#FFFFFF;
  --m-label:#F1F7EE;--m-chip:rgba(8,16,9,.62);color-scheme:dark}}
:root[data-theme="dark"]{
  --c-bg:#060A07;--c-surface:#131915;--c-raise:#1A211C;--c-ink:#EEF3EF;--c-muted:#98A79C;--c-hair:rgba(238,243,239,.11);
  --c-fill:rgba(220,240,226,.085);--c-fill-2:rgba(220,240,226,.2);--c-seg-on:#2B352E;
  --c-accent:#36D06E;--c-accent-ink:#03140A;--c-accent-soft:#11301C;--c-link:#5BDD8B;
  --c-bad:#FF6F5E;--c-bad-soft:#3A1612;--c-warn:#F2B650;--c-warn-soft:#33260E;
  --c-glass:rgba(24,30,26,.97);--c-glass-edge:rgba(255,255,255,.1);--c-glass-hi:rgba(255,255,255,.07);
  --c-sheet:#141A16;--c-scrim:rgba(0,0,0,.55);
  --c-shadow:0 0 0 .5px rgba(255,255,255,.07),0 14px 30px -14px rgba(0,0,0,.85);
  --m-rough:#33522A;--m-fair:#4C7D35;--m-stripe:#56883C;--m-fringe:#5C9140;--m-green:#62B843;--m-green-hi:#6EC54E;
  --m-sand:#8F7D50;--m-sand-edge:#7A6A42;--m-trees:#1E361C;--m-tree:#172C16;--m-line:#FFFFFF;--m-ball:#FFFFFF;
  --m-label:#F1F7EE;--m-chip:rgba(8,16,9,.62);color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--c-bg)}
body{color:var(--c-ink);font-family:var(--f-ui);-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html body::after{content:none}
.gm-fab{display:none!important}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
#main{display:flex;flex-direction:column;gap:12px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}
button{font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}
.topline{display:flex;justify-content:space-between;align-items:center;min-height:24px;gap:10px}
.wm{font:700 14px/1 var(--f-num);letter-spacing:-.01em;color:var(--c-muted)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--c-muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--c-muted)}
.sync.ok i{background:var(--c-accent)}.sync.warn i{background:var(--c-warn)}
.notex{font-size:14px;line-height:1.4;padding:10px 14px;border-radius:14px;background:var(--c-warn-soft);margin:0}
.t1{font:800 32px/1.08 var(--f-num);letter-spacing:-.03em;margin:0;text-wrap:balance}
.t2{font:700 24px/1.15 var(--f-num);letter-spacing:-.025em;margin:0;text-wrap:balance}
.t3{font:700 19px/1.2 var(--f-ui);letter-spacing:-.02em;margin:0}
.sub{margin:0;color:var(--c-muted);font-size:15px;line-height:1.4}
.cap{font-size:13px;font-weight:600;color:var(--c-muted);letter-spacing:.01em}

/* Hole header */
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hd-hole{border:0;background:none;padding:2px 0;text-align:left;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.hd-k{font-size:13px;color:var(--c-muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}
.hd-t{font:800 34px/1 var(--f-num);letter-spacing:-.035em;display:inline-flex;align-items:center;gap:6px}
.chev{width:18px;height:18px;fill:none;stroke:var(--c-muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-top:4px}
.hd-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.tp{color:var(--c-ink);font-family:var(--f-num)}.tp.u{color:var(--c-accent)}
.hd .seg{flex:none;margin-bottom:2px}

/* Segmented controls */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:13px;background:var(--c-fill)}
.seg button{border:0;background:transparent;color:var(--c-ink);font:600 14px/1 var(--f-ui);padding:0 11px;min-height:40px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:background-color .2s,box-shadow .2s,transform .35s var(--spring)}
.seg button[aria-pressed="true"]{background:var(--c-seg-on);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px var(--c-hair)}
.seg.full{display:grid;width:100%}
.seg.big button{min-height:44px;font-size:15px}

/* Shot strip: the shot you're on, always in view */
.strip{display:flex;align-items:center;gap:12px;padding:10px;border-radius:22px;background:var(--c-surface);box-shadow:var(--c-shadow)}
.sn{width:54px;height:54px;border-radius:17px;background:var(--c-accent);color:var(--c-accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none}
.sn .num{font-size:27px}
.sn small{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.85;margin-top:1px}
.sn.pen{background:var(--c-bad);color:#fff}
.st{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.st b{font:700 18px/1.2 var(--f-ui);letter-spacing:-.02em}
.st span{font-size:14px;color:var(--c-muted)}
.ib{flex:none;width:44px;height:44px;border-radius:14px;border:0;background:var(--c-fill);color:var(--c-ink);display:grid;place-items:center;font:700 16px var(--f-num);cursor:pointer;transition:transform .35s var(--spring)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* The hole map */
.mapw,.greenw{border-radius:26px;overflow:hidden;box-shadow:var(--c-shadow);line-height:0;background:var(--m-rough)}
.greenw{background:var(--m-fringe)}
.map{width:100%;height:auto;display:block}
.mapw.mini{width:min(250px,70%);align-self:center;border-radius:20px}
.m-rough{fill:var(--m-rough)}.m-trees{fill:var(--m-trees)}.m-tree{fill:var(--m-tree)}.m-fair{fill:var(--m-fair)}.m-stripe{fill:var(--m-stripe)}
.m-fringe{fill:var(--m-fringe)}.m-green{fill:var(--m-green)}.m-green-hi{fill:var(--m-green-hi)}.m-sand{fill:var(--m-sand);stroke:var(--m-sand-edge);stroke-width:1.5}.m-tee{fill:var(--m-stripe)}
.z{cursor:pointer;outline:none;transition:filter .15s}
.z:active{filter:brightness(1.14)}
.z:focus-visible{filter:brightness(1.18)}
.ml{pointer-events:none}.ml rect{fill:var(--m-chip)}.ml text{fill:var(--m-label);font:600 12.5px var(--f-ui);text-anchor:middle}
.deco{pointer-events:none}
.pin{stroke:var(--m-label);stroke-width:1.6;stroke-linecap:round}.flag{fill:var(--c-bad)}.cup{fill:var(--m-label);opacity:.75}
.tr{fill:none;stroke:var(--m-line);stroke-width:2.4;stroke-dasharray:1 6;stroke-linecap:round}
.td{fill:var(--m-line);opacity:.9}
.ball{fill:var(--m-ball);stroke:rgba(0,0,0,.28);stroke-width:1}
.halo{fill:var(--m-ball);opacity:.28}
.penb rect{fill:var(--c-bad)}.penb text{fill:#fff;font:700 12px var(--f-num);text-anchor:middle}
@media (prefers-reduced-motion:no-preference){.ball.pop,.halo.pop{animation:bpop .5s var(--spring) both;transform-box:fill-box;transform-origin:center}}
@keyframes bpop{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1)}}

/* Thumb-zone actions */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts.one{grid-template-columns:1fr}
.act{min-height:60px;border:0;border-radius:19px;background:var(--c-surface);color:var(--c-ink);box-shadow:var(--c-shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:transform .35s var(--spring)}
.act b{font-size:17px;font-weight:700;letter-spacing:-.015em}
.act small{font-size:13px;color:var(--c-muted)}
.act.bad b{color:var(--c-bad)}.act.good b{color:var(--c-accent)}
.act.go{background:var(--c-accent);color:var(--c-accent-ink)}.act.go small{color:inherit;opacity:.8}
.act.big{min-height:74px}.act.big b{font-size:21px}
.links{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap;margin-top:-4px}
.lk{border:0;background:none;color:var(--c-link);font:600 15px var(--f-ui);padding:8px 4px;min-height:44px;cursor:pointer}
.cta{min-height:56px;border:0;border-radius:19px;background:var(--c-accent);color:var(--c-accent-ink);font:700 17px var(--f-ui);letter-spacing:-.015em;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%;padding:0 18px;transition:transform .35s var(--spring),opacity .2s}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cta:disabled{opacity:.38;cursor:default}
.cta.sec{background:var(--c-fill);color:var(--c-ink)}
.ghost{min-height:44px;border:0;border-radius:14px;background:var(--c-fill);color:var(--c-ink);font:600 15px var(--f-ui);padding:0 14px;cursor:pointer}
.ghost.go{background:var(--c-accent);color:var(--c-accent-ink)}.ghost.bad{color:var(--c-bad)}
.ib:active,.act:active,.cta:active:not(:disabled),.seg button:active,.pl:active,.nb:active,.hb:active,.ghost:active,.lr:active{transform:scale(.95)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pl{min-height:42px;border:0;border-radius:999px;background:var(--c-fill);color:var(--c-ink);font:600 15px var(--f-ui);padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.pl[aria-pressed="true"]{background:var(--c-ink);color:var(--c-bg)}
.pl.wchip{flex-direction:column;align-items:flex-start;border-radius:16px;padding:8px 12px;line-height:1.2}
.pl.wchip small{font-size:12px;opacity:.75;font-weight:500}
.wf{width:20px;height:20px;vertical-align:-4px;margin-right:5px}
.ask{display:flex;flex-direction:column;gap:8px}
.r2{display:flex;gap:8px;flex-wrap:wrap}.r2>*{flex:1 1 auto}

/* Hole finished */
.res{background:var(--c-surface);border-radius:26px;box-shadow:var(--c-shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.res-top{display:flex;align-items:center;gap:16px}
.res-t{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pillx{display:inline-flex;align-items:center;min-height:30px;padding:0 13px;border-radius:999px;font:700 16px var(--f-ui);letter-spacing:-.01em;background:var(--c-fill)}
.pillx.under{background:var(--c-accent-soft);color:var(--c-accent)}.pillx.over{background:var(--c-warn-soft);color:var(--c-warn)}.pillx.over2{background:var(--c-bad-soft);color:var(--c-bad)}
.hist{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.hist::-webkit-scrollbar{display:none}
.hist span{flex:none;padding:6px 11px;border-radius:999px;background:var(--c-fill);font-size:14px;white-space:nowrap}
.nx{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nx .t3{white-space:nowrap}
/* Scorecard marks: circle for under par, square for over, doubled for two or more */
.mk{display:inline-grid;place-items:center;width:28px;height:28px;font-weight:700}
.mk.e1{border-radius:50%;box-shadow:0 0 0 1.6px var(--c-accent)}
.mk.e2{border-radius:50%;box-shadow:0 0 0 1.6px var(--c-accent),0 0 0 3.6px var(--c-surface),0 0 0 5.2px var(--c-accent)}
.mk.o1{border-radius:5px;box-shadow:0 0 0 1.6px var(--c-warn)}
.mk.o2{border-radius:5px;box-shadow:0 0 0 1.6px var(--c-bad),0 0 0 3.6px var(--c-surface),0 0 0 5.2px var(--c-bad)}
.mk.big{width:86px;height:86px;font-size:46px;flex:none;background:var(--c-fill);border-radius:24px}
.mk.big.e1{border-radius:50%;box-shadow:0 0 0 3px var(--c-accent);background:var(--c-accent-soft)}
.mk.big.e2{border-radius:50%;box-shadow:0 0 0 3px var(--c-accent),0 0 0 7px var(--c-surface),0 0 0 10px var(--c-accent);background:var(--c-accent-soft)}
.mk.big.o1{border-radius:16px;box-shadow:0 0 0 3px var(--c-warn);background:var(--c-warn-soft)}
.mk.big.o2{border-radius:16px;box-shadow:0 0 0 3px var(--c-bad),0 0 0 7px var(--c-surface),0 0 0 10px var(--c-bad);background:var(--c-bad-soft)}

/* Still on this hole? */
.stale{background:var(--c-warn-soft);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stale b{display:block;font-size:17px;letter-spacing:-.015em}.stale span{font-size:14px;color:var(--c-muted)}

/* Bottom sheets */
.sheetw{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--c-scrim)}
.sheet{position:relative;width:min(560px,100%);max-height:calc(100% - 36px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;background:var(--c-sheet);border-radius:30px 30px 0 0;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -20px 60px -20px rgba(0,0,0,.35)}
.sheet::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--c-fill-2);align-self:center;flex:none}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sup .45s var(--spring) both}.scrim{animation:sfade .25s ease both}}
@keyframes sup{from{transform:translateY(100%)}}@keyframes sfade{from{opacity:0}}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--c-fill);display:grid;place-items:center;cursor:pointer;color:var(--c-muted);flex:none}
.x svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nb{min-height:70px;border:0;border-radius:19px;background:var(--c-fill);color:var(--c-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:transform .35s var(--spring)}
.nb .num{font-size:29px}.nb small{font-size:12px;color:var(--c-muted);font-weight:600}
.nb.par{box-shadow:inset 0 0 0 2px var(--c-accent)}
.nb[aria-pressed="true"]{background:var(--c-accent);color:var(--c-accent-ink);box-shadow:none}.nb[aria-pressed="true"] small{color:inherit;opacity:.85}
.hgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.hb{aspect-ratio:1;border:0;border-radius:15px;background:var(--c-fill);color:var(--c-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;position:relative;min-width:0;transition:transform .35s var(--spring)}
.hb small{font-size:11.5px;color:var(--c-muted);font-weight:600}.hb .num{font-size:19px}
.hb[aria-current="true"]{background:var(--c-ink);color:var(--c-bg)}.hb[aria-current="true"] small{color:inherit;opacity:.7}
.hb.open::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--c-warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--c-muted);align-items:center}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c-warn);margin-right:6px}
.ydrow{display:flex;align-items:center;gap:8px}
.ydrow .inp{width:96px;text-align:center;font:700 24px var(--f-num)}
.ydrow .ghost{min-width:58px;min-height:52px;font-size:17px}
#f-ydr{width:100%;height:44px;margin:0;accent-color:var(--c-accent)}
.ydout{display:flex;flex-direction:column;gap:10px}
.ydp{margin:0;font-size:16px;line-height:1.45}

/* Toast with undo */
.toast{position:fixed;left:50%;bottom:calc(152px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:35;display:flex;align-items:center;gap:12px;padding:7px 7px 7px 16px;border-radius:999px;background:var(--c-ink);color:var(--c-bg);font:600 15px var(--f-ui);box-shadow:0 10px 30px -10px rgba(0,0,0,.45);max-width:calc(100% - 32px);white-space:nowrap}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast button{border:0;border-radius:999px;background:var(--c-accent);color:var(--c-accent-ink);font:700 14px var(--f-ui);min-height:36px;padding:0 14px;cursor:pointer;flex:none}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .4s var(--spring) both}}
@keyframes tin{from{transform:translate(-50%,24px);opacity:0}}

function gpsYards(){

const OSM_EP=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
let osmBusy=false;
async function fetchCourse(){

/* Your real club distances: GPS spot of the tap after each shot to the next one (you tap right after you hit) */
function learnedDist(){
  const acc={};
  Object.values(S.rounds).forEach(r=>{if(r.example)return;r.h.forEach(h=>{const a=h.sh||[];let n=0;
    a.forEach((e,j)=>{if(!e.to)return;n++;if(!e.g||e.to==='P')return;const k=e.pk||(n===1&&e.c?CODE2YC[e.c]:null);if(!k||!YC[k])return;

/* ---------- one tap per shot ----------

function derive(h){
  let from='T',n=0,pen=0,putts=0,chip=0,sand=0,girAt=null,teeTo=null,club=null,sg=null,sgGS=false,trN=0,trOk=0,gsN=0,gsOn=0,chN=0,chOn=0,pickOn=null;
  (h.sh||[]).forEach(e=>{
    if(e.drop){from=e.drop;return;}
    n++;const to=e.to,on=to==='G'||to==='H';
    if(from==='G')putts++;
    else if(from==='N'){chip++;chN++;if(on)chOn++;}
    else if(from==='GS'){sand++;gsN++;if(on)gsOn++;}
    if((from==='N'||from==='GS')&&sg==null&&girAt==null){sg=n-1+pen;sgGS=from==='GS';}
    if(from==='B'||from==='X'){trN++;if(INPLAY.has(to))trOk++;}
    if(n===1){teeTo=to;club=e.c||null;}
    if(h.pickAt!=null&&n===h.pickAt+1)pickOn=on;
    if(to==='P')pen++;
    if(girAt==null&&on)girAt=n+pen;
    from=to;
  });
  const done=from==='H';
  h.pen=pen;h.putts=n?putts:null;h.chip=chip;h.sand=sand;h.s=done?n+pen:null;
  h.tee=h.par>=4&&teeTo?(TEEMAP[teeTo]||null):null;h.club=h.par>=4?club:null;
  h.gir=done?(girAt!=null&&girAt<=h.par-2):null;

}

/* ---------- local copy (works with no signal on the course) ---------- */
let pending=new Set(),pendingDel=new Set();
function loadLocal(){try{const r=localStorage.getItem('psc.rounds');if(r)S.rounds=JSON.parse(r)||{};const p=localStorage.getItem('psc.pending');if(p)pending=new Set(JSON.parse(p));const d=localStorage.getItem('psc.del');if(d)pendingDel=new Set(JSON.parse(d));const c=localStorage.getItem('psc.cur');if(c&&S.rounds[c]){S.cur=c;S.hole=+(localStorage.getItem('psc.hole')||0);}}catch(e){}}
function saveLocal(){try{localStorage.setItem('psc.rounds',JSON.stringify(S.rounds));localStorage.setItem('psc.pending',JSON.stringify([...pending]));localStorage.setItem('psc.del',JSON.stringify([...pendingDel]));localStorage.setItem('psc.cur',S.cur||'');localStorage.setItem('psc.hole',String(S.hole));}catch(e){}}

/* ---------- saving to your account ---------- */
let writing=false,flushTimer=null,retryTimer=null;
function setSync(kind,text){const el=$('sync');el.className='sync '+(kind||'');el.querySelector('span').textContent=text;const d=$('sdot');if(d){d.className='sdot '+(kind||'');d.title=text;}}
function syncLabel(){
  if(HOSTED){setSync('ok','Saved on this phone');return;}
  if(!S.db){setSync('warn',S.dbState==='loading'?'Connecting…':'On this phone only');return;}
  if(pending.size||pendingDel.size)setSync('warn',writing?'Saving…':'Not saved yet, will retry');
  else setSync('ok','Saved to your account');
}
function touch(id){CTX=null;const r=S.rounds[id];if(!r)return;r.updated=Date.now();pending.add(id);saveLocal();clearTimeout(flushTimer);flushTimer=setTimeout(flush,800);syncLabel();}
async function flush(){
  if(!S.db||writing||!S.canWrite)return syncLabel();
  const del=[...pendingDel][0],id=del?null:[...pending][0];
  if(!del&&!id)return syncLabel();
  writing=true;syncLabel();
  try{
    if(del){await S.db.doc('rounds/'+del).delete();pendingDel.delete(del);}
    else{const body=JSON.parse(JSON.stringify(S.rounds[id]));await S.db.doc('rounds/'+id).set(body);if(S.rounds[id]&&S.rounds[id].updated===body.updated)pending.delete(id);}
    writing=false;saveLocal();
    if(pending.size||pendingDel.size)flush();else syncLabel();
  }catch(e){
    writing=false;
    if(e&&e.code==='invalid_argument'){S.canWrite=false;renderBanner();}
    syncLabel();clearTimeout(retryTimer);retryTimer=setTimeout(flush,15000);
  }
}
async function connect(){
  let db=null;try{db=await window.claude?.use?.('db');}catch(e){db=null;}
  if(!db){S.dbState='none';syncLabel();renderBanner();return;}
  S.db=db;
  try{const user=await window.claude.use('user');if(user){const own=await user.isOwner();if(own===false)S.canWrite=false;}}catch(e){}
  const slow=setTimeout(()=>{S.dbState='slow';renderBanner();},10000);
  db.collection('rounds').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(slow);S.dbState='live';}
    const seen=new Set();
    snap.docs.forEach(d=>{seen.add(d.id);if(pending.has(d.id)||pendingDel.has(d.id))return;const remote=d.data();const local=S.rounds[d.id];if(!local||(remote.updated||0)>=(local.updated||0))S.rounds[d.id]=JSON.parse(JSON.stringify(remote));});
    if(!snap.metadata.fromCache)Object.keys(S.rounds).forEach(id=>{if(!seen.has(id)&&!pending.has(id))delete S.rounds[id];});
    if(S.cur&&!S.rounds[S.cur])S.cur=null;
    saveLocal();renderBanner();syncLabel();
    if(!editingText()&&!S.sheet)render();
  },err=>{clearTimeout(slow);S.dbState='error';renderBanner();syncLabel();});
  syncLabel();flush();
}
function editingText(){const a=document.activeElement;return a&&a.tagName==='INPUT'&&(a.type==='text'||a.type==='number'||a.type==='date');}

/* ---------- stats ---------- */
function holeDone(h){return h.s!=null;}
function roundStats(r){
  const o={score:0,par:0,n:0,putts:0,puttHoles:0,three:0,threeH:0,one:0,fwHit:0,fwTries:0,gir:0,girTries:0,pen:0,extraShort:0,topped:0,scrTries:0,scrMade:0,dbl:0,
    udTries:0,udMade:0,ssTries:0,ssMade:0,trN:0,trOk:0,gsN:0,gsOn:0,chN:0,chOn:0,teeBad:0,
    tee:{fw:0,left:0,right:0,sand:0,trouble:0,short:0,pen:0},miss:{short:0,long:0,left:0,right:0},parType:{3:[0,0],4:[0,0],5:[0,0]},fp:{},teeClub:{}};
  const BADTEE=['pen','short','trouble','sand'];
  r.h.forEach(h=>{
    if(!holeDone(h))return;
    o.n++;o.score+=h.s;o.par+=h.par;const pt=o.parType[h.par];if(pt){pt[0]+=h.s-h.par;pt[1]++;}
    if(h.s-h.par>=2)o.dbl++;
    o.pen+=h.pen||0;
    if(h.putts!=null){o.putts+=h.putts;o.puttHoles++;if(h.putts>=3){o.three+=h.putts-2;o.threeH++;}if(h.putts===1)o.one++;
      if(h.fp){const b=o.fp[h.fp]||(o.fp[h.fp]={holes:0,putts:0,three:0});b.holes++;b.putts+=h.putts;if(h.putts>=3)b.three++;}}
    if(h.ud!=null){o.udTries++;if(h.ud)o.udMade++;if(h.udGS){o.ssTries++;if(h.ud)o.ssMade++;}}
    if(h.tr){o.trN+=h.tr[0];o.trOk+=h.tr[1];}
    if(h.gs){o.gsN+=h.gs[0];o.gsOn+=h.gs[1];}
    if(h.ch){o.chN+=h.ch[0];o.chOn+=h.ch[1];}
    if(h.par>=4&&h.tee){o.fwTries++;o.tee[h.tee]=(o.tee[h.tee]||0)+1;if(h.tee==='fw')o.fwHit++;if(h.tee==='short')o.topped++;if(BADTEE.includes(h.tee))o.teeBad++;
      if(h.club){const c=o.teeClub[h.club]||(o.teeClub[h.club]={n:0,fw:0,bad:0});c.n++;if(h.tee==='fw')c.fw++;if(BADTEE.includes(h.tee))c.bad++;}}
    if(h.gir!=null){o.girTries++;if(h.gir)o.gir++;else{if(h.miss)o.miss[h.miss]++;o.scrTries++;if(h.s<=h.par)o.scrMade++;}}
    const sg=(h.chip||0)+(h.sand||0);o.extraShort+=h.gir===false?Math.max(0,sg-1):sg;
  });

}
function sumStats(list){
  const t=roundStats({h:[]});
  list.forEach(r=>{const o=roundStats(r);['score','par','n','putts','puttHoles','three','threeH','one','fwHit','fwTries','gir','girTries','pen','extraShort','topped','scrTries','scrMade','dbl',
    'udTries','udMade','ssTries','ssMade','trN','trOk','gsN','gsOn','chN','chOn','teeBad'].forEach(k=>t[k]+=o[k]);
    Object.keys(o.tee).forEach(k=>t.tee[k]+=o.tee[k]);Object.keys(o.miss).forEach(k=>t.miss[k]+=o.miss[k]);
    [3,4,5].forEach(p=>{t.parType[p][0]+=o.parType[p][0];t.parType[p][1]+=o.parType[p][1];});
    Object.entries(o.fp).forEach(([k,b])=>{const x=t.fp[k]||(t.fp[k]={holes:0,putts:0,three:0});x.holes+=b.holes;x.putts+=b.putts;x.three+=b.three;});
    Object.entries(o.teeClub).forEach(([k,b])=>{const x=t.teeClub[k]||(t.teeClub[k]={n:0,fw:0,bad:0});x.n+=b.n;x.fw+=b.fw;x.bad+=b.bad;});});
  return t;
}
const pct=(a,b)=>b?Math.round(100*a/b)+'%':'–';
const vsPar=d=>d===0?'E':(d>0?'+'+d:String(d));

/* ---------- the hole map (viewBox 340 x 330: tee at the bottom, green at the top) ---------- */
const ANCH={T:[170,318],F:[170,240],L:[74,240],R:[266,240],Ro:[74,240],B:[236,228],X:[18,214],N:[116,126],GS:[82,96],G:[156,80],H:[188,70]};
const FAIRWAY='M112 330V214Q112 152 170 152Q228 152 228 214V330Z';
function pill(x,y,t,rot){const w=Math.round(t.length*6.9+18);return `<g class="ml"${rot?` transform="rotate(-90 ${x} ${y})"`:''}><rect x="${x-w/2}" y="${y-11}" width="${w}" height="22" rx="11"/><text x="${x}" y="${y+4.5}">${t}</text></g>`;}
function mapPts(h){
  const pts=[ANCH.T.slice()];let cur=ANCH.T.slice(),from='T',prevStart=cur;const seen={};
  const anchor=v=>{const a=(ANCH[v]||ANCH.F).slice(),k=seen[v]=(seen[v]||0)+1;if(k>1&&['F','L','R','Ro','X','B'].includes(v))a[1]=Math.max(160,a[1]-30*(k-1));return a;};
  let pen=false;
  (h.sh||[]).forEach(e=>{
    if(e.drop){const p=e.x!=null?[e.x,e.y]:(e.same?prevStart.slice():anchor(e.drop));cur=p;pts.push(p);from=e.drop;pen=false;return;}
    if(from==='G'&&e.to==='G')return;
    const start=cur;
    if(e.to==='P'){prevStart=start;from='P';pen=true;return;}
    const p=e.to==='H'?ANCH.H.slice():(e.x!=null?[e.x,e.y]:(e.f?[cur[0]+10,cur[1]-12]:anchor(e.to)));
    prevStart=start;cur=p;pts.push(p);from=e.to;

}
function mapSVG(h,mode,kk){

  const FW=`M112 ${VH}V${Y(214)}Q112 ${Y(152)} 170 ${Y(152)}Q228 ${Y(152)} 228 ${Y(214)}V${VH}Z`;
  let trees='';for(let y=12,j=0;y<VH+14;y+=26,j++){trees+=`<circle class="m-tree" cx="${j%2?20:17}" cy="${y}" r="14"/><circle class="m-tree" cx="${j%2?320:323}" cy="${y+13}" r="14"/>`;}

    ${Z('F','Fairway',`<path class="m-fair" d="${FW}"/><clipPath id="fwc"><path d="${FW}"/></clipPath><g clip-path="url(#fwc)">${stripes}</g><rect class="m-tee deco" x="150" y="${Y(316)-4}" width="40" height="14" rx="5"/>`)}
    ${Z('B','Fairway bunker',`<ellipse class="m-sand" cx="236" cy="${Y(228)}" rx="23" ry="${14*rk}"/><ellipse class="m-sand" cx="104" cy="${Y(284)}" rx="21" ry="${13*rk}"/>`)}

function svgPt(svg,ev){if(!ev||!ev.detail||!svg.getScreenCTM)return null;const m=svg.getScreenCTM();if(!m)return null;const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const q=p.matrixTransform(m.inverse()),k=(svg.viewBox&&svg.viewBox.baseVal&&svg.viewBox.baseVal.height||330)/330;return[Math.round(q.x),Math.round(q.y/k)];}

function curHole(){const r=S.rounds[S.cur];if(!r)return{};const i=Math.min(S.hole,r.h.length-1);return{r,i,h:r.h[i]};}

/* Play */

      <button class="hd-hole" data-act="holes" aria-haspopup="dialog" aria-label="Hole ${i+1}. Show all holes"><span class="hd-t">Hole ${i+1}${IC.chev}</span></button>

function staleHTML(i,h){

function dropHTML(h){

function puttHTML(h){

function historyHTML(h){
  const a=h.sh||[];if(!a.length)return '';

  a.forEach(e=>{
    if(e.drop){out.push('Drop: '+(e.drop==='T'?'tee':LBL[e.drop].toLowerCase()));from=e.drop;return;}
    let t=from==='G'?(e.to==='H'?'Made putt':'Missed putt'):(e.to==='H'?'Holed out':LBL[e.to]);

function doneHTML(r,i,h){

/* Sheets */
function renderSheet(){
  const w=$('sheet'),b=$('sheetBody');
  if(!S.sheet){w.hidden=true;b.innerHTML='';return;}
  const {r,i,h}=curHole();if(!r&&S.sheet!=='import'&&S.sheet!=='export'){S.sheet=null;w.hidden=true;return;}
  if(S.sheet==='qs')b.innerHTML=qsHTML(r,i,h);
  else if(S.sheet==='holes')b.innerHTML=holesHTML(r,i);
  else if(S.sheet==='plan')b.innerHTML=planHTML(r,i,h);
  else if(S.sheet==='import')b.innerHTML=importHTML();
  else if(S.sheet==='export')b.innerHTML=exportHTML();
  w.hidden=false;
}
function sheetHead(cap,title){return `<div class="sh-h"><div><span class="cap">${cap}</span><h2 class="t2">${title}</h2></div><button class="x" data-act="close" aria-label="Close">${IC.x}</button></div>`;}
function qsHTML(r,i,h){

    <div class="nums">${nums.map(n=>`<button class="nb${n===h.par?' par':''}" data-act="qsn" data-v="${n}" aria-pressed="${S.qs.s===n}"><span class="num">${n}</span><small>${scoreShort(n-h.par)}</small></button>`).join('')}</div>

}
function holesHTML(r,i){

function importHTML(){return `${sheetHead('From the GPS version','Paste rounds')}

/* Toast */
let toastTimer=null;
function toast(msg,undo){const t=$('toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">Undo</button>':''}`;t.hidden=false;t.style.animation='none';void t.offsetWidth;t.style.animation='';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},3200);}

/* Rounds */
function viewRounds(){
  const rows=sortedRounds();
  const live=rows.find(([,r])=>r.status!=='done'&&!r.example);
  const recent=[...new Set(rows.filter(([,r])=>!r.example&&r.course).map(([,r])=>r.course.trim()))].slice(0,4);
  const resume=live?(()=>{const [id,r]=live;const j=r.h.findIndex(x=>!holeDone(x));return `<button class="resume" data-act="open" data-id="${id}"><span><b>Keep playing</b><small>${esc(r.course||'Round')} · hole ${(j<0?r.h.length-1:j)+1}</small></span>${IC.arrow}</button>`;})():'';
  const list=rows.map(([id,r])=>{const o=roundStats(r),done=r.h.filter(holeDone).length;
    return `<button class="lr" data-act="summary" data-id="${id}"><span><b>${esc(r.course||'Unnamed course')}${r.example?'<span class="tagx">Example</span>':''}</b><small>${esc(r.date||'')} · ${done===r.h.length?r.h.length+' holes':done+' of '+r.h.length+' holes'}</small></span><span class="num">${o.n?o.score:'–'}</span><span class="pillx ${o.n?toneCls(Math.sign(o.score-o.par)*Math.min(2,Math.abs(o.score-o.par))):''}">${o.n?vsPar(o.score-o.par):'–'}</span></button>`;}).join('');
  return `<h1 class="t1">Rounds</h1>${resume}
    <section class="box" aria-label="New round"><h2 class="t3">New round</h2>
      <input class="inp" type="text" id="f-course" placeholder="Course name" autocomplete="off" value="${esc(S.newCourse)}" aria-label="Course name">
      ${recent.length?`<div class="pills">${recent.map(c=>`<button class="pl" data-act="pickcourse" data-v="${esc(c)}" aria-pressed="${S.newCourse===c}">${esc(c)}</button>`).join('')}</div>`:''}
      <div class="r2"><div class="seg big" role="group" aria-label="Holes"><button data-act="nh" data-v="18" aria-pressed="${S.newHoles!==9}">18 holes</button><button data-act="nh" data-v="9" aria-pressed="${S.newHoles===9}">9 holes</button></div>
        <input class="inp sm" type="date" id="f-date" value="${today()}" aria-label="Date"></div>
      <button class="cta" data-act="start">Start round</button>
      <p class="sub">Pars copy over from your last round at the same course.</p></section>
    ${rows.length?`<h2 class="t3">Past rounds</h2><div class="list">${list}</div>`:`<section class="empty"><p class="sub">Your rounds show up here after you start one.</p></section>`}
    ${HOSTED?`<section class="box"><h2 class="t3">Send rounds to your account</h2><p class="sub">This GPS version saves on this phone. After a round, copy your rounds and paste them into your Stat Card so Claude can read them.</p>
      <div class="r2"><button class="cta" data-act="copyx">Copy rounds</button><a class="cta sec" href="${STAT_URL}" target="_blank" rel="noopener" style="text-decoration:none">Open Stat Card ↗</a></div></section>`
    :`<section class="box"><h2 class="t3">GPS yards on the course</h2><p class="sub">The GPS version shows yards to the green from where you stand and learns your real club distances. It saves on your phone; paste its rounds here after you play.</p>
      <div class="r2"><a class="cta sec" href="${GPS_URL}" target="_blank" rel="noopener" style="text-decoration:none">Open GPS version ↗</a><button class="cta sec" data-act="import">Paste rounds</button></div></section>`}`;
}
function scorecardHTML(r){
  const nine=(a,b,lab)=>{const hs=r.h.slice(a,b);if(!hs.length)return '';let ts=0,tp=0,tpu=0;
    const sc=hs.map(h=>{if(h.s!=null)ts+=h.s;tp+=h.par;tpu+=h.putts||0;const d=h.s==null?null:h.s-h.par;return `<td>${h.s==null?'–':`<span class="mk ${markCls(d)}">${h.s}</span>`}</td>`;}).join('');
    return `<div class="scw"><table class="sc"><thead><tr><th class="rl">Hole</th>${hs.map((h,k)=>`<th>${a+k+1}</th>`).join('')}<th>${lab}</th></tr></thead>

/* Stats */
function meter(you,sc,max,good){const w=Math.max(0,Math.min(100,100*you/max)),s=Math.max(0,Math.min(100,100*sc/max));return `<div class="meter" aria-hidden="true"><i class="${good?'ok':''}" style="width:${w}%"></i><em style="left:${s}%"></em></div>`;}
function viewStats(){
  const all=sortedRounds().map(x=>x[1]),real=all.filter(r=>!r.example),use=real.length?real:all,o=sumStats(use);
  if(!o.n)return `<h1 class="t1">Stats</h1><section class="empty"><div class="empty-ic">${IC.flag}</div><p class="sub">Play a few holes and this ranks where your shots go and compares you with a scratch golfer.</p><button class="cta" data-go="rounds">Start a round</button></section>`;
  const holes=o.n,per=x=>perRound(x,holes),d1=x=>x.toFixed(1);
  const leaks=[['Penalty strokes',per(o.pen),'pen'],['3-putts',per(o.three),'three'],['Extra chips and bunker shots',per(o.extraShort),'short'],['Shots that stayed in trouble',per(o.trN-o.trOk),'trouble']];
  if(o.topped)leaks.push(['Topped or short tee shots',per(o.topped),'topped']);
  leaks.sort((a,b)=>b[1]-a[1]);
  const FOCUS={pen:['Off the tee, pick the club you keep in play. Your 3-wood was your straightest long club at the bay. In trouble, take the easy way back to the fairway.','https://claude.ai/artifact/8b6MXTYjy6bSchY3kZzVWk#trouble','Smart plays in trouble'],
    three:['On long putts, roll the first one to stop 1 to 2 feet past the hole. Speed first, line second.','https://claude.ai/artifact/DE1uvTn7rwDe9e5bKfLoK9#deadly','Putting Lab'],
    short:['Around the green, pick one shot you trust and get the ball on the green with the first chip, even if it finishes 15 feet away.','https://claude.ai/artifact/8b6MXTYjy6bSchY3kZzVWk#chip','Chip planner'],
    trouble:['From trees or a fairway bunker, take the widest gap back to the fairway, even sideways. One shot out beats two shots in.','https://claude.ai/artifact/8b6MXTYjy6bSchY3kZzVWk#trouble','Smart plays in trouble'],
    topped:['A tee shot in play beats a long one. Standing up through the ball is what tops it, so keep your spine angle.','https://claude.ai/artifact/8Z35pNogEvSzqEgLWsseiJ#spine','Car Door Hips']};
  const top=leaks[0],fz=FOCUS[top[2]],lmax=Math.max(1,...leaks.map(l=>l[1]));
  const P=(a,b)=>b?100*a/b:null;
  const VS=[['Fairways hit',P(o.fwHit,o.fwTries),50,true],['Greens in regulation',P(o.gir,o.girTries),56,true],['Up and down',P(o.udMade,o.udTries),54,true],
    ['Putts per 18',o.puttHoles?o.putts*18/o.puttHoles:null,30.7,false],['3-putts per 18',o.puttHoles?o.threeH*18/o.puttHoles:null,1,false],
    ['Tee shots in trouble per 18',o.fwTries?per(o.teeBad):null,2.1,false],['Doubles or worse per 18',per(o.dbl),0.7,false]];
  const vsRows=VS.map(([k,y,sc,hi])=>{const isPct=hi,fmt=v=>v==null?'–':isPct?Math.round(v)+'%':d1(v);const good=y!=null&&(hi?y>=sc:y<=sc);
    const max=isPct?100:Math.max(sc*2,(y||0)*1.15);
    return `<div class="vs-r"><div class="vs-l"><span>${k}</span><span class="vs-n"><b class="num">${fmt(y)}</b><small>scratch ${isPct?sc+'%':sc}</small></span></div>${y==null?'<div class="meter"></div>':meter(y,sc,max,good)}</div>`;}).join('');
  const teeTot=Object.values(o.tee).reduce((a,b)=>a+b,0);
  const fpRows=PUTT_LEN.filter(([k])=>o.fp[k]).map(([k,l])=>{const b=o.fp[k];return `<tr><td class="l">${l}</td><td>${b.holes}</td><td>${(b.putts/b.holes).toFixed(1)}</td><td>${pct(b.three,b.holes)}</td></tr>`;}).join('');
  const clubRows=TCLUB.filter(([k])=>o.teeClub[k]).map(([k,l])=>{const b=o.teeClub[k];return `<tr><td class="l">${l}</td><td>${b.n}</td><td>${pct(b.fw,b.n)}</td><td>${pct(b.bad,b.n)}</td></tr>`;}).join('');
  const parRows=[3,4,5].filter(p=>o.parType[p][1]).map(p=>`<tr><td class="l">Par ${p}</td><td>${o.parType[p][1]}</td><td>${(o.parType[p][0]/o.parType[p][1]>=0?'+':'')+(o.parType[p][0]/o.parType[p][1]).toFixed(2)}</td></tr>`).join('');
  const teeRows=TEE.filter(([k])=>k!=='short'||o.tee.short).map(([k,l])=>`<tr><td class="l">${l}</td><td>${o.tee[k]||0}</td><td>${pct(o.tee[k]||0,teeTot)}</td></tr>`).join('');
  return `<div><h1 class="t1">Stats</h1><p class="sub">${use.length} ${use.length===1?'round':'rounds'} · ${holes} holes${!real.length?' · example round':''}</p></div>
    ${!real.length?'<p class="notex">These numbers come from the example round. Your own rounds replace it as soon as you play one.</p>':''}
    <section class="hero"><span class="cap">Biggest leak</span><h2 class="t2">${top[0]}</h2><div class="big num">${d1(top[1])}<small>shots per 18</small></div><p>${fz[0]}</p><a class="lnk" href="${fz[1]}" target="_blank" rel="noopener">Open ${fz[2]} ↗</a></section>
    <section class="box"><h2 class="t3">You vs a scratch golfer</h2><div class="key"><span><i></i>You</span><span><em></em>Scratch</span></div><div class="vs">${vsRows}</div>
      <p class="src">Scratch averages from Shot Scope and Arccos data, reported by Golf Monthly.</p></section>
    <section class="box"><h2 class="t3">Where your shots go</h2><p class="sub">Per 18 holes</p>
      ${leaks.map(l=>`<div class="lb"><span>${l[0]}</span><b>${d1(l[1])}</b>${meter(l[1],0,lmax,false).replace('<em style="left:0%"></em>','')}</div>`).join('')}</section>
    <section class="box"><h2 class="t3">Trouble and short game</h2>
      ${o.trN+o.gsN+o.chN?`<div class="bento">
        <div class="tile"><span class="num">${pct(o.trOk,o.trN)}</span><span>Out of trees or a fairway bunker in one (${o.trN})</span></div>
        <div class="tile"><span class="num">${pct(o.gsOn,o.gsN)}</span><span>Greenside bunker shots onto the green (${o.gsN})</span></div>
        <div class="tile"><span class="num">${pct(o.chOn,o.chN)}</span><span>Chips and pitches onto the green (${o.chN})</span></div>
        <div class="tile"><span class="num">${pct(o.ssMade,o.ssTries)}</span><span>Sand saves (${o.ssTries})</span></div></div>`:'<p class="sub">Fills in as you tap shots from trees, bunkers and near the green.</p>'}
      <a class="lnk" href="https://claude.ai/artifact/8b6MXTYjy6bSchY3kZzVWk" target="_blank" rel="noopener">Open Short Game School ↗</a></section>
    <details class="more"><summary>More numbers</summary><div class="more-b">
      <div><h3>Tee shots, par 4s and 5s</h3><div class="tw"><table class="dt"><thead><tr><th class="l">Result</th><th>Shots</th><th>Share</th></tr></thead><tbody>${teeRows}</tbody></table></div></div>
      ${clubRows?`<div><h3>Tee shots by club</h3><div class="tw"><table class="dt"><thead><tr><th class="l">Club</th><th>Shots</th><th>Fairway</th><th>Trouble</th></tr></thead><tbody>${clubRows}</tbody></table></div></div>`:''}
      <div><h3>Putting by first-putt length</h3>${fpRows?`<div class="tw"><table class="dt"><thead><tr><th class="l">First putt</th><th>Holes</th><th>Putts</th><th>3-putts</th></tr></thead><tbody>${fpRows}</tbody></table></div>`:'<p class="sub">Tap the first-putt length on the green to fill this in.</p>'}</div>
      ${(()=>{const L=learnedDist(),ks=Object.keys(YC).filter(k=>L[k]);return ks.length?`<div><h3>Club distances on the course (GPS)</h3><div class="tw"><table class="dt"><thead><tr><th class="l">Club</th><th>Shots</th><th>Course</th><th>Bay</th></tr></thead><tbody>${ks.map(k=>`<tr><td class="l">${YNAME[k]}</td><td>${L[k].n}</td><td>${Math.round(L[k].avg)}</td><td>${Math.round(YC[k].mid)}</td></tr>`).join('')}</tbody></table></div></div>`:'';})()}
      ${cardCheck(use)}
      <div><h3>Scoring by par</h3><div class="tw"><table class="dt"><thead><tr><th class="l">Hole type</th><th>Holes</th><th>Average vs par</th></tr></thead><tbody>${parRows}</tbody></table></div></div>
    </div></details>`;
}
function cardCheck(list){
  const by={},tot={n:0,on:0,short:0,long:0,side:0};
  list.forEach(r=>r.h.forEach(h=>{
    const on=h.pickOn!=null?h.pickOn:h.gir;
    if(!h.yd||!h.app||!h.pick||YCODE[h.pick]!==h.app||on==null)return;
    const res=on?'on':(h.miss==='short'||h.miss==='long'?h.miss:(h.miss?'side':null));if(!res)return;
    const b=by[h.pick]||(by[h.pick]={n:0,on:0,short:0,long:0,side:0});b.n++;b[res]++;tot.n++;tot[res]++;}));
  if(!tot.n)return `<div><h3>Yardage Card check</h3><p class="sub">Before a shot to the green, tap the yards above the map, slide to the real number and tap Hit the club it picks. After a round this shows whether your course distances match your bay numbers.</p></div>`;
  const rows=Object.keys(YC).filter(k=>by[k]).map(k=>{const b=by[k];return `<tr><td class="l">${YNAME[k]}</td><td>${b.n}</td><td>${b.on}</td><td>${b.short}</td><td>${b.long}</td><td>${b.side}</td></tr>`;}).join('');
  const lean=tot.short>tot.long+1?'You come up short more often than long, so the course plays longer than the bay. Take one more club until your card catches up.':tot.long>tot.short+1?'You fly it long more often than short. Take one less club when the card is between two.':'Short and long misses are about even, so the card’s distances fit the course.';
  return `<div><h3>Yardage Card check</h3><p class="sub">${tot.n} ${tot.n===1?'shot':'shots'} where you hit the club the card picked. ${lean}</p>
    <div class="tw"><table class="dt"><thead><tr><th class="l">Club</th><th>Shots</th><th>On</th><th>Short</th><th>Long</th><th>Side</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ---------- actions ---------- */
function tapped(h,msg){S.justTapped=true;S.staleOk=null;if(!isQuick(h))derive(h);touch(S.cur);render();S.justTapped=false;toast(msg,true);}
document.addEventListener('click',ev=>{
  const go=ev.target.closest('[data-go]');if(go){S.sheet=null;renderSheet();setView(go.dataset.go);return;}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,{r,i,h}=curHole();
  if(act!=='del'&&S.confirmDel){S.confirmDel=null;}
  if(!S.canWrite&&['start','res','drop','putt','undo','plus1','par','npar','tclub','qssave','tap','finish','del','fp','miss','hit','pstep','cond','doimport'].includes(act)){renderBanner();return;}
  const redo=()=>{if(h&&!isQuick(h))derive(h);touch(S.cur);render();};
  switch(act){
    case 'pages':{const g=$('gmOpen');if(g)g.click();break;}
    case 'nh':S.newHoles=+b.dataset.v;render();break;
    case 'pickcourse':S.newCourse=b.dataset.v;render();break;
    case 'start':{const n=S.newHoles===9?9:18,id='r'+Date.now().toString(36),course=(($('f-course')||{}).value||'').trim();
      const prev=course?sortedRounds().map(x=>x[1]).find(x=>!x.example&&(x.course||'').trim().toLowerCase()===course.toLowerCase()):null;
      S.rounds[id]={course,date:($('f-date')||{}).value||today(),holes:n,h:Array.from({length:n},(_,j)=>{const x=blankHole(prev&&prev.h[j]?prev.h[j].par:4);if(prev&&prev.h[j]&&prev.h[j].len)x.len=prev.h[j].len;if(prev&&prev.h[j]&&prev.h[j].parSet)x.parSet=1;return x;}),status:'playing',created:Date.now(),updated:Date.now()};
      S.cur=id;S.hole=0;S.newCourse='';touch(id);setView('play');break;}
    case 'open':{S.cur=b.dataset.id;const rr=S.rounds[S.cur];const k=rr?rr.h.findIndex(x=>!holeDone(x)):0;S.hole=k<0?0:k;saveLocal();setView('play');break;}
    case 'summary':S.cur=b.dataset.id;saveLocal();setView('summary');break;
    case 'fill':S.hole=+b.dataset.v;saveLocal();S.qs={s:null,p:null};S.sheet='qs';setView('play');renderSheet();break;
    case 'del':{const id=b.dataset.id;if(S.confirmDel!==id){S.confirmDel=id;render();break;}
      S.confirmDel=null;delete S.rounds[id];pending.delete(id);pendingDel.add(id);if(S.cur===id)S.cur=null;saveLocal();clearTimeout(flushTimer);flushTimer=setTimeout(flush,300);syncLabel();setView('rounds');break;}
    case 'holes':S.sheet='holes';renderSheet();break;
    case 'hole':S.hole=+b.dataset.v;S.sheet=null;saveLocal();renderSheet();render();window.scrollTo(0,0);break;
    case 'next':S.hole=Math.min(r.h.length-1,S.hole+1);saveLocal();render();window.scrollTo(0,0);break;
    case 'finish':r.status='done';S.sheet=null;renderSheet();touch(S.cur);setView('summary');break;
    case 'close':{const was=S.sheet;if(was==='plan')savePlanYd();S.sheet=null;renderSheet();if(was==='plan')render();break;}
    case 'par':h.par=+b.dataset.v;h.parSet=1;if(h.par===3){h.tee=null;h.club=null;}redo();if(S.sheet==='plan')renderSheet();break;
    case 'npar':{const nx=r.h[i+1];if(nx){nx.par=+b.dataset.v;if(!isQuick(nx)&&nx.sh&&nx.sh.length)derive(nx);}touch(S.cur);render();break;}
    case 'tclub':r.tc=b.dataset.v;h.tc=b.dataset.v;touch(S.cur);render();break;
    case 'res':{if(!h.sh)h.sh=[];const c=strokesOf(h),e=stamp({to:b.dataset.v,t:Date.now()});
      if(c.n===0&&pos(h)==='T'&&h.par>=4)e.c=teeClubFor(r,h);
      const nx=h.nextPk&&h.nextPk.n===c.n?h.nextPk:null;
      if(nx){e.pk=nx.k;e.d=nx.d;}
      else if(e.c&&CODE2YC[e.c]){e.pk=CODE2YC[e.c];e.d=Math.round(clubMid(e.pk,planCtx()));}
      else{const rem=remainingYd(h);if(rem){const s0=planFor(h,rem.yd).steps[0];e.d=stepDist(s0);}}
      const svg=b.closest('svg');const pt=svg?svgPt(svg,ev):null;if(pt){e.x=pt[0];e.y=pt[1];}
      h.sh.push(e);if(h.cond)h.cond=Object.assign({},h.cond,{l:lieFor(e.to),s:'flat'});
      tapped(h,`Shot ${c.n+c.p+1}: ${e.to==='H'?'holed':LBL[e.to].toLowerCase()}`);break;}
    case 'drop':{const v=b.dataset.v,e=stamp(v==='same'?{drop:prevFrom(h),same:1,t:Date.now()}:{drop:v,t:Date.now()});
      const svg=b.closest('svg');const pt=svg?svgPt(svg,ev):null;if(pt){e.x=pt[0];e.y=pt[1];}
      h.sh.push(e);if(h.cond)h.cond=Object.assign({},h.cond,{l:lieFor(e.drop)});tapped(h,`Playing from ${v==='same'?'the same spot':LBL[v].toLowerCase()}`);break;}
    case 'putt':{if(!h.sh)h.sh=[];const k=(h.putts||0)+1;if(k===1)learnGreen(r,i);h.sh.push(stamp({to:b.dataset.v==='made'?'H':'G',t:Date.now()}));tapped(h,b.dataset.v==='made'?`Holed on putt ${k}`:`Putt ${k} missed`);if(pos(h)==='H')window.scrollTo(0,0);break;}
    case 'plus1':{if(!h.sh)h.sh=[];h.sh.push(stamp({to:pos(h),f:1,t:Date.now()}));const c=strokesOf(h);tapped(h,`Added a shot. Now on shot ${c.n+c.p+1}`);break;}
    case 'undo':{$('toast').hidden=true;if(h&&h.sh&&h.sh.length&&!isQuick(h)){h.sh.pop();redo();}break;}
    case 'staleok':S.staleOk=S.cur+':'+i;render();break;
    case 'fp':h.fp=h.fp===b.dataset.v?null:b.dataset.v;touch(S.cur);render();break;
    case 'miss':h.miss=h.miss===b.dataset.v?null:b.dataset.v;touch(S.cur);render();break;
    case 'qs':S.qs={s:h.s!=null?h.s:null,p:h.s!=null?h.putts:null};S.sheet='qs';renderSheet();break;
    case 'qsn':S.qs.s=+b.dataset.v;renderSheet();break;
    case 'qsp':S.qs.p=S.qs.p===+b.dataset.v?null:+b.dataset.v;renderSheet();break;
    case 'qssave':{if(S.qs.s==null)break;h.quick=true;h.s=S.qs.s;h.putts=S.qs.p;S.sheet=null;renderSheet();touch(S.cur);render();window.scrollTo(0,0);toast(`Hole ${i+1}: ${h.s} saved`,false);break;}
    case 'tap':h.quick=false;if(!h.sh)h.sh=[];redo();break;
    case 'plan':{const rem=remainingYd(h),c=strokesOf(h),tee=c.n===0&&pos(h)==='T';S.planYd=rem?rem.yd:(tee?(h.par===3?150:h.par===5?480:370):150);S.planSrc=null;S.sheet='plan';renderSheet();break;}
    case 'pstep':setPlanYd(S.planYd+(+b.dataset.d),'b');savePlanYd();break;
    case 'gpsuse':{const g=gpsYards();if(g){setPlanYd(g.mid,'b');S.planSrc='gps';const t=$('pl-src');if(t)t.textContent='GPS yards to the middle of the green';const l=$('gpsline');if(l)l.innerHTML=gpsLineHTML();}break;}
    case 'cond':{const c=Object.assign({},h.cond||defCond(h));c[b.dataset.k]=b.dataset.v;h.cond=c;S.condOpen=true;touch(S.cur);renderSheet();break;}
    case 'hit':{const k=b.dataset.k,d=+b.dataset.d,c=strokesOf(h),tee=c.n===0&&pos(h)==='T';
      if(S.planSrc==='set')savePlanYd();
      h.nextPk={n:c.n,k,d};
      if(tee&&h.par>=4)h.tc=TEECODE[k]||'iron';
      if(b.dataset.reach==='1'){h.app=YCODE[k]||null;h.pick=k;h.pickAt=c.n;h.miss=null;if(!h.yd||h.ydN!==c.n){h.yd=S.planYd;h.ydN=c.n;}}
      S.sheet=null;renderSheet();redo();toast(`${YNAME[k]} it is. Tap where it lands.`,false);break;}
    case 'import':S.sheet='import';renderSheet();break;
    case 'doimport':{const n=importCode(($('imp')||{}).value);if(n<0){toast('That code didn’t read. Copy it again and paste the whole thing.',false);break;}S.sheet=null;renderSheet();render();toast(n?`Added ${n} ${n===1?'round':'rounds'}`:'Those rounds are already here',false);break;}
    case 'copyx':{const code=exportCode(),cnt=Object.values(S.rounds).filter(x=>!x.example).length;
      const ok=()=>toast(`Copied ${cnt} ${cnt===1?'round':'rounds'}. In your Stat Card: Rounds → Paste rounds.`,false),bad=()=>{S.sheet='export';renderSheet();const t=$('exp');if(t){t.focus();t.select();}};
      try{navigator.clipboard.writeText(code).then(ok,bad);}catch(e){bad();}break;}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.sheet){if(S.sheet==='plan')savePlanYd();S.sheet=null;renderSheet();render();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('z')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
document.addEventListener('input',e=>{
  if(e.target.id==='pl-r'){setPlanYd(+e.target.value,'s');return;}
  if(e.target.id==='pl-n'){const v=parseInt(e.target.value,10);if(v>0)setPlanYd(v,'n');return;}
  if(e.target.id==='f-course')S.newCourse=e.target.value;
});
document.addEventListener('change',e=>{if(e.target.id==='pl-r'||e.target.id==='pl-n')savePlanYd();});
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='condd')S.condOpen=e.target.open;},true);
const ROUTES=['rounds','play','stats','summary'];
window.addEventListener('hashchange',()=>{let v=location.hash.slice(1);if(v==='patterns')v='stats';if(ROUTES.includes(v)&&v!==S.view){S.view=v;render();}});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&(pending.size||pendingDel.size)){clearTimeout(flushTimer);flush();}
  if(document.visibilityState==='hidden')gpsStop();
  if(document.visibilityState==='visible'&&S.view==='play'&&!S.sheet&&!editingText())render();
});
window.addEventListener('online',()=>{clearTimeout(flushTimer);flush();});
let fitT=null;window.addEventListener('resize',()=>{clearTimeout(fitT);fitT=setTimeout(fitMap,120);});
loadLocal();
let hv=location.hash.slice(1);if(hv==='patterns')hv='stats';
S.view=ROUTES.includes(hv)?hv:(S.cur&&S.rounds[S.cur]&&S.rounds[S.cur].status!=='done'?'play':'rounds');
render();syncLabel();connect();
})();
</script>

    </div>
    <div class="gm-here" id="gmHere" hidden>
      <p class="gm-label">On this page</p>
      <div class="gm-jump"></div>
    </div>
    <div class="gm-groups"></div>
    <p class="gm-foot">Other pages open in a new tab.</p>
  </div>
</dialog>
<script>
(() => {
  const HERE = 'stat';
  const ART = 'https://claude.ai/artifact/';
  // Glyphs drawn on a 22-unit grid, white on each page's color tile.
  const ICONS = {
    yardage: '<path d="M7 19V3.5"/><path class="f" d="M7.6 3.2 16.5 7 7.6 10.8z"/><path d="M4 19h7"/>',
    smarts: '<path d="M5 18.5c1.2-4.6 3.4-6 6.2-7s4.6-3 4.8-6.8"/><circle class="f" cx="16" cy="4.6" r="2"/><circle class="f" cx="5" cy="18.4" r="1.4"/>',
    plan: '<rect x="3.5" y="5" width="15" height="13.5" rx="3"/><path d="M3.5 9.5h15M7.5 3v4M14.5 3v4"/><circle class="f" cx="8" cy="13.6" r="1.2"/><circle class="f" cx="11" cy="13.6" r="1.2"/>',
    lab: '<path d="M4.5 17.5C6.5 9.5 11 5.5 17.5 4.5"/><path d="M14 3.6l3.6.9-1.4 3.4"/><circle class="f" cx="4.6" cy="17.4" r="2"/>',
    doctor: '<path d="M11 5v12M5 11h12" stroke-width="3"/>',
    school: '<circle cx="11" cy="4.6" r="2"/><path d="M11 7v6.5M11 13.5 7.5 19M11 13.5l3.5 5.5M6.5 9.5h9"/>',
    words: '<path d="M5 4.5h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-6.5L6.5 19v-3.5H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z"/>',
    dict: '<path d="M11 6.5C9 5 6.2 4.7 3.5 5.3v12c2.7-.6 5.5-.3 7.5 1.2 2-1.5 4.8-1.8 7.5-1.2v-12C15.8 4.7 13 5 11 6.5zM11 6.5v12"/>',
    quiz: '<path d="M8 8.2a3 3 0 1 1 4.3 2.7c-.9.5-1.3 1.2-1.3 2.1v.6"/><circle class="f" cx="11" cy="17" r="1.3"/>',
    bag: '<path d="M7 3l7.5 13.5"/><path class="f" d="M13.4 15.2l4.2-1.6 1 3.4c-1.7 1.3-3.6 1.5-4.8.5z"/>',
    putt: '<path d="M8.5 3l2.6 12.6"/><path class="f" d="M8 15h6.5a2 2 0 0 1 0 4H8z"/><circle class="f" cx="17.5" cy="10.5" r="1.9"/>',
    hips: '<rect x="5" y="3.5" width="12" height="15" rx="2.2"/><path d="M5 10h12M13.5 13h1.8"/>',
    short: '<path d="M3.5 17c3-2 5-2 7.5 0s4.5 2 7.5 0"/><circle class="f" cx="11" cy="10" r="2.3"/><path d="M7 7.5 5.6 5.4M15 7.5l1.4-2.1M11 6V3.6"/>',
    stat: '<rect x="4.5" y="3.5" width="13" height="15.5" rx="2.6"/><path d="M8 8h6M8 11.5h6M8 15h3.5"/>',
    anybag: '<rect x="6.5" y="8" width="9" height="11" rx="2.2"/><path d="M9 8V4M13 8V5.5M6.5 13h9"/><circle class="f" cx="9" cy="3.4" r="1.3"/><circle class="f" cx="13" cy="4.8" r="1.3"/>'
  };
  const GROUPS = [
    ['On the course', [
      ['stat', 'Pocket Stat Card', 'VcfNY1dxSAwn9mLK8Jzr3U', 'Log each hole; it picks your club and finds your leaks.', '#0B6E99'],
      ['yardage', 'Yardage Card', 'R21VqgaRqjZ4Ueao7tNRoJ', 'Yards and wind in, club out.', '#34C759']
    ]],
    ['Fix your game', [
      ['hips', 'Car Door Hips', '8Z35pNogEvSzqEgLWsseiJ', 'Early extension and spine angle, in 3D.', '#D97706'],
      ['short', 'Short Game School', '8b6MXTYjy6bSchY3kZzVWk', 'Chips, pitches, bunkers and trouble shots.', '#0E7490'],
      ['putt', 'Putting Lab', 'DE1uvTn7rwDe9e5bKfLoK9', 'Toe check, pace, reads and short putts.', '#2563EB'],
      ['doctor', 'Shot Doctor', '1dnk9NojF8CyRyfXe1WcNU', 'Pick a bad shot, get the cause and the fix.', '#FF2D55']
    ]],
    ['Your swing and numbers', [
      ['lab', 'Ball Flight Lab', '25WmYhfQDj9BWgzXRbjRB2', 'Your Trackman sessions, explained.', '#007AFF'],
      ['school', 'Swing School', '9DRQaFabXJ85qXRBvyLoZ9', 'Grip, posture, stance and aim in 3D.', '#AF52DE']
    ]],
    ['Your gear', [
      ['anybag', 'Any-Brand Bag', 'Bc1W159KgbRqmzh5GzshWt', 'The best club per slot, from any brand.', '#0F766E'],
      ['bag', 'Mizuno Bag', 'TjzsnvZ115vkRrUm5XGKyQ', 'The clubs and specs your numbers point to.', '#48484A']
    ]]
  ];
  const ARROW = '<svg class="gm-end" viewBox="0 0 18 18" aria-hidden="true"><path d="M6 12 12 6M7 6h5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CHECK = '<svg class="gm-end" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 9.5 7.5 13 14 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const dlg = document.getElementById('gmDrawer');
  const fab = document.getElementById('gmOpen');
  const wide = matchMedia('(min-width: 720px)');
  const still = matchMedia('(prefers-reduced-motion: reduce)');

  function fill(box) {
    box.textContent = '';
    GROUPS.forEach(([label, pages]) => {
      const g = document.createElement('div');
      g.className = 'gm-group';
      const l = document.createElement('p');
      l.className = 'gm-label';
      l.textContent = label;
      const list = document.createElement('div');
      list.className = 'gm-list';
      pages.forEach(([key, name, id, blurb, color]) => {
        const a = document.createElement('a');
        a.className = 'gm-row';
        const here = key === HERE;
        a.innerHTML = '<span class="gm-ico" style="--c:' + color + '"><svg viewBox="0 0 22 22" aria-hidden="true">' + ICONS[key] + '</svg></span>' +
          '<span class="gm-txt"><b></b><small></small></span>' + (here ? CHECK : ARROW);
        a.querySelector('b').textContent = name;
        a.querySelector('small').textContent = here ? 'You’re here' : blurb;
        if (here) {
          a.href = '#';
          a.setAttribute('aria-current', 'page');
          a.addEventListener('click', e => { e.preventDefault(); close(); window.scrollTo({ top: 0, behavior: still.matches ? 'auto' : 'smooth' }); });
        } else {
          a.href = ART + id;
          a.target = '_blank';
          a.rel = 'noopener';
        }
        list.appendChild(a);
      });
      g.append(l, list);
      box.appendChild(g);
    });
  }

  // Open and close with the sheet's own motion; the native dialog keeps focus, Esc and the dimmed page.
  let closing = false;
  function open() {
    if (dlg.open) return;
    dlg.classList.remove('gm-closing', 'gm-dragging');
    dlg.style.transform = '';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    fab.setAttribute('aria-expanded', 'true');
  }
  function finish() {
    closing = false;
    dlg.classList.remove('gm-closing', 'gm-dragging');
    dlg.style.transform = '';
    if (dlg.close) dlg.close(); else dlg.removeAttribute('open');
    fab.setAttribute('aria-expanded', 'false');
  }
  function close() {
    if (!dlg.open || closing) return;
    closing = true;
    dlg.classList.remove('gm-dragging');
    if (still.matches) { finish(); return; }
    dlg.classList.add('gm-closing');
    let done = false;
    const end = () => { if (!done) { done = true; finish(); } };
    dlg.addEventListener('animationend', end, { once: true });
    setTimeout(end, 420);
  }
  dlg.addEventListener('cancel', e => { e.preventDefault(); close(); });
  dlg.addEventListener('click', e => { if (e.target === dlg) close(); });
  fab.addEventListener('click', open);
  document.getElementById('gmClose').addEventListener('click', close);

  // Pull the sheet down to dismiss it (phones); a short or slow pull springs back.
  let drag = null;
  function down(e) {
    if (wide.matches || e.button > 0 || e.target.closest('button, a')) return;
    drag = { y: e.clientY, t: performance.now(), dy: 0, v: 0, id: e.pointerId };
    dlg.classList.add('gm-dragging');
    dlg.style.transition = 'none';
    e.currentTarget.setPointerCapture(e.pointerId);
  }
  function move(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const now = performance.now();
    const dy = e.clientY - drag.y;
    drag.v = (dy - drag.dy) / Math.max(1, now - drag.t);
    drag.dy = dy; drag.t = now;
    dlg.style.transform = 'translateY(' + (dy > 0 ? dy : dy / 4) + 'px)';
  }
  function up(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const { dy, v } = drag;
    drag = null;
    dlg.style.transition = '';
    if (dy > 110 || (dy > 24 && v > 0.55)) { close(); return; }
    dlg.style.transition = 'transform 0.5s var(--ease)';
    dlg.style.transform = '';
    setTimeout(() => { dlg.style.transition = ''; dlg.classList.remove('gm-dragging'); }, 520);
  }
  ['gmGrab', 'gmTop'].forEach(id => {
    const h = document.getElementById(id);
    h.addEventListener('pointerdown', down);
    h.addEventListener('pointermove', move);
    h.addEventListener('pointerup', up);
    h.addEventListener('pointercancel', up);
  });

  // "On this page" mirrors the page's own section bar, minus its old "More pages" tab.
  const tabs = [...document.querySelectorAll('nav.tabs a[href^="#"]')].filter(a => a.getAttribute('href') !== '#more');
  if (tabs.length) {
    const jump = dlg.querySelector('.gm-jump');
    tabs.forEach(t => {
      const c = t.cloneNode(true);
      c.querySelectorAll('b').forEach(b => b.remove());
      const a = document.createElement('a');
      a.textContent = c.textContent.trim();
      a.href = t.getAttribute('href');
      a.addEventListener('click', e => { e.preventDefault(); close(); setTimeout(() => { location.hash = a.getAttribute('href').slice(1); }, still.matches ? 0 : 200); });
      jump.appendChild(a);
    });
    document.getElementById('gmHere').hidden = false;
  }

  fill(dlg.querySelector('.gm-groups'));
  document.querySelectorAll('[data-gm-list]').forEach(box => {
    const groups = document.createElement('div');
    groups.className = 'gm-groups';
    box.appendChild(groups);
    fill(groups);
  });

  // The section bar highlights the section you're reading and keeps that pill in view.
  const strip = document.querySelector('nav.tabs .in');
  const spy = new Map();
  document.querySelectorAll('nav.tabs a[href^="#"]').forEach(a => {
    const s = document.getElementById(a.getAttribute('href').slice(1));
    if (s) spy.set(s, a);
  });
  if (strip && spy.size && 'IntersectionObserver' in window) {
    let current = null;
    const mark = a => {
      if (a === current) return;
      if (current) current.removeAttribute('aria-current');
      current = a;
      if (!a) return;
      a.setAttribute('aria-current', 'true');
      const left = a.offsetLeft - (strip.clientWidth - a.offsetWidth) / 2;
      strip.scrollTo({ left: Math.max(0, left), behavior: still.matches ? 'auto' : 'smooth' });
    };
    const seen = new Set();
    const first = spy.keys().next().value;
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) seen.add(en.target); else seen.delete(en.target); });
      const top = [...seen].sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top)[0];
      if (top) mark(spy.get(top));
      else if (first.getBoundingClientRect().top > window.innerHeight * 0.3) mark(null);
    }, { rootMargin: '-28% 0px -66% 0px' });
    spy.forEach((a, s) => io.observe(s));
  }

  // The button shrinks to its icon while you scroll down and grows back when you scroll up.
  let lastY = window.scrollY, ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      if (Math.abs(y - lastY) > 8) {
        fab.classList.toggle('gm-tuck', y > lastY && y > 240);
        lastY = y;
      }
      ticking = false;
    });
  }, { passive: true });
})();
</script>
<!-- gm:end -->
</body>
