<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pocket Stat Card GPS</title>
<meta name="description" content="On-course stat card with GPS yards to the green and a club plan for every shot.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stat Card">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060A07" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>

/* Layout: one thumb, one screen. Status at the top, a tappable map of the hole in the middle, every action in the bottom thumb zone above a floating glass tab bar. */
:root{
  --c-bg:#EDF1EC;--c-surface:#FFFFFF;--c-raise:#F5F7F4;--c-ink:#101712;--c-muted:#5B6860;--c-hair:rgba(16,23,18,.1);
  --c-fill:rgba(20,40,26,.065);--c-fill-2:rgba(20,40,26,.16);--c-seg-on:#FFFFFF;
  --c-accent:#14864A;--c-accent-ink:#FFFFFF;--c-accent-soft:#DCF0E2;--c-link:#11733E;
  --c-bad:#D33B2C;--c-bad-soft:#FBE3DF;--c-warn:#A86B0C;--c-warn-soft:#F7EBD2;
  --c-glass:rgba(252,253,252,.97);--c-glass-edge:rgba(255,255,255,.75);--c-glass-hi:rgba(255,255,255,.8);
  --c-sheet:#F7F9F6;--c-scrim:rgba(8,14,10,.32);
  --c-shadow:0 .5px 1px rgba(16,23,18,.06),0 3px 10px -6px rgba(16,23,18,.18);
  --m-rough:#7A9A62;--m-fair:#97BD73;--m-stripe:#9FC47B;--m-fringe:#A6CB83;--m-green:#AFD68C;--m-green-hi:#B7DB96;
  --m-sand:#ECE2C6;--m-sand-edge:#D3C59D;--m-trees:#557447;--m-tree:#4C6A40;--m-line:#FFFFFF;--m-ball:#FFFFFF;
  --m-label:#132414;--m-chip:rgba(255,255,255,.8);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --spring:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --c-bg:#060A07;--c-surface:#131915;--c-raise:#1A211C;--c-ink:#EEF3EF;--c-muted:#98A79C;--c-hair:rgba(238,243,239,.11);
  --c-fill:rgba(220,240,226,.085);--c-fill-2:rgba(220,240,226,.2);--c-seg-on:#2B352E;
  --c-accent:#36D06E;--c-accent-ink:#03140A;--c-accent-soft:#11301C;--c-link:#5BDD8B;
  --c-bad:#FF6F5E;--c-bad-soft:#3A1612;--c-warn:#F2B650;--c-warn-soft:#33260E;
  --c-glass:rgba(24,30,26,.97);--c-glass-edge:rgba(255,255,255,.1);--c-glass-hi:rgba(255,255,255,.07);
  --c-sheet:#141A16;--c-scrim:rgba(0,0,0,.55);
  --c-shadow:0 0 0 .5px rgba(255,255,255,.07),0 14px 30px -14px rgba(0,0,0,.85);
  --m-rough:#2E4628;--m-fair:#40653A;--m-stripe:#456C3F;--m-fringe:#4A7343;--m-green:#568550;--m-green-hi:#5C8C56;
  --m-sand:#8F7D50;--m-sand-edge:#7A6A42;--m-trees:#1E361C;--m-tree:#172C16;--m-line:#FFFFFF;--m-ball:#FFFFFF;
  --m-label:#F1F7EE;--m-chip:rgba(8,16,9,.62);color-scheme:dark}}
:root[data-theme="dark"]{
  --c-bg:#060A07;--c-surface:#131915;--c-raise:#1A211C;--c-ink:#EEF3EF;--c-muted:#98A79C;--c-hair:rgba(238,243,239,.11);
  --c-fill:rgba(220,240,226,.085);--c-fill-2:rgba(220,240,226,.2);--c-seg-on:#2B352E;
  --c-accent:#36D06E;--c-accent-ink:#03140A;--c-accent-soft:#11301C;--c-link:#5BDD8B;
  --c-bad:#FF6F5E;--c-bad-soft:#3A1612;--c-warn:#F2B650;--c-warn-soft:#33260E;
  --c-glass:rgba(24,30,26,.97);--c-glass-edge:rgba(255,255,255,.1);--c-glass-hi:rgba(255,255,255,.07);
  --c-sheet:#141A16;--c-scrim:rgba(0,0,0,.55);
  --c-shadow:0 0 0 .5px rgba(255,255,255,.07),0 14px 30px -14px rgba(0,0,0,.85);
  --m-rough:#2E4628;--m-fair:#40653A;--m-stripe:#456C3F;--m-fringe:#4A7343;--m-green:#568550;--m-green-hi:#5C8C56;
  --m-sand:#8F7D50;--m-sand-edge:#7A6A42;--m-trees:#1E361C;--m-tree:#172C16;--m-line:#FFFFFF;--m-ball:#FFFFFF;
  --m-label:#F1F7EE;--m-chip:rgba(8,16,9,.62);color-scheme:dark}

/* One size scale for every part: text, control heights, corners and gaps come only from these tokens */
:root{
  --t-micro:11.5px;--t-cap:13px;--t-small:14px;--t-body:15px;--t-label:16px;--t-title:17px;--t-h2:22px;--t-h1:28px;--t-num:24px;--t-num-l:34px;
  --h-chip:36px;--h-ctl:42px;--h-btn:48px;--h-act:54px;--h-act-l:62px;
  --r-s:10px;--r-m:14px;--r-l:18px;--r-xl:22px;
  --g-s:8px;--g-m:12px;--g-l:16px;
}
*{box-sizing:border-box}
html,body{background:var(--c-bg)}
body{color:var(--c-ink);font-family:var(--f-ui);-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html body::after{content:none}
.gm-fab{display:none!important}
button{font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:var(--g-m)}
#main{display:flex;flex-direction:column;gap:var(--g-m)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}

/* Type */
.t1{font:800 var(--t-h1)/1.1 var(--f-num);letter-spacing:-.03em;margin:0;text-wrap:balance}
.t2{font:700 var(--t-h2)/1.2 var(--f-num);letter-spacing:-.02em;margin:0;text-wrap:balance}
.t3{font:700 var(--t-title)/1.25 var(--f-ui);letter-spacing:-.015em;margin:0}
.sub{margin:0;color:var(--c-muted);font-size:var(--t-body);line-height:1.4}
.cap{font-size:var(--t-cap);font-weight:600;color:var(--c-muted);letter-spacing:.01em}
.src{font-size:var(--t-cap);color:var(--c-muted);margin:0;line-height:1.4}
.pwhy{margin:0;font-size:var(--t-small);color:var(--c-muted);line-height:1.5}
.topline{display:flex;justify-content:space-between;align-items:center;min-height:24px;gap:10px}
.wm{font:700 var(--t-small)/1 var(--f-num);color:var(--c-muted)}
.sync,.gpsdot{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-cap);color:var(--c-muted)}
.sync i,.gpsdot i{width:7px;height:7px;border-radius:50%;background:var(--c-muted)}
.sync.ok i,.gpsdot i.ok{background:var(--c-accent)}.sync.warn i{background:var(--c-warn)}.gpsdot i.bad{background:var(--c-bad)}
.notex{font-size:var(--t-small);line-height:1.4;padding:10px 14px;border-radius:var(--r-m);background:var(--c-warn-soft);margin:0}

/* Surfaces: one card style, one inset style */
.box,.res,.list,.tile,details.more,.strip{background:var(--c-surface);box-shadow:var(--c-shadow);min-width:0}
.box{border-radius:var(--r-xl);padding:var(--g-l);display:flex;flex-direction:column;gap:var(--g-m)}
.mapw,.greenw{border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--c-shadow);line-height:0;background:var(--m-rough)}
.greenw{background:var(--m-rough)}
.map{width:100%;height:auto;display:block}

/* Controls: three heights only (chip, control, button) */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:var(--r-m);background:var(--c-fill)}
.seg button{border:0;background:transparent;color:var(--c-ink);font:600 var(--t-small)/1 var(--f-ui);padding:0 11px;min-height:var(--h-chip);border-radius:var(--r-s);cursor:pointer;white-space:nowrap;transition:background-color .2s,box-shadow .2s,transform .35s var(--spring)}
.seg button[aria-pressed="true"]{background:var(--c-seg-on);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px var(--c-hair)}
.seg.full{display:grid;width:100%}
.seg.big button{min-height:var(--h-ctl);font-size:var(--t-body)}
.ib{flex:none;width:var(--h-ctl);height:var(--h-ctl);border-radius:var(--r-m);border:0;background:var(--c-fill);color:var(--c-ink);display:grid;place-items:center;font:700 var(--t-body) var(--f-num);cursor:pointer;transition:transform .35s var(--spring)}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.cta{min-height:var(--h-btn);border:0;border-radius:var(--r-l);background:var(--c-accent);color:var(--c-accent-ink);font:700 var(--t-label) var(--f-ui);letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%;padding:0 18px;transition:transform .35s var(--spring),opacity .2s}
.cta svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cta:disabled{opacity:.38;cursor:default}
.cta.sec{background:var(--c-fill);color:var(--c-ink)}
.ghost{min-height:var(--h-ctl);border:0;border-radius:var(--r-m);background:var(--c-fill);color:var(--c-ink);font:600 var(--t-small) var(--f-ui);padding:0 14px;cursor:pointer}
.ghost.go{background:var(--c-accent);color:var(--c-accent-ink)}.ghost.bad{color:var(--c-bad)}
.lk{border:0;background:none;color:var(--c-link);font:600 var(--t-small) var(--f-ui);padding:6px 4px;min-height:var(--h-chip);cursor:pointer}
.lnk{font:600 var(--t-small) var(--f-ui);color:var(--c-link);text-decoration:none;min-height:var(--h-chip);display:inline-flex;align-items:center;align-self:flex-start}
.back{align-self:flex-start;border:0;background:none;color:var(--c-link);font:600 var(--t-body) var(--f-ui);min-height:var(--h-chip);padding:0;cursor:pointer}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pl{min-height:var(--h-chip);border:0;border-radius:999px;background:var(--c-fill);color:var(--c-ink);font:600 var(--t-small) var(--f-ui);padding:0 13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.pl[aria-pressed="true"]{background:var(--c-ink);color:var(--c-bg)}
.pl.wchip{flex-direction:column;align-items:flex-start;border-radius:var(--r-m);padding:7px 11px;line-height:1.2;width:100%}
.pills:has(.wchip){display:grid;grid-template-columns:1fr 1fr}
.pills .wchip:nth-of-type(1){grid-column:1/-1}.pills .wchip:nth-of-type(2){order:1}.pills .wchip:nth-of-type(4){order:2}.pills .wchip:nth-of-type(3){order:3}.pills .wchip:nth-of-type(5){order:4}
.pl.wchip small{font-size:var(--t-micro);opacity:.75;font-weight:500}
.wf{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
.inp{min-height:var(--h-ctl);border:0;border-radius:var(--r-m);background:var(--c-fill);color:var(--c-ink);font:500 var(--t-label) var(--f-ui);padding:0 14px;width:100%}
.inp:focus,.code:focus{outline:2px solid var(--c-accent);outline-offset:1px}
.inp.sm{width:auto;flex:0 1 auto}
.code{width:100%;min-height:110px;border:0;border-radius:var(--r-m);background:var(--c-fill);color:var(--c-ink);font:var(--t-cap)/1.4 ui-monospace,Menlo,monospace;padding:12px;resize:vertical}
.r2{display:flex;gap:var(--g-s);flex-wrap:wrap}.r2>*{flex:1 1 auto}
.links{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap}
.ask{display:flex;flex-direction:column;gap:6px}
.ib:active,.act:active,.cta:active:not(:disabled),.seg button:active,.pl:active,.nb:active,.hb:active,.ghost:active,.lr:active,.sp:active,.resume:active{transform:scale(.975)}

/* Play: one screen. Header, shot bar, the map takes the height that's left, actions above the tab bar */
html{height:100%}body{min-height:100%}
body[data-view="play"]{height:100%;overflow:hidden;overscroll-behavior:none}
body[data-view="play"] .topline{display:none}
body[data-view="play"] .app{height:100%;padding-block:6px calc(72px + env(safe-area-inset-bottom,0px));gap:var(--g-s)}
body[data-view="play"] #main{flex:1 1 auto;min-height:0}
.play{display:flex;flex-direction:column;gap:var(--g-s);height:100%;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.play>*{flex:none}
.hd{display:flex;align-items:center;gap:var(--g-s);min-height:var(--h-ctl)}
.hd-hole{border:0;background:none;padding:2px 0;text-align:left;color:inherit;cursor:pointer;display:flex;min-width:0}
.hd-t{font:800 var(--t-h1)/1 var(--f-num);letter-spacing:-.03em;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chevr{width:16px;height:16px;fill:none;stroke:var(--c-muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chev{width:16px;height:16px;fill:none;stroke:var(--c-muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-top:3px}
.hd-pill{font:600 var(--t-cap) var(--f-ui);color:var(--c-muted);background:var(--c-fill);border-radius:999px;padding:4px 9px;white-space:nowrap}
.hd-pill b{color:var(--c-ink);margin-right:2px}.hd-pill.u b{color:var(--c-accent)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--c-muted);flex:none}.sdot.ok{background:var(--c-accent)}.sdot.warn{background:var(--c-warn)}
.hd .seg{margin-left:auto;flex:none}
.hd .seg button{min-width:40px;padding:0 9px}
.strip{display:flex;align-items:center;gap:var(--g-s);padding:6px;border-radius:var(--r-xl)}
.sn{width:46px;height:46px;border-radius:var(--r-m);background:var(--c-accent);color:var(--c-accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none}
.sn .num{font-size:22px}
.sn small{font-size:var(--t-micro);font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.85;margin-top:1px}
.sn.pen{background:var(--c-bad);color:#fff}
.st{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding-left:2px}
.st b{font:700 var(--t-label)/1.2 var(--f-ui);letter-spacing:-.015em}
.st span{font-size:var(--t-cap);color:var(--c-muted)}
.sp{flex:1;min-width:0;border:0;background:var(--c-fill);border-radius:var(--r-m);min-height:46px;padding:4px 12px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:1px;color:inherit;cursor:pointer;transition:transform .35s var(--spring)}
.sp b{font:700 var(--t-label)/1.2 var(--f-ui);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp small{font-size:var(--t-cap);color:var(--c-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp small .num{font-size:var(--t-small);color:var(--c-ink)}
.sp.gps small{color:var(--c-link)}
.sp.set{background:var(--c-accent-soft)}.sp.set b{color:var(--c-accent)}
.stale{background:var(--c-warn-soft);border-radius:var(--r-l);padding:12px;display:flex;flex-direction:column;gap:var(--g-s)}
.stale b{display:block;font-size:var(--t-label)}.stale span{font-size:var(--t-cap);color:var(--c-muted)}

/* The hole map */
.mapw.fit{flex:1 1 0;min-height:200px;position:relative;display:flex;align-items:center;justify-content:center}
.mapw.fit>svg{width:100%;height:100%}
.mapw.fit.mini{min-height:120px;width:100%;border-radius:var(--r-l)}
.greenw.fitg{flex:1 1 0;min-height:110px;display:flex}.greenw.fitg>svg{width:100%;height:100%}
.m-rough{fill:var(--m-rough)}.m-trees{fill:var(--m-trees)}.m-tree{fill:var(--m-tree)}.m-fair{fill:var(--m-fair)}.m-stripe{fill:var(--m-stripe)}
.m-fringe{fill:var(--m-fringe)}.m-green{fill:var(--m-green)}.m-green-hi{fill:var(--m-green-hi)}.m-sand{fill:var(--m-sand);stroke:var(--m-sand-edge);stroke-width:1.5}.m-tee{fill:var(--m-stripe)}
.z{cursor:pointer;outline:none;transition:filter .15s}
.z:active{filter:brightness(1.14)}.z:focus-visible{filter:brightness(1.18)}
.behind{cursor:not-allowed}.behind rect,.behind>path:not(.behind-edge){fill:#071108;fill-opacity:.46}.behind-edge{fill:none;stroke:var(--m-line);stroke-opacity:.6;stroke-width:1.2;stroke-dasharray:4 5}
.ml{pointer-events:none}.ml rect{fill:var(--m-chip)}.ml text{fill:var(--m-label);font:650 10px var(--f-ui);letter-spacing:.07em;text-anchor:middle}
.deco{pointer-events:none}
.pin{stroke:var(--m-label);stroke-width:1.3;stroke-linecap:round}.flag{fill:var(--c-bad)}.cup{fill:var(--m-label);opacity:.75}
.tr{fill:none;stroke:var(--m-line);stroke-width:2.4;stroke-dasharray:1 6;stroke-linecap:round}
.td{fill:var(--m-line);opacity:.9}
.ball{fill:var(--m-ball);stroke:rgba(0,0,0,.28);stroke-width:1}
.halo{fill:var(--m-ball);opacity:.28}
.m-water{fill:var(--m-water);stroke:var(--m-water-edge);stroke-width:1.2}
.m-near{fill:var(--m-fringe);stroke:var(--m-fringe);stroke-linejoin:round;opacity:.42}
.m-collar{fill:var(--m-fringe);stroke:var(--m-fringe);stroke-linejoin:round}
.rmap .m-green{stroke:var(--m-green-hi);stroke-width:1}
.tapz{fill:transparent;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.trw{fill:none;stroke:var(--c-bad);stroke-width:2.2;stroke-dasharray:2 5;stroke-linecap:round}
.wx{fill:none;stroke:var(--c-bad);stroke-width:2.6;stroke-linecap:round}
.rcut text{font-size:10.5px}
.penb rect{fill:var(--c-bad)}.penb text{fill:#fff;font:700 12px var(--f-num);text-anchor:middle}
@media (prefers-reduced-motion:no-preference){.ball.pop,.halo.pop{animation:bpop .25s var(--spring) both;transform-box:fill-box;transform-origin:center}}
@keyframes bpop{0%{transform:scale(1.5);opacity:0}100%{transform:scale(1)}}
.maphint,.teeclubs{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:2;border-radius:999px;background:var(--m-chip);white-space:nowrap}
.maphint{pointer-events:none;font:600 var(--t-cap)/1.2 var(--f-ui);padding:5px 12px;color:var(--m-label)}
.teeclubs{display:flex;gap:2px;padding:3px;box-shadow:0 4px 12px -6px rgba(0,0,0,.35)}
.teeclubs button{border:0;background:transparent;color:var(--m-label);font:600 var(--t-cap) var(--f-ui);min-height:var(--h-chip);padding:0 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.teeclubs button[aria-pressed="true"]{background:var(--c-accent);color:var(--c-accent-ink)}

/* On-course action buttons */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:var(--g-s)}
.acts.one{grid-template-columns:1fr}.acts.three{grid-template-columns:repeat(3,1fr)}
.act{min-height:var(--h-act);border:0;border-radius:var(--r-l);background:var(--c-surface);color:var(--c-ink);box-shadow:var(--c-shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:4px 6px;transition:transform .15s var(--spring)}
.act b{font-size:var(--t-body);font-weight:700;letter-spacing:-.01em}
.act small{font-size:12px;color:var(--c-muted)}
.act.bad b{color:var(--c-bad)}.act.good b{color:var(--c-accent)}
.act.go{background:var(--c-accent);color:var(--c-accent-ink)}.act.go small{color:inherit;opacity:.8}
.act.big{min-height:var(--h-act-l)}.act.big b{font-size:var(--t-title)}

/* Hole finished */
.res{border-radius:var(--r-xl);padding:14px;display:flex;flex-direction:column;gap:10px}
.res:has(.mapw.fit){flex:1 1 0;min-height:0}
.res-top{display:flex;align-items:center;gap:14px}
.res-t{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.pillx{display:inline-flex;align-items:center;min-height:26px;padding:0 11px;border-radius:999px;font:700 var(--t-small) var(--f-ui);background:var(--c-fill)}
.pillx.under{background:var(--c-accent-soft);color:var(--c-accent)}.pillx.over{background:var(--c-warn-soft);color:var(--c-warn)}.pillx.over2{background:var(--c-bad-soft);color:var(--c-bad)}
.hist{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.hist::-webkit-scrollbar{display:none}
.hist span{flex:none;padding:5px 10px;border-radius:999px;background:var(--c-fill);font-size:var(--t-cap);white-space:nowrap}
.nx{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nx .t3{white-space:nowrap}
/* Scorecard marks: circle under par, square over, doubled for two or more */
.mk{display:inline-grid;place-items:center;width:26px;height:26px;font-weight:700}
.mk.e1{border-radius:50%;box-shadow:0 0 0 1.6px var(--c-accent)}
.mk.e2{border-radius:50%;box-shadow:0 0 0 1.6px var(--c-accent),0 0 0 3.6px var(--c-surface),0 0 0 5.2px var(--c-accent)}
.mk.o1{border-radius:5px;box-shadow:0 0 0 1.6px var(--c-warn)}
.mk.o2{border-radius:5px;box-shadow:0 0 0 1.6px var(--c-bad),0 0 0 3.6px var(--c-surface),0 0 0 5.2px var(--c-bad)}
.mk.big{width:60px;height:60px;font-size:30px;flex:none;background:var(--c-fill);border-radius:var(--r-l)}
.mk.big.e1{border-radius:50%;box-shadow:0 0 0 2.5px var(--c-accent);background:var(--c-accent-soft)}
.mk.big.e2{border-radius:50%;box-shadow:0 0 0 2.5px var(--c-accent),0 0 0 6px var(--c-surface),0 0 0 8.5px var(--c-accent);background:var(--c-accent-soft)}
.mk.big.o1{border-radius:var(--r-m);box-shadow:0 0 0 2.5px var(--c-warn);background:var(--c-warn-soft)}
.mk.big.o2{border-radius:var(--r-m);box-shadow:0 0 0 2.5px var(--c-bad),0 0 0 6px var(--c-surface),0 0 0 8.5px var(--c-bad);background:var(--c-bad-soft)}

/* Bottom sheets */
.sheetw{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--c-scrim)}
.sheet{position:relative;width:min(560px,100%);max-height:calc(100% - 36px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;background:var(--c-sheet);border-radius:26px 26px 0 0;padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:var(--g-m);box-shadow:0 -16px 50px -20px rgba(0,0,0,.35)}
.sheet>*{flex-shrink:0}
.sheet::before{content:"";width:36px;height:5px;border-radius:3px;background:var(--c-fill-2);align-self:center;flex:none}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sup .3s var(--spring) both}.scrim{animation:sfade .25s ease both}}
@keyframes sup{from{transform:translateY(100%)}}@keyframes sfade{from{opacity:0}}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{width:32px;height:32px;border-radius:50%;border:0;background:var(--c-fill);display:grid;place-items:center;cursor:pointer;color:var(--c-muted);flex:none}
.x svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--g-s)}
.nb{min-height:56px;border:0;border-radius:var(--r-l);background:var(--c-fill);color:var(--c-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;transition:transform .35s var(--spring)}
.nb .num{font-size:var(--t-num)}.nb small{font-size:var(--t-micro);color:var(--c-muted);font-weight:600}
.nb.par{box-shadow:inset 0 0 0 2px var(--c-accent)}
.nb[aria-pressed="true"]{background:var(--c-accent);color:var(--c-accent-ink);box-shadow:none}.nb[aria-pressed="true"] small{color:inherit;opacity:.85}
.hgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.hb{-webkit-touch-callout:none;aspect-ratio:1;border:0;border-radius:var(--r-m);background:var(--c-fill);color:var(--c-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;position:relative;min-width:0;transition:transform .35s var(--spring)}
.hb small{font-size:var(--t-micro);color:var(--c-muted);font-weight:600}.hb .num{font-size:var(--t-label)}
.hb[aria-current="true"]{background:var(--c-ink);color:var(--c-bg)}.hb[aria-current="true"] small{color:inherit;opacity:.7}
.hb.open::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--c-warn)}
.recap{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r-xl);background:var(--c-surface);box-shadow:var(--c-shadow)}
.recap .box,.recap .tile{box-shadow:none;background:var(--c-fill)}
.rc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rc-s{font-size:var(--t-num-l);line-height:1}
.rc-dist{display:flex;flex-wrap:wrap;gap:6px}
.rc-dist span{font:500 var(--t-cap)/1 var(--f-ui);color:var(--c-muted);background:var(--c-fill);border-radius:999px;padding:6px 10px}
.rc-dist b{color:var(--c-ink);margin-right:3px}
.rc-l{margin:0;font-size:var(--t-small);line-height:1.4}
.rc-warn{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:var(--r-m);background:var(--c-warn-soft);font-size:var(--t-cap)}
@media (prefers-reduced-motion:no-preference){.play.sl-l{animation:slL .24s var(--spring) both}.play.sl-r{animation:slR .24s var(--spring) both}}
@keyframes slL{from{transform:translateX(26px);opacity:.35}}@keyframes slR{from{transform:translateX(-26px);opacity:.35}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--t-cap);color:var(--c-muted);align-items:center}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c-warn);margin-right:6px}

/* Plan sheet */
.parline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ydbig{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--g-s)}
.ydv{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ydv input{width:100%;max-width:150px;border:0;background:transparent;text-align:center;font:800 40px/1.05 var(--f-num);letter-spacing:-.03em;color:var(--c-ink);padding:0;-moz-appearance:textfield}
.ydv input::-webkit-outer-spin-button,.ydv input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ydv input:focus{outline:2px solid var(--c-accent);border-radius:var(--r-m)}
.ydv small{font-size:var(--t-cap);color:var(--c-muted);font-weight:600;text-align:center}
.ydv small.warn{color:var(--c-warn);max-width:30ch;line-height:1.3}
.ydbig .ghost{min-width:54px;align-self:center;font:700 var(--t-label) var(--f-num)}
#pl-r{width:100%;height:40px;margin:0;accent-color:var(--c-accent)}
.gpsline{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:var(--t-cap);color:var(--c-muted);background:var(--c-fill);border-radius:var(--r-m);padding:6px 6px 6px 12px;min-height:var(--h-btn);line-height:1.35}
.gpsline b{color:var(--c-ink);font-family:var(--f-num)}
.gpsline .ghost{flex:none}
details.cond{border-radius:var(--r-m);background:var(--c-fill)}
details.cond>summary{list-style:none;cursor:pointer;min-height:var(--h-ctl);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:600;font-size:var(--t-small)}
details.cond>summary::-webkit-details-marker{display:none}
details.cond>summary span{margin-left:auto;color:var(--c-muted);font-weight:500;font-size:var(--t-cap);text-align:right}
.cond-b{padding:0 10px 10px;display:flex;flex-direction:column;gap:var(--g-s)}
.planout{display:flex;flex-direction:column;gap:var(--g-m)}
.rec{background:var(--c-accent-soft);border-radius:var(--r-xl);padding:14px;display:flex;flex-direction:column;gap:6px}
.rec p{margin:0;font-size:var(--t-small);line-height:1.45}
.rec .cta{margin-top:4px}
.steps{display:flex;flex-direction:column;gap:var(--g-s)}
.lane{display:flex;gap:3px;height:12px;border-radius:6px;overflow:hidden}
.lane i{display:block;height:100%;background:var(--c-accent);min-width:8px}
.lane i:nth-child(even){background:color-mix(in srgb,var(--c-accent) 50%,var(--c-surface))}
.lane i:last-child{background:var(--m-green)}
.lanel{display:flex;gap:3px;font-size:var(--t-micro);font-weight:700;color:var(--c-muted);margin-top:-3px}
.lanel span{min-width:8px;overflow:hidden;white-space:nowrap}
ol.stp{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:stp}
ol.stp li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:var(--t-small);counter-increment:stp}
ol.stp li::before{content:counter(stp);width:24px;height:24px;border-radius:50%;background:var(--c-fill);display:grid;place-items:center;font:700 var(--t-cap) var(--f-num)}
ol.stp li small{color:var(--c-muted);font-size:var(--t-cap);white-space:nowrap}

/* Toast with undo */
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:35;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:999px;background:var(--c-ink);color:var(--c-bg);font:600 var(--t-small) var(--f-ui);box-shadow:0 10px 30px -10px rgba(0,0,0,.45);max-width:calc(100% - 32px);white-space:nowrap}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast button{border:0;border-radius:999px;background:var(--c-accent);color:var(--c-accent-ink);font:700 var(--t-cap) var(--f-ui);min-height:32px;padding:0 13px;cursor:pointer;flex:none}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .28s var(--spring) both}}
@keyframes tin{from{transform:translate(-50%,-12px);opacity:0}}

/* Tab bar */
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;border-radius:28px;background:var(--c-glass);border:.5px solid var(--c-glass-edge);box-shadow:0 10px 28px -12px rgba(0,0,0,.35),inset 0 1px 0 var(--c-glass-hi)}
.tabbar button{border:0;background:transparent;color:var(--c-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:46px;border-radius:23px;font:600 var(--t-micro)/1 var(--f-ui);cursor:pointer;transition:background-color .25s,color .25s,transform .35s var(--spring)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--c-accent);background:var(--c-accent-soft)}
.tabbar button:active{transform:scale(.92)}

/* Rounds */
.resume{background:var(--c-accent);color:var(--c-accent-ink);border:0;border-radius:var(--r-xl);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;cursor:pointer;width:100%;box-shadow:var(--c-shadow);transition:transform .35s var(--spring)}
.resume b{display:block;font:700 var(--t-title)/1.2 var(--f-ui)}
.resume small{font-size:var(--t-cap);opacity:.85}
.resume svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.list{border-radius:var(--r-xl);overflow:hidden;display:flex;flex-direction:column}
.lr{width:100%;border:0;background:transparent;color:inherit;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:12px 16px;text-align:left;cursor:pointer;position:relative;transition:transform .35s var(--spring)}
.lr+.lr::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--c-hair)}
.lr b{display:block;font-size:var(--t-label);font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr small{font-size:var(--t-cap);color:var(--c-muted)}
.lr .num{font-size:22px}
.tagx{font-size:var(--t-micro);font-weight:700;padding:2px 8px;border-radius:999px;background:var(--c-warn-soft);color:var(--c-warn);margin-left:6px;vertical-align:2px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--g-m);padding:32px 12px}
.empty .sub{max-width:32ch}
.empty-ic{width:52px;height:52px;border-radius:var(--r-l);background:var(--c-accent-soft);color:var(--c-accent);display:grid;place-items:center}
.empty-ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sum-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sum-h>div:first-child{min-width:0}
.sum-s{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.sum-s .num{font-size:var(--t-num-l);line-height:1}
.scw{overflow-x:auto}
.sc{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:100%}
.sc th,.sc td{padding:5px 1px;text-align:center;min-width:30px;font-size:var(--t-small)}
.sc th{font-size:12px;color:var(--c-muted);font-weight:600}
.sc .rl{text-align:left;padding-right:10px;font-size:var(--t-cap);color:var(--c-muted);font-weight:600;position:sticky;left:0;background:var(--c-surface);min-width:46px}
.sc .tt{font-weight:800;font-family:var(--f-num)}
.sc tr.pr td{color:var(--c-muted)}

/* Stats */
.hero{background:var(--c-accent-soft);border-radius:var(--r-xl);padding:var(--g-l);display:flex;flex-direction:column;gap:6px}
.hero .big{font:800 var(--t-num-l)/1 var(--f-num);letter-spacing:-.03em}
.hero .big small{font:600 var(--t-small) var(--f-ui);letter-spacing:0;margin-left:6px;color:var(--c-muted)}
.hero p{margin:0;font-size:var(--t-body);line-height:1.45}
.hero .why3{padding-top:8px;margin-top:2px;border-top:1px solid var(--c-hair);font-size:var(--t-small);color:var(--c-ink)}.hero .why3 b{font-weight:700}
/* Pacing putts (kept outside the caddy-css markers, which build_courses.py rewrites) */
.maphint.pacebtn{top:auto;bottom:8px;pointer-events:auto;border:0;cursor:pointer;min-height:32px}
/* keep the centring when pressed: the global button:active scale would drop translateX and slide the button off the finger */
html .maphint:active{transform:translateX(-50%) scale(.975)}
.maphint.pacebtn.on{font-weight:700;box-shadow:inset 0 0 0 1.5px var(--m-label)}
.nums.six{grid-template-columns:repeat(6,1fr);gap:6px}.nums.six .nb{min-height:50px;min-width:0}.nums.six .nb .num{font-size:var(--t-label)}
.stepk{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;border-top:1px solid var(--c-hair)}
.stepk b{display:block;font:700 var(--t-body)/1.3 var(--f-ui)}.stepk small{display:block;font-size:var(--t-cap);color:var(--c-muted);line-height:1.35;margin-top:2px}
.stepk .seg{flex:none}.stepk .seg button{min-width:44px;font-size:var(--t-label)}
.vs{display:flex;flex-direction:column;gap:14px}
.vs-r{display:flex;flex-direction:column;gap:6px}
.vs-l{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:var(--t-small)}
.vs-n{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.vs-n b{font-size:var(--t-title)}.vs-n small{font-size:var(--t-cap);color:var(--c-muted)}
.meter{position:relative;height:8px;border-radius:4px;background:var(--c-fill)}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--c-warn)}
.meter i.ok{background:var(--c-accent)}
.meter em{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--c-ink);transform:translateX(-50%)}
.key{display:flex;gap:16px;font-size:var(--t-cap);color:var(--c-muted);align-items:center;flex-wrap:wrap}
.key i{display:inline-block;width:12px;height:8px;border-radius:4px;background:var(--c-accent);margin-right:6px}
.key em{display:inline-block;width:3px;height:12px;border-radius:2px;background:var(--c-ink);margin-right:6px;vertical-align:-1px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:var(--g-s)}
.tile{border-radius:var(--r-l);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.tile .num{font-size:var(--t-num)}.tile span{font-size:var(--t-cap);color:var(--c-muted);line-height:1.3}
.box .tile{box-shadow:none;background:var(--c-fill)}
.lb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:var(--t-small)}
.lb .meter{grid-column:1/-1}
.lb b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
details.more{border-radius:var(--r-xl);overflow:hidden}
details.more>summary{list-style:none;cursor:pointer;min-height:var(--h-btn);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font:700 var(--t-label) var(--f-ui)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--c-muted);border-bottom:2px solid var(--c-muted);transform:rotate(45deg);transition:transform .3s}
details.more[open]>summary::after{transform:rotate(225deg)}
.more-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:var(--g-l)}
.more-b h3{font:700 var(--t-small) var(--f-ui);margin:0 0 6px}
.tw{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:var(--t-small);font-variant-numeric:tabular-nums}
.dt th,.dt td{padding:8px 6px;border-bottom:.5px solid var(--c-hair);text-align:center}
.dt th{font-size:12px;color:var(--c-muted);font-weight:600}
.dt .l{text-align:left}
/* caddy-css:start */
:root{--m-water:#8EC9E6;--m-water-edge:#5FA9CF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--m-water:#2B5F7A;--m-water-edge:#3D7C9C}}
:root[data-theme="dark"]{--m-water:#2B5F7A;--m-water-edge:#3D7C9C}
.tabbar{grid-template-columns:repeat(5,1fr);width:min(420px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)))}
.cadl{display:flex;align-items:center;gap:6px;min-height:var(--h-chip);padding:6px 12px;border:0;border-radius:var(--r-m);background:var(--c-accent-soft);color:var(--c-ink);font:500 var(--t-cap)/1.3 var(--f-ui);text-align:left;cursor:pointer;overflow:hidden}
.cadl b{color:var(--c-accent);font-weight:700;white-space:nowrap}
.cadl span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cadl::before{content:"Caddy";flex:none;font:700 var(--t-micro)/1 var(--f-ui);letter-spacing:.02em;color:var(--c-accent-ink);background:var(--c-accent);border-radius:999px;padding:4px 7px}
.cd-courses{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--g-l));padding:2px var(--g-l)}
.cd-courses::-webkit-scrollbar{display:none}
.cd-courses .pl{flex:none}
.cd-top{display:flex;flex-direction:column;gap:2px}
.cd-top .sub{margin:0}
.cd-live{color:var(--c-accent);font-weight:600}
.cd-head{background:var(--c-surface);box-shadow:var(--c-shadow);gap:var(--g-s)}
.cd-head .seg button{flex-direction:column;gap:1px}
.cd-head .seg button small,.ngb .seg button small{display:block;font-size:var(--t-micro);font-weight:500;color:var(--c-muted)}
.cd-head .pl small{font-size:var(--t-micro);color:var(--c-muted);font-weight:500}
.cd-keys{background:var(--c-accent-soft);gap:var(--g-s)}
.cd-keys summary{display:flex;align-items:center;justify-content:space-between;list-style:none;cursor:pointer}
.cd-keys summary::-webkit-details-marker{display:none}
.cd-keys summary .chev{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .2s}
.cd-keys[open] summary .chev{transform:rotate(180deg)}
.cd-keys ul{margin:0;padding-left:1.1em;display:grid;gap:6px;font-size:var(--t-small);line-height:1.45}
.cd-nine{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:var(--g-s)}
.cd-btn{display:block;width:100%;padding:0;border:0;background:none;text-align:left;color:inherit;font:inherit;cursor:pointer;border-radius:var(--r-xl)}
.cd-btn:active .cd-card{transform:scale(.985)}
.cd-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:12px;border-radius:var(--r-xl);background:var(--c-surface);box-shadow:var(--c-shadow);transition:transform .2s}
.cd-card.cur{box-shadow:0 0 0 2px var(--c-accent),var(--c-shadow)}

.cd-big{display:flex;flex-direction:column;gap:var(--g-m)}

.cd-b{display:flex;flex-direction:column;gap:6px;min-width:0}
.cd-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cd-t b.num{font-size:var(--t-h2);line-height:1;min-width:1.1em}
.cd-t span{font:600 var(--t-label)/1.2 var(--f-ui)}
.cd-t small{font-size:var(--t-micro);color:var(--c-muted);font-weight:600}
.cd-plan{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;font-size:var(--t-small);color:var(--c-muted)}
.cd-plan b{color:var(--c-accent);font-size:var(--t-label)}
.cd-plan i{font-style:normal;opacity:.5}
.cd-tr{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.cd-tr li{display:grid;gap:1px;font-size:var(--t-cap);line-height:1.35;padding-left:14px;position:relative}
.cd-tr li::before{content:"";position:absolute;left:0;top:.42em;width:8px;height:8px;border-radius:50%;background:var(--m-sand-edge)}
.cd-tr li.water::before{background:var(--m-water-edge)}
.cd-tr li.trees::before{background:var(--m-trees)}
.cd-tr li.ob::before{background:var(--c-bad)}
.cd-tr li small{color:var(--c-muted);font-size:var(--t-micro)}
.cd-s{margin:0;font-size:var(--t-cap);line-height:1.4;color:var(--c-muted)}
.cd-aim{margin:0;font:600 var(--t-cap)/1.35 var(--f-ui);color:var(--c-accent)}
.cd-tip{margin:0;font-size:var(--t-small);line-height:1.45;padding:10px 12px;border-radius:var(--r-l);background:var(--c-fill)}
.cd-foot{margin-top:var(--g-s)}
.cd-green{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--r-l);background:var(--c-surface);box-shadow:var(--c-shadow)}
.cd-gh{display:flex;flex-direction:column;gap:2px}
.cd-gw{display:flex;flex-direction:column;gap:var(--g-m)}
.cd-gw ul{margin:0;padding-left:1.1em;display:grid;gap:6px;font-size:var(--t-small);line-height:1.45}
.ngb{display:flex;flex-direction:column;gap:var(--g-s);padding:var(--g-m);border-radius:var(--r-l);background:var(--c-accent-soft)}
.ngb .seg button{flex-direction:column;gap:1px}
.hm-r{fill:var(--m-rough)}
.hm-f{fill:var(--m-fair)}
.hm-g{fill:var(--m-green)}
.hm-t{fill:var(--m-fringe)}
.hm-b{fill:var(--m-sand);stroke:var(--m-sand-edge);stroke-width:var(--hm-e,1)}
.hm-w{fill:var(--m-water);stroke:var(--m-water-edge);stroke-width:var(--hm-e,1)}
.hm-l{fill:none;stroke:var(--m-line);opacity:.85}
.hm-tee{fill:var(--m-ball);stroke:var(--m-label);stroke-width:var(--hm-d,1.5)}
.hm-dot{fill:var(--m-ball);stroke:var(--m-label);stroke-width:var(--hm-d,1.5)}
.hm-dot.bad{stroke:var(--c-bad)}
.hm-lab{fill:var(--m-label);font-family:var(--f-ui);font-weight:700;paint-order:stroke;stroke:var(--m-chip);stroke-width:var(--hm-h,3px)}
.gmap{display:block;width:100%;max-width:320px;height:auto;max-height:190px;margin:0 auto}
.gm-g{fill:var(--m-green)}
.gm-sh rect{fill:#0B2A0E}
.gm-edge{fill:none;stroke:var(--m-fringe)}
.gm-ar{stroke:var(--m-ball);stroke-linecap:round;fill:none}
.gm-arh{fill:var(--m-ball)}
.gm-hi{fill:var(--m-ball)}
.gm-lab{fill:var(--c-muted);font-family:var(--f-ui);font-weight:600;letter-spacing:.06em}
.gm-tag{fill:var(--m-label);font-family:var(--f-ui);font-weight:700;letter-spacing:.06em;paint-order:stroke;stroke:var(--m-chip)}
.pmapw{position:relative;border-radius:var(--r-l);overflow:hidden;background:var(--m-rough);line-height:0}
.pmap{display:block;width:100%;height:auto;max-height:46vh;touch-action:manipulation;cursor:crosshair}
.pr-bg{fill:var(--m-rough)}
.pm-you{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);line-height:1.2;font:600 var(--t-micro)/1.2 var(--f-ui);color:var(--m-label);background:var(--m-chip);padding:2px 8px;border-radius:999px;pointer-events:none}
.pr-path{fill:none;stroke:var(--m-ball);stroke-width:.45;stroke-linecap:round}
.pr-aim{fill:none;stroke:#EF9F27;stroke-width:.4;stroke-dasharray:.9 .7}
.pr-aimdot{fill:none;stroke:#EF9F27;stroke-width:.35}
.pr-cup{fill:#0B1A0C}
.pr-flag{fill:#D33B2C;stroke:#0B1A0C;stroke-width:.2}
.pr-ball{fill:#FFFFFF;stroke:#0B1A0C;stroke-width:.25}
.prows{display:grid;gap:6px}

.prow b{font:600 var(--t-small)/1.4 var(--f-ui)}
.sheet .seg button small{display:block;font-size:var(--t-micro);font-weight:500;color:var(--c-muted)}
.maphint.preadbtn{pointer-events:auto;border:0;cursor:pointer;min-height:32px}
.seg button{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
/* Hole pager on Play: arrows either side, the middle opens the list of holes */
.hpager{display:flex;align-items:stretch;flex:none;height:var(--h-ctl);padding:2px;gap:2px;border-radius:var(--r-m);background:var(--c-fill)}
.hp-a{width:31px;flex:none;border:0;background:transparent;color:var(--c-ink);display:grid;place-items:center;border-radius:calc(var(--r-m) - 2px);cursor:pointer;padding:0}
.hp-a .chevr{width:17px;height:17px;stroke:currentColor;stroke-width:2.4}
.hp-a:disabled{opacity:.25;cursor:default}
.hp-a.sq{width:32px;height:32px;border-radius:50%;background:var(--c-fill);color:var(--c-ink)}
.hp-a.sq .chevr{width:15px;height:15px}
.hpager .hd-hole{flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:48px;padding:0 6px;background:var(--c-surface);border-radius:calc(var(--r-m) - 2px);box-shadow:var(--c-shadow)}
.hpager .hd-hole b{font:800 21px/1 var(--f-num);letter-spacing:-.02em}
.hp-c{display:flex;align-items:center;gap:1px;font:700 9.5px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted)}
.hp-c .chev{width:10px;height:10px;margin:0;stroke-width:2.6}
.hd-pill{border:0;cursor:pointer}
.hd-par{margin-left:auto;display:flex;align-items:center;gap:5px;flex:none}
.play .hd{gap:6px}
.play .hd>*{flex-shrink:0}
@media (max-width:404px){.hd-pill .thru{display:none}.hd-par .cap{display:none}.hd .seg.par button{min-width:32px}}
@media (max-width:360px){.play .sdot{display:none}.hp-a{width:28px}}
.hd-par .cap{font:700 9.5px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted)}
.hd-par .seg{margin-left:0}
.hd .seg.par button{min-width:36px;padding:0 6px;font-variant-numeric:tabular-nums}
.golive{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;padding:6px 12px;border:0;border-radius:var(--r-m);background:var(--c-warn-soft);color:var(--c-ink);font:500 var(--t-cap)/1.3 var(--f-ui);text-align:left;cursor:pointer}
.golive b{color:var(--c-warn);font-weight:700;white-space:nowrap}
.sh-nav{display:flex;align-items:center;gap:6px;flex:none}
.card-thru{font:600 var(--t-cap) var(--f-ui);color:var(--c-muted);letter-spacing:0}
.hb.held{transform:scale(1.06);box-shadow:0 0 0 2px var(--c-accent);background:var(--c-accent-soft);transition:transform .15s var(--spring),box-shadow .15s}
/* Press feedback: a small, quick dip, not a squash */
html button:active{transform:scale(.975)}
html .cd-btn:active{transform:none}
/* Inside claude.ai on a phone the browser's bottom toolbar covers the page's bottom edge, so the tab bar moves to the top
   and the bottom gets a buffer (the home-screen GPS version keeps its bottom bar) */
html.gm-framed .tabbar{top:calc(6px + env(safe-area-inset-top,0px));bottom:auto}
html.gm-framed body::before{content:"";position:fixed;inset:0 0 auto;height:calc(62px + env(safe-area-inset-top,0px));background:var(--c-bg);z-index:29;pointer-events:none}
html.gm-framed .app{padding-block:calc(66px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}
html.gm-framed body[data-view="play"] .app{padding-block:calc(64px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
html.gm-framed .sheet{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
html.gm-framed .toast{top:calc(70px + env(safe-area-inset-top,0px));bottom:auto}

<style id="apple-skin">
  /* Shared skin for all golf pages (loads after each page's own styles).
     Layout idea: quiet gray canvas, white cards that float on soft layered shadows, frosted sticky bars,
     system San Francisco type set tight, and spring-eased motion on every touch. */
  :root {
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --ink: #1D1D1F;
    --muted: #6E6E73;
    --line: #E3E3E8;
    --accent: #1E7F3A;
    --accent-soft: #E7F4EA;
    --flag: #C25400;
    --flag-soft: #FFF2E6;
    --path: #0071E3;
    --path-soft: #E8F1FC;
    --turf: #EEF4EC;
    --turf-line: #D7E3D3;
    --green: #CDE5C5;
    --link: #0066CC;
    --on-accent: #FFFFFF;
    --fill: rgba(118, 118, 128, 0.12);
    --fill-strong: rgba(118, 118, 128, 0.2);
    --hair: rgba(0, 0, 0, 0.09);
    --glass: rgba(255, 255, 255, 0.7);
    --glass-edge: rgba(255, 255, 255, 0.65);
    --glass-hi: rgba(255, 255, 255, 0.7);
    --scrim: rgba(0, 0, 0, 0.22);
    --shadow-card: 0 0.5px 1px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.035), 0 14px 34px -14px rgba(0, 0, 0, 0.13);
    --shadow-lift: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 14px rgba(0, 0, 0, 0.05), 0 24px 48px -18px rgba(0, 0, 0, 0.2);
    --shadow-float: 0 0.5px 1px rgba(0, 0, 0, 0.08), 0 8px 20px -4px rgba(0, 0, 0, 0.14), 0 22px 44px -16px rgba(0, 0, 0, 0.22);
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
    --mono: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --r-xl: 24px;
    --r-l: 18px;
    --r-m: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --surface: #1C1C1E; --ink: #F5F5F7; --muted: #98989F; --line: #38383A;

      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #1C1C1E; --ink: #F5F5F7; --muted: #98989F; --line: #38383A;

    --path: #409CFF; --path-soft: #0D1F33; --turf: #0E1712; --turf-line: #1F2E24; --green: #1A3823;
    --link: #2997FF; --on-accent: #000000;
    --fill: rgba(118, 118, 128, 0.24); --fill-strong: rgba(118, 118, 128, 0.36); --hair: rgba(255, 255, 255, 0.1);

    color-scheme: dark;

  /* Base type */
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; interpolate-size: allow-keywords; }
  body { font-size: 16px; line-height: 1.5; letter-spacing: -0.011em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }

/* A tap on the real map, in map yards */
function realTapPt(svg,ev){
  if(!ev||!svg.getScreenCTM)return null;const M=svg.getScreenCTM();if(!M)return null;const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const q=p.matrixTransform(M.inverse());

}
function svgPt(svg,ev){if(!ev||!ev.detail||!svg.getScreenCTM)return null;const m=svg.getScreenCTM();if(!m)return null;const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const q=p.matrixTransform(m.inverse()),k=(svg.viewBox&&svg.viewBox.baseVal&&svg.viewBox.baseVal.height||330)/330;return[Math.round(q.x),Math.round(q.y/k)];}
/* Size the map to the space left on screen, so Play never needs a scroll */

  if(rs){const vb=rs.viewBox.baseVal;if(Math.abs(vb.width-w)<2&&Math.abs(vb.height-hh)<2)return;S.mapBox=[Math.round(w),Math.round(hh)];const {h}=curHole();if(h)rs.outerHTML=mapSVG(h,box.dataset.mode);return;}

}

/* ---------- views ---------- */

/* Keep the screen on while a round is open on Play, so the phone doesn't lock between shots (released anywhere else) */
let wakeL=null,wakeAsk=false;

  else if(wakeL){const l=wakeL;wakeL=null;try{await l.release();}catch(e){}}}

  [['play','play'],['caddy','caddy'],['rounds','rounds'],['stats','stats']].forEach(([v,id])=>{const b=$('tab-'+id);if(b)b.setAttribute('aria-current',(S.view===v||(v==='rounds'&&S.view==='summary'))?'page':'false');});

function renderBanner(){

function sortedRounds(){return Object.entries(S.rounds).sort((a,b)=>(b[1].date||'').localeCompare(a[1].date||'')||(b[1].created||0)-(a[1].created||0));}
function curHole(){const r=S.rounds[S.cur];if(!r)return{};const i=Math.min(S.hole,r.h.length-1);return{r,i,h:r.h[i]};}

function staleHTML(i,h){

/* The round at a glance, shown as soon as the last hole has a score */
function recapHTML(r){
  const o=roundStats(r),d=o.score-o.par,miss=r.h.map((x,j)=>x.s==null?j:-1).filter(j=>j>=0);
  const ds=r.h.filter(x=>x.s!=null).map(x=>x.s-x.par),cnt=f=>ds.filter(f).length;
  const dist=[['eagle',cnt(v=>v<=-2)],['birdie',cnt(v=>v===-1)],['par',cnt(v=>v===0)],['bogey',cnt(v=>v===1)],['double+',cnt(v=>v>=2)]].filter(x=>x[1]);
  let bi=-1,bd=0;r.h.forEach((x,j)=>{if(x.s!=null&&x.s-x.par<bd){bd=x.s-x.par;bi=j;}});
  const lost=[[o.pen,o.pen===1?'penalty stroke':'penalty strokes'],[o.three,o.three===1?'extra putt from a 3-putt':'extra putts from 3-putts'],[o.dbl,o.dbl===1?'double or worse':'doubles or worse']].filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0])[0];
  const PL={eagle:'eagles',birdie:'birdies',par:'pars',bogey:'bogeys','double+':'doubles+'};
  return `<section class="recap" aria-label="Round summary"><span class="cap">Round summary</span>
    <div class="rc-top"><span class="num rc-s">${o.score}</span><span class="pillx ${toneCls(Math.sign(d)*Math.min(2,Math.abs(d)))}">${vsPar(d)}</span><span class="sub">${o.n} ${o.n===1?'hole':'holes'} · par ${o.par}</span></div>
    ${dist.length?`<div class="rc-dist">${dist.map(([w,n])=>`<span><b class="num">${n}</b>${n===1?w:PL[w]}</span>`).join('')}</div>`:''}
    <div class="bento">
      <div class="tile"><span class="num">${o.fwTries?o.fwHit+'/'+o.fwTries:'–'}</span><span>Fairways</span></div>
      <div class="tile"><span class="num">${o.girTries?o.gir+'/'+o.girTries:'–'}</span><span>Greens in regulation</span></div>
      <div class="tile"><span class="num">${o.puttHoles?o.putts:'–'}</span><span>Putts</span></div>
      <div class="tile"><span class="num">${o.pen||0}</span><span>Penalty strokes</span></div></div>
    ${bi>=0?`<p class="rc-l"><b>Best hole:</b> ${scoreName(bd).toLowerCase()} on ${holeNo(r,bi)}.</p>`:''}
    <p class="rc-l">${lost?`<b>Most shots lost:</b> ${lost[0]} ${lost[1]}.`:'<b>Clean card:</b> no penalties, 3-putts or doubles.'}</p>
    ${miss.length?`<div class="rc-warn"><span>${miss.length} ${miss.length===1?'hole has':'holes have'} no score. Tap to add:</span><div class="pills">${miss.map(j=>`<button class="pl" data-act="fill" data-v="${j}">Hole ${holeNo(r,j)}</button>`).join('')}</div></div>`:''}
  </section>`;
}

/* Stats */
function meter(you,sc,max,good){const w=Math.max(0,Math.min(100,100*you/max)),s=Math.max(0,Math.min(100,100*sc/max));return `<div class="meter" aria-hidden="true"><i class="${good?'ok':''}" style="width:${w}%"></i><em style="left:${s}%"></em></div>`;}
function viewStats(){
  const all=sortedRounds().map(x=>x[1]),real=all.filter(r=>!r.example),use=real.length?real:all,o=sumStats(use);
  if(!o.n)return `<h1 class="t1">Stats</h1><section class="empty"><div class="empty-ic">${IC.flag}</div><p class="sub">Play a few holes and this ranks where your shots go and compares you with a scratch golfer.</p><button class="cta" data-go="rounds">Start a round</button></section>`;
  const holes=o.n,per=x=>perRound(x,holes),d1=x=>x.toFixed(1);

  if(o.topped)leaks.push(['Topped or short tee shots',per(o.topped),'topped']);

    short:['Around the green, pick one shot you trust and get the ball on the green with the first chip, even if it finishes 15 feet away.','https://claude.ai/artifact/8b6MXTYjy6bSchY3kZzVWk#chip','Chip planner'],
    trouble:['From trees or a fairway bunker, take the widest gap back to the fairway, even sideways. One shot out beats two shots in.','https://claude.ai/artifact/8b6MXTYjy6bSchY3kZzVWk#trouble','Smart plays in trouble'],
    topped:['A tee shot in play beats a long one. Standing up through the ball is what tops it, so keep your spine angle.','https://claude.ai/artifact/8Z35pNogEvSzqEgLWsseiJ#spine','Car Door Hips']};
  const top=leaks[0],fz=FOCUS[top[2]],lmax=Math.max(1,...leaks.map(l=>l[1]));

    ['Putts per 18',o.puttHoles?o.putts*18/o.puttHoles:null,30.7,false],['3-putts per 18',o.puttHoles?o.threeH*18/o.puttHoles:null,1,false],
    ['Tee shots in trouble per 18',o.fwTries?per(o.teeBad):null,2.1,false],['Doubles or worse per 18',per(o.dbl),0.7,false]];
  const vsRows=VS.map(([k,y,sc,hi])=>{const isPct=hi,fmt=v=>v==null?'–':isPct?Math.round(v)+'%':d1(v);const good=y!=null&&(hi?y>=sc:y<=sc);
    const max=isPct?100:Math.max(sc*2,(y||0)*1.15);
    return `<div class="vs-r"><div class="vs-l"><span>${k}</span><span class="vs-n"><b class="num">${fmt(y)}</b><small>scratch ${isPct?sc+'%':sc}</small></span></div>${y==null?'<div class="meter"></div>':meter(y,sc,max,good)}</div>`;}).join('');
  const teeTot=Object.values(o.tee).reduce((a,b)=>a+b,0);
  const fpPS=PUTT_LEN.some(([k])=>o.fp[k]&&(o.fp[k].p||o.fp[k].s));
  const fpRows=PUTT_LEN.filter(([k])=>o.fp[k]).map(([k,l])=>{const b=o.fp[k];return `<tr><td class="l">${l}</td><td>${b.holes}</td><td>${(b.putts/b.holes).toFixed(1)}</td><td>${pct(b.three,b.holes)}</td>${fpPS?`<td>${b.p||b.s?`${b.s||0} · ${b.p||0}`:'–'}</td>`:''}</tr>`;}).join('');
  const paceRows=PUTT_LEN.filter(([k])=>o.pace[k]).map(([k,l])=>{const b=o.pace[k];return `<tr><td class="l">${l}</td><td>${b.n}</td><td>${pct(b.made,b.n)}</td><td>${b.leftN?Math.round(b.left/b.leftN)+' ft':'–'}</td></tr>`;}).join('');
  const why3=top[2]!=='three'?'':(()=>{const p=o.tp.p,s=o.tp.s,n=p+s;
    if(n<4)return `<p class="why3">${n?`${n} of your 3-putts ${n===1?'is':'are'} tagged so far. After 4, this shows which way they miss.`:'When a putt misses, tap Short or Past. After a few 3-putts, this shows which way they miss.'}</p>`;
    if(p>=.7*n)return `<p class="why3"><b>Your 3-putts start long.</b> The first putt rolled past ${p} of ${n} times. Soften it: 1 to 2 feet past, no more.</p>`;
    if(s>=.7*n)return `<p class="why3"><b>Your 3-putts start short.</b> The first putt stopped short ${s} of ${n} times. Hit it firmer, so every first putt reaches the hole.</p>`;
    return `<p class="why3"><b>No one-way miss yet.</b> On your 3-putts the first putt was short ${s} times and past ${p} times.</p>`;})();
  const clubRows=TCLUB.filter(([k])=>o.teeClub[k]).map(([k,l])=>{const b=o.teeClub[k];return `<tr><td class="l">${l}</td><td>${b.n}</td><td>${pct(b.fw,b.n)}</td><td>${pct(b.bad,b.n)}</td></tr>`;}).join('');
  const parRows=[3,4,5].filter(p=>o.parType[p][1]).map(p=>`<tr><td class="l">Par ${p}</td><td>${o.parType[p][1]}</td><td>${(o.parType[p][0]/o.parType[p][1]>=0?'+':'')+(o.parType[p][0]/o.parType[p][1]).toFixed(2)}</td></tr>`).join('');
  const teeRows=TEE.filter(([k])=>k!=='short'||o.tee.short).map(([k,l])=>`<tr><td class="l">${l}</td><td>${o.tee[k]||0}</td><td>${pct(o.tee[k]||0,teeTot)}</td></tr>`).join('');
  return `<div><h1 class="t1">Stats</h1><p class="sub">${use.length} ${use.length===1?'round':'rounds'} · ${holes} holes${!real.length?' · example round':''}</p></div>
    ${!real.length?'<p class="notex">These numbers come from the example round. Your own rounds replace it as soon as you play one.</p>':''}
    ${holes<9?`<section class="hero"><span class="cap">Biggest leak</span><h2 class="t2">Too early to call</h2><p>Log ${9-holes} more ${9-holes===1?'hole':'holes'} and this names the one thing costing you the most shots.</p></section>`:top[1]<.05?`<section class="hero"><span class="cap">Biggest leak</span><h2 class="t2">No leak stands out</h2><p>No penalties, 3-putts or wasted chips so far. Keep logging rounds.</p></section>`:`<section class="hero"><span class="cap">Biggest leak</span><h2 class="t2">${top[0]}</h2><div class="big num">${d1(top[1])}<small>shots per 18</small></div><p>${fz[0]}</p>${why3}<a class="lnk" href="${fz[1]}" target="_blank" rel="noopener">Open ${fz[2]} ↗</a></section>`}
    <section class="box"><h2 class="t3">You vs a scratch golfer</h2><div class="key"><span><i></i>You</span><span><em></em>Scratch</span></div><div class="vs">${vsRows}</div>
      ${holes<18?`<p class="src">Small sample: ${holes} ${holes===1?'hole':'holes'} so far. These settle after a few rounds.</p>`:''}<p class="src">Scratch averages from Shot Scope and Arccos data, reported by Golf Monthly.</p></section>
    <section class="box"><h2 class="t3">Where your shots go</h2><p class="sub">Per 18 holes</p>
      ${leaks.map(l=>`<div class="lb"><span>${l[0]}</span><b>${d1(l[1])}</b>${meter(l[1],0,lmax,false).replace('<em style="left:0%"></em>','')}</div>`).join('')}</section>
    <section class="box"><h2 class="t3">Trouble and short game</h2>
      ${o.trN+o.gsN+o.chN?`<div class="bento">
        <div class="tile"><span class="num">${pct(o.trOk,o.trN)}</span><span>Out of trees or a fairway bunker in one (${o.trN})</span></div>
        <div class="tile"><span class="num">${pct(o.gsOn,o.gsN)}</span><span>Greenside bunker shots onto the green (${o.gsN})</span></div>
        <div class="tile"><span class="num">${pct(o.chOn,o.chN)}</span><span>Chips and pitches onto the green (${o.chN})</span></div>
        <div class="tile"><span class="num">${pct(o.ssMade,o.ssTries)}</span><span>Sand saves (${o.ssTries})</span></div></div>`:'<p class="sub">Fills in as you tap shots from trees, bunkers and near the green.</p>'}
      <a class="lnk" href="https://claude.ai/artifact/8b6MXTYjy6bSchY3kZzVWk" target="_blank" rel="noopener">Open Short Game School ↗</a></section>
    <details class="more"><summary>More numbers</summary><div class="more-b">
      <div><h3>Tee shots, par 4s and 5s</h3><div class="tw"><table class="dt"><thead><tr><th class="l">Result</th><th>Shots</th><th>Share</th></tr></thead><tbody>${teeRows}</tbody></table></div></div>
      ${clubRows?`<div><h3>Tee shots by club</h3><div class="tw"><table class="dt"><thead><tr><th class="l">Club</th><th>Shots</th><th>Fairway</th><th>Trouble</th></tr></thead><tbody>${clubRows}</tbody></table></div></div>`:''}
      <div><h3>Putting by first-putt length</h3>${fpRows?`<div class="tw"><table class="dt"><thead><tr><th class="l">First putt</th><th>Holes</th><th>Putts</th><th>3-putts</th>${fpPS?'<th>Short · past</th>':''}</tr></thead><tbody>${fpRows}</tbody></table></div>${fpPS?'<p class="src">Short · past counts first putts that missed.</p>':''}`:'<p class="sub">Tap the first-putt length on the green to fill this in.</p>'}</div>
      ${paceRows?`<div><h3>Paced putts</h3><div class="tw"><table class="dt"><thead><tr><th class="l">Distance</th><th>Putts</th><th>Made</th><th>Left on a miss</th></tr></thead><tbody>${paceRows}</tbody></table></div><p class="src">Every putt you paced, at 1 step = ${stepFt().toFixed(1)} ft. "Left on a miss" is the average distance to the hole for the next putt.</p></div>`:''}

      ${cardCheck(use)}

    </div></details>`;
}
function cardCheck(list){
  const by={},tot={n:0,on:0,short:0,long:0,side:0};
  list.forEach(r=>r.h.forEach(h=>{
    const on=h.pickOn!=null?h.pickOn:h.gir;
    if(!h.yd||!h.app||!h.pick||YCODE[h.pick]!==h.app||on==null)return;
    const res=on?'on':(h.miss==='short'||h.miss==='long'?h.miss:(h.miss?'side':null));if(!res)return;
    const b=by[h.pick]||(by[h.pick]={n:0,on:0,short:0,long:0,side:0});b.n++;b[res]++;tot.n++;tot[res]++;}));
  if(!tot.n)return `<div><h3>Yardage Card check</h3><p class="sub">Before a shot to the green, tap the yards above the map, slide to the real number and tap Hit the club it picks. After a round this shows whether your course distances match your bay numbers.</p></div>`;
  const rows=Object.keys(YC).filter(k=>by[k]).map(k=>{const b=by[k];return `<tr><td class="l">${YNAME[k]}</td><td>${b.n}</td><td>${b.on}</td><td>${b.short}</td><td>${b.long}</td><td>${b.side}</td></tr>`;}).join('');
  const lean=tot.short>tot.long+1?'You come up short more often than long, so the course plays longer than the bay. Take one more club until your card catches up.':tot.long>tot.short+1?'You fly it long more often than short. Take one less club when the card is between two.':'Short and long misses are about even, so the card’s distances fit the course.';
  return `<div><h3>Yardage Card check</h3><p class="sub">${tot.n} ${tot.n===1?'shot':'shots'} where you hit the club the card picked. ${lean}</p>
    <div class="tw"><table class="dt"><thead><tr><th class="l">Club</th><th>Shots</th><th>On</th><th>Short</th><th>Long</th><th>Side</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;

      if(v==='auto'){const svg=b.closest('svg'),G=realG(h);P=svg&&G?realTapPt(svg,ev):null;if(!P)break;const z=zoneAt(G,P);
        if(z==='W'){toast('That’s in the water: tap dry land');break;}if(z==='G'){toast('Drops can’t go on the green: tap beside it');break;}v=z;}
      const e=stamp(v==='same'?{drop:prevFrom(h),same:1,t:Date.now()}:{drop:v,t:Date.now()});
      if(P)e.p=P;else{const svg=b.closest('svg');const pt=svg?svgPt(svg,ev):null;if(pt){e.x=pt[0];e.y=pt[1];}}
      h.sh.push(e);if(h.cond)h.cond=Object.assign({},h.cond,{l:lieFor(e.drop)});const left=mapLeft(h);tapped(h,`Playing from ${v==='same'?'the same spot':LBL[v].toLowerCase()}${left?` · ${left} yd to go`:''}`);break;}
    case 'putt':{if(!h.sh)h.sh=[];const k=(h.putts||0)+1,v=b.dataset.v,made=v==='made';if(k===1)learnGreen(r,i);const e={to:made?'H':'G',t:Date.now()};if(v==='short')e.m='s';else if(v==='past')e.m='p';if(h.pst!=null){e.st=h.pst;delete h.pst;r.stepFt=stepFt();}h.sh.push(stamp(e));tapped(h,made?`Holed on putt ${k}`:v==='short'?`Putt ${k} short`:v==='past'?`Putt ${k} past`:`Putt ${k} missed`);if(pos(h)==='H')window.scrollTo(0,0);break;}
    case 'plus1':{if(!h.sh)h.sh=[];h.sh.push(stamp({to:pos(h),f:1,t:Date.now()}));const c=strokesOf(h);tapped(h,`Added a shot. Now on shot ${c.n+c.p+1}`);break;}
    case 'behind':toast(b.dataset.v==='green'?'You’re by the green: tap the green, around it, or a bunker':'That’s behind your ball: tap ahead of it');break;
    case 'undo':{$('toast').hidden=true;if(h&&h.sh&&h.sh.length&&!isQuick(h)){const x=h.sh.pop();if(x&&x.st!=null)h.pst=x.st;redo();}break;}
    case 'pace':S.sheet='pace';renderSheet();break;
    case 'pacen':{const n=+b.dataset.v;if(n>0){h.pst=n;if((h.putts||0)===0)h.fp=fpBand(n*stepFt());}else delete h.pst;S.sheet=null;renderSheet();touch(S.cur);render();if(n>0)toast(`${n} ${n===1?'step':'steps'}, about ${ftOf(n)} ft`,false);break;}
    case 'stepk':{setStepFt(stepFt()+(+b.dataset.v)*0.1);if(h&&(h.putts||0)===0&&h.pst!=null)h.fp=fpBand(h.pst*stepFt());renderSheet();render();break;}
    case 'staleok':S.staleOk=S.cur+':'+i;render();break;
    case 'fp':h.fp=h.fp===b.dataset.v?null:b.dataset.v;touch(S.cur);render();break;
    case 'miss':h.miss=h.miss===b.dataset.v?null:b.dataset.v;touch(S.cur);render();break;
    case 'qs':S.qs={s:h.s!=null?h.s:null,p:h.s!=null?h.putts:null};S.sheet='qs';renderSheet();break;
    case 'qsn':S.qs.s=+b.dataset.v;renderSheet();break;
    case 'qsp':S.qs.p=S.qs.p===+b.dataset.v?null:+b.dataset.v;renderSheet();break;
    case 'qssave':{if(S.qs.s==null)break;h.quick=true;h.s=S.qs.s;h.putts=S.qs.p;S.sheet=null;renderSheet();touch(S.cur);render();window.scrollTo(0,0);toast(`Hole ${holeNo(r,i)}: ${h.s} saved`,false);break;}
    case 'tap':h.quick=false;if(!h.sh)h.sh=[];redo();break;
    case 'plan':{const rem=remainingYd(h),c=strokesOf(h),tee=c.n===0&&pos(h)==='T';S.planYd=rem?rem.yd:(tee?(h.par===3?150:h.par===5?480:370):150);S.planSrc=null;S.sheet='plan';renderSheet();break;}
    case 'pstep':setPlanYd(S.planYd+(+b.dataset.d),'b');savePlanYd();break;
    case 'gpsuse':{const g=gpsYards();if(g){setPlanYd(g.mid,'b');S.planSrc='gps';const t=$('pl-src');if(t)t.textContent='GPS yards to the middle of the green';const l=$('gpsline');if(l)l.innerHTML=gpsLineHTML();}break;}
    case 'cond':{const c=Object.assign({},h.cond||defCond(h));c[b.dataset.k]=b.dataset.v;h.cond=c;S.condOpen=true;touch(S.cur);renderSheet();break;}
    case 'hit':{const k=b.dataset.k,d=+b.dataset.d,c=strokesOf(h),tee=c.n===0&&pos(h)==='T';
      if(S.planSrc==='set')savePlanYd();
      h.nextPk={n:c.n,k,d};
      if(tee&&h.par>=4)h.tc=TEECODE[k]||'iron';
      if(b.dataset.reach==='1'){h.app=YCODE[k]||null;h.pick=k;h.pickAt=c.n;h.miss=null;if(!h.yd||h.ydN!==c.n){h.yd=S.planYd;h.ydN=c.n;}}
      S.sheet=null;renderSheet();redo();toast(`${YNAME[k]} it is. Tap where it lands.`,false);break;}
    case 'import':S.sheet='import';renderSheet();break;
    case 'doimport':{const n=importCode(($('imp')||{}).value);if(n<0){toast('That code didn’t read. Copy it again and paste the whole thing.',false);break;}S.sheet=null;renderSheet();render();toast(n?`Added ${n} ${n===1?'round':'rounds'}`:'Those rounds are already here',false);break;}
    case 'copyx':{const code=exportCode(),cnt=Object.values(S.rounds).filter(x=>!x.example).length;
      const ok=()=>toast(`Copied ${cnt} ${cnt===1?'round':'rounds'}. In your Stat Card: Rounds → Paste rounds.`,false),bad=()=>{S.sheet='export';renderSheet();const t=$('exp');if(t){t.focus();t.select();}};
      try{navigator.clipboard.writeText(code).then(ok,bad);}catch(e){bad();}break;}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.sheet){if(S.sheet==='plan')savePlanYd();S.sheet=null;renderSheet();render();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('z')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
document.addEventListener('input',e=>{
  if(e.target.id==='pl-r'){setPlanYd(+e.target.value,'s');return;}
  if(e.target.id==='pl-n'){const v=parseInt(e.target.value,10);if(v>0)setPlanYd(v,'n');return;}
  if(e.target.id==='f-course'){S.newCourse=e.target.value;const bx=$('ng-box');if(bx)bx.innerHTML=newGuideHTML();}
});
document.addEventListener('change',e=>{if(e.target.id==='pl-r'||e.target.id==='pl-n')savePlanYd();});
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='condd')S.condOpen=e.target.open;},true);
const ROUTES=['rounds','play','caddy','stats','summary'];
window.addEventListener('hashchange',()=>{let v=location.hash.slice(1);if(v==='patterns')v='stats';if(ROUTES.includes(v)&&v!==S.view){S.view=v;render();}});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&(pending.size||pendingDel.size)){clearTimeout(flushTimer);flush();}
  if(document.visibilityState==='hidden')gpsStop();
  if(document.visibilityState==='visible'&&S.view==='play'&&!S.sheet&&!editingText())render();
  wakeSync();
});
window.addEventListener('online',()=>{clearTimeout(flushTimer);flush();});
let fitT=null;window.addEventListener('resize',()=>{clearTimeout(fitT);fitT=setTimeout(fitMap,120);});
try{if(window.self!==window.top&&matchMedia('(pointer: coarse)').matches)document.documentElement.classList.add('gm-framed');}catch(e){}
loadLocal();try{S.cad=JSON.parse(localStorage.getItem('psc.cad')||'{}')||{};}catch(e){}
let hv=location.hash.slice(1);if(hv==='patterns')hv='stats';
S.view=ROUTES.includes(hv)?hv:(S.cur&&S.rounds[S.cur]&&S.rounds[S.cur].status!=='done'?'play':'rounds');
render();syncLabel();connect();
})();
</script>

    ]],
    ['Your gear', [
      ['fit', 'Fitting Coach', '5oXjZQ73k6CoJ9utZxQwtN', 'What to watch when you try shafts and clubs.', '#7C3AED'],
      ['anybag', 'Any-Brand Bag', 'Bc1W159KgbRqmzh5GzshWt', 'The best club per slot, from any brand.', '#0F766E'],
      ['bag', 'Mizuno Bag', 'TjzsnvZ115vkRrUm5XGKyQ', 'The clubs and specs your numbers point to.', '#48484A']
    ]]
  ];
  const ARROW = '<svg class="gm-end" viewBox="0 0 18 18" aria-hidden="true"><path d="M6 12 12 6M7 6h5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CHECK = '<svg class="gm-end" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 9.5 7.5 13 14 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const dlg = document.getElementById('gmDrawer');
  const fab = document.getElementById('gmOpen');
  const wide = matchMedia('(min-width: 720px)');
  const still = matchMedia('(prefers-reduced-motion: reduce)');

  function fill(box) {
    box.textContent = '';
    GROUPS.forEach(([label, pages]) => {
      const g = document.createElement('div');
      g.className = 'gm-group';
      const l = document.createElement('p');
      l.className = 'gm-label';
      l.textContent = label;
      const list = document.createElement('div');
      list.className = 'gm-list';
      pages.forEach(([key, name, id, blurb, color]) => {
        const a = document.createElement('a');
        a.className = 'gm-row';
        const here = key === HERE;
        a.innerHTML = '<span class="gm-ico" style="--c:' + color + '"><svg viewBox="0 0 22 22" aria-hidden="true">' + ICONS[key] + '</svg></span>' +
          '<span class="gm-txt"><b></b><small></small></span>' + (here ? CHECK : ARROW);
        a.querySelector('b').textContent = name;
        a.querySelector('small').textContent = here ? 'You’re here' : blurb;
        if (here) {
          a.href = '#';
          a.setAttribute('aria-current', 'page');
          a.addEventListener('click', e => { e.preventDefault(); close(); window.scrollTo({ top: 0, behavior: still.matches ? 'auto' : 'smooth' }); });
        } else {
          a.href = ART + id;
          a.target = '_blank';
          a.rel = 'noopener';
        }
        list.appendChild(a);
      });
      g.append(l, list);
      box.appendChild(g);
    });
  }

  // Open and close with the sheet's own motion; the native dialog keeps focus, Esc and the dimmed page.
  let closing = false;
  function open() {
    if (dlg.open) return;
    dlg.classList.remove('gm-closing', 'gm-dragging');
    dlg.style.transform = '';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    fab.setAttribute('aria-expanded', 'true');
  }
  function finish() {
    closing = false;
    dlg.classList.remove('gm-closing', 'gm-dragging');
    dlg.style.transform = '';
    if (dlg.close) dlg.close(); else dlg.removeAttribute('open');
    fab.setAttribute('aria-expanded', 'false');
  }
  function close() {
    if (!dlg.open || closing) return;
    closing = true;
    dlg.classList.remove('gm-dragging');
    if (still.matches) { finish(); return; }
    dlg.classList.add('gm-closing');
    let done = false;
    const end = () => { if (!done) { done = true; finish(); } };
    dlg.addEventListener('animationend', end, { once: true });
    setTimeout(end, 420);
  }
  dlg.addEventListener('cancel', e => { e.preventDefault(); close(); });
  dlg.addEventListener('click', e => { if (e.target === dlg) close(); });
  fab.addEventListener('click', open);
  document.getElementById('gmClose').addEventListener('click', close);

  // Pull the sheet down to dismiss it (phones); a short or slow pull springs back.
  let drag = null;
  function down(e) {
    if (wide.matches || e.button > 0 || e.target.closest('button, a')) return;
    drag = { y: e.clientY, t: performance.now(), dy: 0, v: 0, id: e.pointerId };
    dlg.classList.add('gm-dragging');
    dlg.style.transition = 'none';
    e.currentTarget.setPointerCapture(e.pointerId);
  }
  function move(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const now = performance.now();
    const dy = e.clientY - drag.y;
    drag.v = (dy - drag.dy) / Math.max(1, now - drag.t);
    drag.dy = dy; drag.t = now;
    dlg.style.transform = 'translateY(' + (dy > 0 ? dy : dy / 4) + 'px)';
  }
  function up(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const { dy, v } = drag;
    drag = null;
    dlg.style.transition = '';
    if (dy > 110 || (dy > 24 && v > 0.55)) { close(); return; }
    dlg.style.transition = 'transform 0.5s var(--ease)';
    dlg.style.transform = '';
    setTimeout(() => { dlg.style.transition = ''; dlg.classList.remove('gm-dragging'); }, 520);
  }
  ['gmGrab', 'gmTop'].forEach(id => {
    const h = document.getElementById(id);
    h.addEventListener('pointerdown', down);
    h.addEventListener('pointermove', move);
    h.addEventListener('pointerup', up);
    h.addEventListener('pointercancel', up);
  });

  // "On this page" mirrors the page's own section bar, minus its old "More pages" tab.
  const tabs = [...document.querySelectorAll('nav.tabs a[href^="#"]')].filter(a => a.getAttribute('href') !== '#more');
  if (tabs.length) {
    const jump = dlg.querySelector('.gm-jump');
    tabs.forEach(t => {
      const c = t.cloneNode(true);
      c.querySelectorAll('b').forEach(b => b.remove());
      const a = document.createElement('a');
      a.textContent = c.textContent.trim();
      a.href = t.getAttribute('href');
      a.addEventListener('click', e => { e.preventDefault(); close(); setTimeout(() => { location.hash = a.getAttribute('href').slice(1); }, still.matches ? 0 : 200); });
      jump.appendChild(a);
    });
    document.getElementById('gmHere').hidden = false;
  }

  fill(dlg.querySelector('.gm-groups'));
  document.querySelectorAll('[data-gm-list]').forEach(box => {
    const groups = document.createElement('div');
    groups.className = 'gm-groups';
    box.appendChild(groups);
    fill(groups);
  });

  // The section bar highlights the section you're reading and keeps that pill in view.
  const strip = document.querySelector('nav.tabs .in');
  const spy = new Map();
  document.querySelectorAll('nav.tabs a[href^="#"]').forEach(a => {
    const s = document.getElementById(a.getAttribute('href').slice(1));
    if (s) spy.set(s, a);
  });
  if (strip && spy.size && 'IntersectionObserver' in window) {
    let current = null;
    const mark = a => {
      if (a === current) return;
      if (current) current.removeAttribute('aria-current');
      current = a;
      if (!a) return;
      a.setAttribute('aria-current', 'true');
      const left = a.offsetLeft - (strip.clientWidth - a.offsetWidth) / 2;
      strip.scrollTo({ left: Math.max(0, left), behavior: still.matches ? 'auto' : 'smooth' });
    };
    const seen = new Set();
    const first = spy.keys().next().value;
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) seen.add(en.target); else seen.delete(en.target); });
      const top = [...seen].sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top)[0];
      if (top) mark(spy.get(top));
      else if (first.getBoundingClientRect().top > window.innerHeight * 0.3) mark(null);
    }, { rootMargin: '-28% 0px -66% 0px' });
    spy.forEach((a, s) => io.observe(s));
  }

  // The button shrinks to its icon while you scroll down and grows back when you scroll up.
  let lastY = window.scrollY, ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      if (Math.abs(y - lastY) > 8) {
        fab.classList.toggle('gm-tuck', y > lastY && y > 240);
        lastY = y;
      }
      ticking = false;
    });
  }, { passive: true });
})();
</script>
<!-- gm:end -->
</body>
