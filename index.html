<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pocket Stat Card GPS</title>
<meta name="description" content="On-course stat card with GPS yards to the green and a club plan for every shot.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stat Card">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060A07" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>

/* Layout: one thumb, one screen. Status at the top, a tappable map of the hole in the middle, every action in the bottom thumb zone above a floating glass tab bar. */
:root{
  --c-bg:#EDF1EC;--c-surface:#FFFFFF;--c-raise:#F5F7F4;--c-ink:#101712;--c-muted:#5B6860;--c-hair:rgba(16,23,18,.1);
  --c-fill:rgba(20,40,26,.065);--c-fill-2:rgba(20,40,26,.16);--c-seg-on:#FFFFFF;
  --c-accent:#14864A;--c-accent-ink:#FFFFFF;--c-accent-soft:#DCF0E2;--c-link:#11733E;
  --c-bad:#D33B2C;--c-bad-soft:#FBE3DF;--c-warn:#A86B0C;--c-warn-soft:#F7EBD2;
  --c-glass:rgba(252,253,252,.97);--c-glass-edge:rgba(255,255,255,.75);--c-glass-hi:rgba(255,255,255,.8);
  --c-sheet:#F7F9F6;--c-scrim:rgba(8,14,10,.32);
  --c-shadow:0 .5px 1px rgba(16,23,18,.06),0 3px 10px -6px rgba(16,23,18,.18);
  --m-rough:#86AC5E;--m-fair:#A9D57D;--m-stripe:#B6DE8E;--m-fringe:#BDE39A;--m-green:#84DC5C;--m-green-hi:#93E56C;
  --m-sand:#EDDCAF;--m-sand-edge:#D9C48E;--m-trees:#4E7A42;--m-tree:#3B6533;--m-line:#FFFFFF;--m-ball:#FFFFFF;
  --m-label:#10260F;--m-chip:rgba(255,255,255,.86);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.4,.5,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --c-bg:#060A07;--c-surface:#131915;--c-raise:#1A211C;--c-ink:#EEF3EF;--c-muted:#98A79C;--c-hair:rgba(238,243,239,.11);
  --c-fill:rgba(220,240,226,.085);--c-fill-2:rgba(220,240,226,.2);--c-seg-on:#2B352E;
  --c-accent:#36D06E;--c-accent-ink:#03140A;--c-accent-soft:#11301C;--c-link:#5BDD8B;
  --c-bad:#FF6F5E;--c-bad-soft:#3A1612;--c-warn:#F2B650;--c-warn-soft:#33260E;
  --c-glass:rgba(24,30,26,.97);--c-glass-edge:rgba(255,255,255,.1);--c-glass-hi:rgba(255,255,255,.07);
  --c-sheet:#141A16;--c-scrim:rgba(0,0,0,.55);
  --c-shadow:0 0 0 .5px rgba(255,255,255,.07),0 14px 30px -14px rgba(0,0,0,.85);
  --m-rough:#33522A;--m-fair:#4C7D35;--m-stripe:#56883C;--m-fringe:#5C9140;--m-green:#62B843;--m-green-hi:#6EC54E;
  --m-sand:#8F7D50;--m-sand-edge:#7A6A42;--m-trees:#1E361C;--m-tree:#172C16;--m-line:#FFFFFF;--m-ball:#FFFFFF;
  --m-label:#F1F7EE;--m-chip:rgba(8,16,9,.62);color-scheme:dark}}
:root[data-theme="dark"]{
  --c-bg:#060A07;--c-surface:#131915;--c-raise:#1A211C;--c-ink:#EEF3EF;--c-muted:#98A79C;--c-hair:rgba(238,243,239,.11);
  --c-fill:rgba(220,240,226,.085);--c-fill-2:rgba(220,240,226,.2);--c-seg-on:#2B352E;
  --c-accent:#36D06E;--c-accent-ink:#03140A;--c-accent-soft:#11301C;--c-link:#5BDD8B;
  --c-bad:#FF6F5E;--c-bad-soft:#3A1612;--c-warn:#F2B650;--c-warn-soft:#33260E;
  --c-glass:rgba(24,30,26,.97);--c-glass-edge:rgba(255,255,255,.1);--c-glass-hi:rgba(255,255,255,.07);
  --c-sheet:#141A16;--c-scrim:rgba(0,0,0,.55);
  --c-shadow:0 0 0 .5px rgba(255,255,255,.07),0 14px 30px -14px rgba(0,0,0,.85);
  --m-rough:#33522A;--m-fair:#4C7D35;--m-stripe:#56883C;--m-fringe:#5C9140;--m-green:#62B843;--m-green-hi:#6EC54E;
  --m-sand:#8F7D50;--m-sand-edge:#7A6A42;--m-trees:#1E361C;--m-tree:#172C16;--m-line:#FFFFFF;--m-ball:#FFFFFF;
  --m-label:#F1F7EE;--m-chip:rgba(8,16,9,.62);color-scheme:dark}

/* One size scale for every part: text, control heights, corners and gaps come only from these tokens */
:root{
  --t-micro:11.5px;--t-cap:13px;--t-small:14px;--t-body:15px;--t-label:16px;--t-title:17px;--t-h2:22px;--t-h1:28px;--t-num:24px;--t-num-l:34px;
  --h-chip:36px;--h-ctl:42px;--h-btn:48px;--h-act:54px;--h-act-l:62px;
  --r-s:10px;--r-m:14px;--r-l:18px;--r-xl:22px;
  --g-s:8px;--g-m:12px;--g-l:16px;
}
*{box-sizing:border-box}
html,body{background:var(--c-bg)}
body{color:var(--c-ink);font-family:var(--f-ui);-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html body::after{content:none}
.gm-fab{display:none!important}
button{font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:var(--g-m)}
#main{display:flex;flex-direction:column;gap:var(--g-m)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}

/* Type */
.t1{font:800 var(--t-h1)/1.1 var(--f-num);letter-spacing:-.03em;margin:0;text-wrap:balance}
.t2{font:700 var(--t-h2)/1.2 var(--f-num);letter-spacing:-.02em;margin:0;text-wrap:balance}
.t3{font:700 var(--t-title)/1.25 var(--f-ui);letter-spacing:-.015em;margin:0}
.sub{margin:0;color:var(--c-muted);font-size:var(--t-body);line-height:1.4}
.cap{font-size:var(--t-cap);font-weight:600;color:var(--c-muted);letter-spacing:.01em}
.src{font-size:var(--t-cap);color:var(--c-muted);margin:0;line-height:1.4}
.pwhy{margin:0;font-size:var(--t-small);color:var(--c-muted);line-height:1.5}
.topline{display:flex;justify-content:space-between;align-items:center;min-height:24px;gap:10px}
.wm{font:700 var(--t-small)/1 var(--f-num);color:var(--c-muted)}
.sync,.gpsdot{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-cap);color:var(--c-muted)}
.sync i,.gpsdot i{width:7px;height:7px;border-radius:50%;background:var(--c-muted)}
.sync.ok i,.gpsdot i.ok{background:var(--c-accent)}.sync.warn i{background:var(--c-warn)}.gpsdot i.bad{background:var(--c-bad)}
.notex{font-size:var(--t-small);line-height:1.4;padding:10px 14px;border-radius:var(--r-m);background:var(--c-warn-soft);margin:0}

/* Surfaces: one card style, one inset style */
.box,.res,.list,.tile,details.more,.strip{background:var(--c-surface);box-shadow:var(--c-shadow);min-width:0}
.box{border-radius:var(--r-xl);padding:var(--g-l);display:flex;flex-direction:column;gap:var(--g-m)}
.mapw,.greenw{border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--c-shadow);line-height:0;background:var(--m-rough)}
.greenw{background:var(--m-fringe)}
.map{width:100%;height:auto;display:block}

/* Controls: three heights only (chip, control, button) */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:var(--r-m);background:var(--c-fill)}
.seg button{border:0;background:transparent;color:var(--c-ink);font:600 var(--t-small)/1 var(--f-ui);padding:0 11px;min-height:var(--h-chip);border-radius:var(--r-s);cursor:pointer;white-space:nowrap;transition:background-color .2s,box-shadow .2s,transform .35s var(--spring)}
.seg button[aria-pressed="true"]{background:var(--c-seg-on);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px var(--c-hair)}
.seg.full{display:grid;width:100%}
.seg.big button{min-height:var(--h-ctl);font-size:var(--t-body)}
.ib{flex:none;width:var(--h-ctl);height:var(--h-ctl);border-radius:var(--r-m);border:0;background:var(--c-fill);color:var(--c-ink);display:grid;place-items:center;font:700 var(--t-body) var(--f-num);cursor:pointer;transition:transform .35s var(--spring)}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.cta{min-height:var(--h-btn);border:0;border-radius:var(--r-l);background:var(--c-accent);color:var(--c-accent-ink);font:700 var(--t-label) var(--f-ui);letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%;padding:0 18px;transition:transform .35s var(--spring),opacity .2s}
.cta svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cta:disabled{opacity:.38;cursor:default}
.cta.sec{background:var(--c-fill);color:var(--c-ink)}
.ghost{min-height:var(--h-ctl);border:0;border-radius:var(--r-m);background:var(--c-fill);color:var(--c-ink);font:600 var(--t-small) var(--f-ui);padding:0 14px;cursor:pointer}
.ghost.go{background:var(--c-accent);color:var(--c-accent-ink)}.ghost.bad{color:var(--c-bad)}
.lk{border:0;background:none;color:var(--c-link);font:600 var(--t-small) var(--f-ui);padding:6px 4px;min-height:var(--h-chip);cursor:pointer}
.lnk{font:600 var(--t-small) var(--f-ui);color:var(--c-link);text-decoration:none;min-height:var(--h-chip);display:inline-flex;align-items:center;align-self:flex-start}
.back{align-self:flex-start;border:0;background:none;color:var(--c-link);font:600 var(--t-body) var(--f-ui);min-height:var(--h-chip);padding:0;cursor:pointer}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pl{min-height:var(--h-chip);border:0;border-radius:999px;background:var(--c-fill);color:var(--c-ink);font:600 var(--t-small) var(--f-ui);padding:0 13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.pl[aria-pressed="true"]{background:var(--c-ink);color:var(--c-bg)}
.pl.wchip{flex-direction:column;align-items:flex-start;border-radius:var(--r-m);padding:7px 11px;line-height:1.2;width:100%}
.pills:has(.wchip){display:grid;grid-template-columns:1fr 1fr}
.pills .wchip:nth-of-type(1){grid-column:1/-1}.pills .wchip:nth-of-type(2){order:1}.pills .wchip:nth-of-type(4){order:2}.pills .wchip:nth-of-type(3){order:3}.pills .wchip:nth-of-type(5){order:4}
.pl.wchip small{font-size:var(--t-micro);opacity:.75;font-weight:500}
.wf{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
.inp{min-height:var(--h-ctl);border:0;border-radius:var(--r-m);background:var(--c-fill);color:var(--c-ink);font:500 var(--t-label) var(--f-ui);padding:0 14px;width:100%}
.inp:focus,.code:focus{outline:2px solid var(--c-accent);outline-offset:1px}
.inp.sm{width:auto;flex:0 1 auto}
.code{width:100%;min-height:110px;border:0;border-radius:var(--r-m);background:var(--c-fill);color:var(--c-ink);font:var(--t-cap)/1.4 ui-monospace,Menlo,monospace;padding:12px;resize:vertical}
.r2{display:flex;gap:var(--g-s);flex-wrap:wrap}.r2>*{flex:1 1 auto}
.links{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap}
.ask{display:flex;flex-direction:column;gap:6px}
.ib:active,.act:active,.cta:active:not(:disabled),.seg button:active,.pl:active,.nb:active,.hb:active,.ghost:active,.lr:active,.sp:active,.resume:active{transform:scale(.96)}

/* Play: one screen. Header, shot bar, the map takes the height that's left, actions above the tab bar */
html{height:100%}body{min-height:100%}
body[data-view="play"]{height:100%;overflow:hidden;overscroll-behavior:none}
body[data-view="play"] .topline{display:none}
body[data-view="play"] .app{height:100%;padding-block:6px calc(72px + env(safe-area-inset-bottom,0px));gap:var(--g-s)}
body[data-view="play"] #main{flex:1 1 auto;min-height:0}
.play{display:flex;flex-direction:column;gap:var(--g-s);height:100%;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.play>*{flex:none}
.hd{display:flex;align-items:center;gap:var(--g-s);min-height:var(--h-ctl)}
.hd-hole{border:0;background:none;padding:2px 0;text-align:left;color:inherit;cursor:pointer;display:flex;min-width:0}
.hd-t{font:800 var(--t-h1)/1 var(--f-num);letter-spacing:-.03em;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chevr{width:16px;height:16px;fill:none;stroke:var(--c-muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chev{width:16px;height:16px;fill:none;stroke:var(--c-muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-top:3px}
.hd-pill{font:600 var(--t-cap) var(--f-ui);color:var(--c-muted);background:var(--c-fill);border-radius:999px;padding:4px 9px;white-space:nowrap}
.hd-pill b{color:var(--c-ink);margin-right:2px}.hd-pill.u b{color:var(--c-accent)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--c-muted);flex:none}.sdot.ok{background:var(--c-accent)}.sdot.warn{background:var(--c-warn)}
.hd .seg{margin-left:auto;flex:none}
.hd .seg button{min-width:40px;padding:0 9px}
.strip{display:flex;align-items:center;gap:var(--g-s);padding:6px;border-radius:var(--r-xl)}
.sn{width:46px;height:46px;border-radius:var(--r-m);background:var(--c-accent);color:var(--c-accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none}
.sn .num{font-size:22px}
.sn small{font-size:var(--t-micro);font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.85;margin-top:1px}
.sn.pen{background:var(--c-bad);color:#fff}
.st{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding-left:2px}
.st b{font:700 var(--t-label)/1.2 var(--f-ui);letter-spacing:-.015em}
.st span{font-size:var(--t-cap);color:var(--c-muted)}
.sp{flex:1;min-width:0;border:0;background:var(--c-fill);border-radius:var(--r-m);min-height:46px;padding:4px 12px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:1px;color:inherit;cursor:pointer;transition:transform .35s var(--spring)}
.sp b{font:700 var(--t-label)/1.2 var(--f-ui);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp small{font-size:var(--t-cap);color:var(--c-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp small .num{font-size:var(--t-small);color:var(--c-ink)}
.sp.gps small{color:var(--c-link)}
.sp.set{background:var(--c-accent-soft)}.sp.set b{color:var(--c-accent)}
.stale{background:var(--c-warn-soft);border-radius:var(--r-l);padding:12px;display:flex;flex-direction:column;gap:var(--g-s)}
.stale b{display:block;font-size:var(--t-label)}.stale span{font-size:var(--t-cap);color:var(--c-muted)}

/* The hole map */
.mapw.fit{flex:1 1 0;min-height:200px;position:relative;display:flex;align-items:center;justify-content:center}
.mapw.fit>svg{width:100%;height:100%}
.mapw.fit.mini{min-height:120px;width:100%;border-radius:var(--r-l)}
.greenw.fitg{flex:1 1 0;min-height:110px;display:flex}.greenw.fitg>svg{width:100%;height:100%}
.m-rough{fill:var(--m-rough)}.m-trees{fill:var(--m-trees)}.m-tree{fill:var(--m-tree)}.m-fair{fill:var(--m-fair)}.m-stripe{fill:var(--m-stripe)}
.m-fringe{fill:var(--m-fringe)}.m-green{fill:var(--m-green)}.m-green-hi{fill:var(--m-green-hi)}.m-sand{fill:var(--m-sand);stroke:var(--m-sand-edge);stroke-width:1.5}.m-tee{fill:var(--m-stripe)}
.z{cursor:pointer;outline:none;transition:filter .15s}
.z:active{filter:brightness(1.14)}.z:focus-visible{filter:brightness(1.18)}
.ml{pointer-events:none}.ml rect{fill:var(--m-chip)}.ml text{fill:var(--m-label);font:600 12.5px var(--f-ui);text-anchor:middle}
.deco{pointer-events:none}
.pin{stroke:var(--m-label);stroke-width:1.6;stroke-linecap:round}.flag{fill:var(--c-bad)}.cup{fill:var(--m-label);opacity:.75}
.tr{fill:none;stroke:var(--m-line);stroke-width:2.4;stroke-dasharray:1 6;stroke-linecap:round}
.td{fill:var(--m-line);opacity:.9}
.ball{fill:var(--m-ball);stroke:rgba(0,0,0,.28);stroke-width:1}
.halo{fill:var(--m-ball);opacity:.28}
.penb rect{fill:var(--c-bad)}.penb text{fill:#fff;font:700 12px var(--f-num);text-anchor:middle}
@media (prefers-reduced-motion:no-preference){.ball.pop,.halo.pop{animation:bpop .5s var(--spring) both;transform-box:fill-box;transform-origin:center}}
@keyframes bpop{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1)}}
.maphint,.teeclubs{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:2;border-radius:999px;background:var(--m-chip);white-space:nowrap}
.maphint{pointer-events:none;font:600 var(--t-cap)/1.2 var(--f-ui);padding:5px 12px;color:var(--m-label)}
.teeclubs{display:flex;gap:2px;padding:3px;box-shadow:0 4px 12px -6px rgba(0,0,0,.35)}
.teeclubs button{border:0;background:transparent;color:var(--m-label);font:600 var(--t-cap) var(--f-ui);min-height:var(--h-chip);padding:0 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.teeclubs button[aria-pressed="true"]{background:var(--c-accent);color:var(--c-accent-ink)}

/* On-course action buttons */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:var(--g-s)}
.acts.one{grid-template-columns:1fr}.acts.three{grid-template-columns:repeat(3,1fr)}
.act{min-height:var(--h-act);border:0;border-radius:var(--r-l);background:var(--c-surface);color:var(--c-ink);box-shadow:var(--c-shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:4px 6px;transition:transform .35s var(--spring)}
.act b{font-size:var(--t-body);font-weight:700;letter-spacing:-.01em}
.act small{font-size:12px;color:var(--c-muted)}
.act.bad b{color:var(--c-bad)}.act.good b{color:var(--c-accent)}
.act.go{background:var(--c-accent);color:var(--c-accent-ink)}.act.go small{color:inherit;opacity:.8}
.act.big{min-height:var(--h-act-l)}.act.big b{font-size:var(--t-title)}

/* Hole finished */
.res{border-radius:var(--r-xl);padding:14px;display:flex;flex-direction:column;gap:10px}
.res:has(.mapw.fit){flex:1 1 0;min-height:0}
.res-top{display:flex;align-items:center;gap:14px}
.res-t{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.pillx{display:inline-flex;align-items:center;min-height:26px;padding:0 11px;border-radius:999px;font:700 var(--t-small) var(--f-ui);background:var(--c-fill)}
.pillx.under{background:var(--c-accent-soft);color:var(--c-accent)}.pillx.over{background:var(--c-warn-soft);color:var(--c-warn)}.pillx.over2{background:var(--c-bad-soft);color:var(--c-bad)}
.hist{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.hist::-webkit-scrollbar{display:none}
.hist span{flex:none;padding:5px 10px;border-radius:999px;background:var(--c-fill);font-size:var(--t-cap);white-space:nowrap}

.sheet{position:relative;width:min(560px,100%);max-height:calc(100% - 36px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;background:var(--c-sheet);border-radius:26px 26px 0 0;padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:var(--g-m);box-shadow:0 -16px 50px -20px rgba(0,0,0,.35)}

.list{border-radius:var(--r-xl);overflow:hidden;display:flex;flex-direction:column}

.tabbar{grid-template-columns:repeat(5,1fr);width:min(420px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)))}

function pickClub(d){

let CTX=null;
function planCtx(){

  const o=sumStats(real),teeBad={},notes=[];
  Object.entries(o.teeClub).forEach(([code,b])=>{const k=CODE2YC[code];if(k&&b.n>=4&&b.bad/b.n>=.4){teeBad[k]=6;notes.push(`On the course, your ${YNAME[k].toLowerCase()} off the tee has found trouble ${b.bad} of ${b.n} times.`);}});

  else if(n>=4&&lo>sh+1){lean=.97;notes.push('Your shots to the green have flown long more often than short, so the plan takes off 3%.');}

function clubMid(k,ctx){const y=YC[k],L=ctx&&ctx.learn&&ctx.learn[k];return L&&L.n>=3?(y.mid*6+L.avg*L.n)/(6+L.n):y.mid;}
function clubPool(lie,ctx){
  const out=[];
  Object.keys(YC).forEach(k=>{
    const y=YC[k];let mid=clubMid(k,ctx),risk=(y.band+Math.abs(y.side))/2;
    if(k==='Driver'&&lie!=='tee')return;
    if(k==='3Wood'&&lie==='fw')risk+=8;
    if(lie==='rough'){if(k==='3Wood')return;mid*=.94;risk+=3;}
    if(lie==='sand'){if(['3Wood','3Hybrid','5Iron'].includes(k))return;mid*=.9;risk+=5;}
    if(lie==='tee'&&ctx.teeBad[k])risk+=ctx.teeBad[k];

function finalPen(R,c){let p=R/60;if(R>150)p+=(R-150)/15;const gap=Math.abs(c.mid-R);if(FAV.has(c.k)&&gap<=8)p-=1;else if(gap>6)p+=1.5;return p;}

  if(R<=55)take({cost:16,steps:[{k:'pitch',d:R}]});
  clubPool(lie,ctx).forEach(c=>{
    if(c.mid>=R-15&&c.mid<=R+15)take({cost:10+c.risk/6+finalPen(R,c),steps:[{k:c.k,d:R,mid:c.mid,soft:c.mid>R+8}]});
    else if(c.mid<R-15&&depth<4){const rest=solve(R-c.mid,'fw',ctx,depth+1,memo);take({cost:10+c.risk/6+rest.cost,steps:[{k:c.k,d:c.mid,mid:c.mid}].concat(rest.steps)});}
  });

function planFor(h,yd){

function stepName(s){return s.k==='chip'?'Chip or putt':s.k==='pitch'?'Pitch with the 56°':s.k==='punch'?'Punch out to the fairway':s.k==='blast'?'Splash it out':s.k==='putt'?'Putt':YNAME[s.k]+(s.soft?', soft swing':'');}

/* How far is left: the yards you slid for this shot, else GPS, else the hole length minus what each shot was expected to go */
function remainingYd(h){

  if(h.ydN!=null&&h.ydN<n&&h.yd){base=h.yd;from=h.ydN;}else if(h.len){base=h.len;from=0;}
  if(base==null)return null;

  let j=null;

    const courses=els.filter(e=>e.tags&&e.tags.leisure==='golf_course'&&e.geometry).map(e=>P(e.geometry));
    const home=courses.find(p=>inPoly(GPS.pos,p))||courses.sort((a,b)=>Math.min(...a.map(p=>hav(p,GPS.pos)))-Math.min(...b.map(p=>hav(p,GPS.pos))))[0]||null;
    const greens=els.filter(e=>e.tags&&e.tags.golf==='green'&&e.geometry).map(e=>{const pts=P(e.geometry);return{pts,c:[pts.reduce((s,p)=>s+p[0],0)/pts.length,pts.reduce((s,p)=>s+p[1],0)/pts.length]};});

        c:best&&bd<80?best.c:end,pts:best&&bd<80?best.pts.filter((p,k,a)=>k%Math.max(1,Math.ceil(a.length/24))===0):null,par:parseInt(e.tags.par,10)||null,len:Math.round(len)});
    });

    const groups={};cand.forEach(x=>(groups[x.pre]=groups[x.pre]||[]).push(x));

    a.forEach((e,j)=>{if(!e.to)return;n++;if(!e.g||e.to==='P')return;const k=e.pk||(n===1&&e.c?CODE2YC[e.c]:null);if(!k||!YC[k])return;

/* ---------- one tap per shot ----------
   h.sh holds the taps in order: {to} is a stroke and where it finished, {drop} is where you play from after a penalty.
   Each tap may carry x,y (where on the map it was tapped) and t (time). derive() turns the taps into the per-hole
   numbers (score, putts, fairway, green, up and down) that the stats read. */

async function flush(){

    else{const body=JSON.parse(JSON.stringify(S.rounds[id]));await S.db.doc('rounds/'+id).set(body);if(S.rounds[id]&&S.rounds[id].updated===body.updated)pending.delete(id);}

async function connect(){

    snap.docs.forEach(d=>{seen.add(d.id);if(pending.has(d.id)||pendingDel.has(d.id))return;const remote=d.data();const local=S.rounds[d.id];if(!local||(remote.updated||0)>=(local.updated||0))S.rounds[d.id]=JSON.parse(JSON.stringify(remote));});

function roundStats(r){

    udTries:0,udMade:0,ssTries:0,ssMade:0,trN:0,trOk:0,gsN:0,gsOn:0,chN:0,chOn:0,teeBad:0,
    tee:{fw:0,left:0,right:0,sand:0,trouble:0,short:0,pen:0},miss:{short:0,long:0,left:0,right:0},parType:{3:[0,0],4:[0,0],5:[0,0]},fp:{},teeClub:{}};

    if(h.ch){o.chN+=h.ch[0];o.chOn+=h.ch[1];}

function sumStats(list){

function mapSVG(h,mode,kk){

    ${Z('F','Fairway',`<path class="m-fair" d="${FW}"/><clipPath id="fwc"><path d="${FW}"/></clipPath><g clip-path="url(#fwc)">${stripes}</g><rect class="m-tee deco" x="150" y="${Y(316)-4}" width="40" height="14" rx="5"/>`)}
    ${Z('B','Fairway bunker',`<ellipse class="m-sand" cx="236" cy="${Y(228)}" rx="23" ry="${14*rk}"/><ellipse class="m-sand" cx="104" cy="${Y(284)}" rx="21" ry="${13*rk}"/>`)}

function greenSVG(h){

    <circle class="halo${pop}" cx="${b[0]}" cy="${b[1]}" r="14"/><circle class="ball${pop}" cx="${b[0]}" cy="${b[1]}" r="7.5"/></g>

function svgPt(svg,ev){if(!ev||!ev.detail||!svg.getScreenCTM)return null;const m=svg.getScreenCTM();if(!m)return null;const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const q=p.matrixTransform(m.inverse()),k=(svg.viewBox&&svg.viewBox.baseVal&&svg.viewBox.baseVal.height||330)/330;return[Math.round(q.x),Math.round(q.y/k)];}
/* Size the map to the space left on screen, so Play never needs a scroll */
function fitMap(){
  const box=document.querySelector('.mapw.fit');if(!box)return;
  const w=box.clientWidth,hh=box.clientHeight;if(!w||!hh)return;
  const k=Math.max(.7,Math.min(1.7,(hh/w)*(340/330)));
  const svg=box.querySelector('svg.map');if(!svg)return;
  const cur=(svg.viewBox.baseVal.height||330)/330;if(Math.abs(k-cur)<.02){S.mapK=k;return;}

/* ---------- views ---------- */
function setView(v){S.view=v;if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);render();window.scrollTo(0,0);}

function renderBanner(){

function sortedRounds(){return Object.entries(S.rounds).sort((a,b)=>(b[1].date||'').localeCompare(a[1].date||'')||(b[1].created||0)-(a[1].created||0));}
function curHole(){const r=S.rounds[S.cur];if(!r)return{};const i=Math.min(S.hole,r.h.length-1);return{r,i,h:r.h[i]};}

/* Play */
function viewPlay(){
  const {r,i,h}=curHole();
  if(!r)return `<section class="empty"><div class="empty-ic">${IC.flag}</div><h1 class="t1">No round going</h1><p class="sub">Start one on the first tee. Each shot is one tap on a map of the hole.</p><button class="cta" data-go="rounds">Start a round</button></section>`;
  const o=roundStats(r),p=pos(h);

  if(isQuick(h)||p==='H')body=doneHTML(r,i,h);
  else if(p==='P')body=dropHTML(h);
  else if(p==='G')body=puttHTML(h);
  else body=shotHTML(r,i,h);
  const tp=o.n?`<span class="hd-pill${o.score-o.par<0?' u':''}"><b class="num">${vsPar(o.score-o.par)}</b> thru ${o.n}</span>`:'';
  return `<div class="play"><header class="hd">
      <button class="hd-hole" data-act="holes" aria-haspopup="dialog" aria-label="Hole ${holeNo(r,i)}. Show all holes"><span class="hd-t">Hole ${holeNo(r,i)}${IC.chev}</span></button>

}
function strip(n,title,sub,h,opt){
  opt=opt||{};const any=(h.sh||[]).length;
  return `<div class="strip"><div class="sn${opt.pen?' pen':''}"><span class="num">${n}</span><small>shot</small></div>
    ${opt.mid||`<div class="st"><b>${title}</b><span>${sub}</span></div>`}
    ${any?`<button class="ib" data-act="undo" aria-label="Undo last tap">${IC.undo}</button>`:''}
    ${opt.plus===false?'':`<button class="ib" data-act="plus1" aria-label="Add a shot you forgot to tap">+1</button>`}</div>`;
}
function staleHTML(i,h){
  const t=lastT(h);if(!t||S.staleOk===S.cur+':'+i)return '';
  const m=Math.round((Date.now()-t)/60000);if(m<12)return '';
  const ago=m<90?m+' minutes':Math.round(m/60)+' hours';
  return `<div class="stale" role="status"><div><b>Still on hole ${i+1}?</b><span>Your last tap was ${ago} ago.</span></div>
    <div class="r2"><button class="ghost" data-act="staleok">Yes, keep going</button><button class="ghost go" data-act="qs">Enter the score</button></div></div>`;
}
function shotHTML(r,i,h){

  const askMiss=h.pickOn===false&&h.pickAt!=null&&c.n===h.pickAt+1&&YNAME[h.pick]?`<div class="ask"><span class="cap">Your ${YNAME[h.pick]} missed the green. Which way? Optional</span><div class="pills">${MISS.map(([v,l])=>`<button class="pl" data-act="miss" data-v="${v}" aria-pressed="${h.miss===v}">${l}</button>`).join('')}</div></div>`:'';

function meter(you,sc,max,good){const w=Math.max(0,Math.min(100,100*you/max)),s=Math.max(0,Math.min(100,100*sc/max));return `<div class="meter" aria-hidden="true"><i class="${good?'ok':''}" style="width:${w}%"></i><em style="left:${s}%"></em></div>`;}

function cardCheck(list){
  const by={},tot={n:0,on:0,short:0,long:0,side:0};
  list.forEach(r=>r.h.forEach(h=>{
    const on=h.pickOn!=null?h.pickOn:h.gir;
    if(!h.yd||!h.app||!h.pick||YCODE[h.pick]!==h.app||on==null)return;
    const res=on?'on':(h.miss==='short'||h.miss==='long'?h.miss:(h.miss?'side':null));if(!res)return;
    const b=by[h.pick]||(by[h.pick]={n:0,on:0,short:0,long:0,side:0});b.n++;b[res]++;tot.n++;tot[res]++;}));
  if(!tot.n)return `<div><h3>Yardage Card check</h3><p class="sub">Before a shot to the green, tap the yards above the map, slide to the real number and tap Hit the club it picks. After a round this shows whether your course distances match your bay numbers.</p></div>`;
  const rows=Object.keys(YC).filter(k=>by[k]).map(k=>{const b=by[k];return `<tr><td class="l">${YNAME[k]}</td><td>${b.n}</td><td>${b.on}</td><td>${b.short}</td><td>${b.long}</td><td>${b.side}</td></tr>`;}).join('');
  const lean=tot.short>tot.long+1?'You come up short more often than long, so the course plays longer than the bay. Take one more club until your card catches up.':tot.long>tot.short+1?'You fly it long more often than short. Take one less club when the card is between two.':'Short and long misses are about even, so the card’s distances fit the course.';
  return `<div><h3>Yardage Card check</h3><p class="sub">${tot.n} ${tot.n===1?'shot':'shots'} where you hit the club the card picked. ${lean}</p>
    <div class="tw"><table class="dt"><thead><tr><th class="l">Club</th><th>Shots</th><th>On</th><th>Short</th><th>Long</th><th>Side</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

    c.nines[nine].map((hd,j)=>{const i=k*9+j,G={c,nine,n:j+1,hd,tee,r:r||fake};return `<button class="cd-btn" data-act="cadhole" data-nine="${nine}" data-n="${j+1}" aria-label="Hole ${hd.n||j+1}">${holeCardHTML(G,{cur:i===cur})}</button>`;}).join('')).join('');
  return `${all.length>1?`<div class="cd-courses" role="group" aria-label="Course">${all.map(x=>`<button class="pl" data-act="cadcourse" data-v="${x.id}" aria-pressed="${x===c}">${esc(x.name)}</button>`).join('')}</div>`:''}
    <header class="cd-top"><h1 class="t1">${esc(c.name)}</h1><p class="sub"><span class="num">${tot.toLocaleString('en-US')}</span> yd · par ${par}${rt}${r?' · <b class="cd-live">your round</b>':''}</p></header>
    <section class="box cd-head">
      ${nines.length>1?`<div class="pills" role="group" aria-label="Nines">${nines.map(n=>`<button class="pl" data-act="cadnine" data-v="${n}" aria-pressed="${gn.includes(n)}"${r?' disabled':''}>${n}${gn.length>1&&gn.includes(n)&&!/^(front|back)$/i.test(n)?` <small>${gn.indexOf(n)===0?'front':'back'}</small>`:''}</button>`).join('')}</div>`:''}
      <div class="seg" role="group" aria-label="Tees">${c.tees.map(x=>`<button data-act="cadtee" data-v="${x.k}" aria-pressed="${tee===x.k}">${x.short||x.name}</button>`).join('')}</div>
      <div class="seg" role="group" aria-label="Temperature">${TEMPS.map(([v,l,s])=>`<button data-act="cadtemp" data-v="${v}" aria-pressed="${temp===v}">${l}<small>${s}</small></button>`).join('')}</div>
    </section>
    <details class="box cd-keys"${r?'':' open'}><summary><h2 class="t3">Before you tee off</h2>${IC.chev}</summary><ul>${cold}${(c.keys||[]).slice(0,4).map(k=>`<li>${k}</li>`).join('')}</ul></details>
    ${cards}
    <p class="sub cd-foot">${esc(c.src||'')} Want another course? Send Claude its name in chat.</p>`;
}
function cadHoleSheet(){
  const st=cadState();if(!st||!S.cadHole)return '';
  const {c,tee,temp,r}=st,[nine,n]=S.cadHole,hd=c.nines[nine]&&c.nines[nine][n-1];if(!hd)return '';
  const G={c,nine,n,hd,tee,r:r||{tee,temp}};
  return `${sheetHead(`${esc(c.name)} · ${/^(front|back)$/i.test(nine)?nine+' 9':nine}`,`Hole ${hd.n||n}`)}${holeCardHTML(G,{big:true})}`;
}
/* New round: pick the nines (front, then back), tees and temperature from the guide */
function saveCad(){try{localStorage.setItem('psc.cad',JSON.stringify(S.cad));}catch(e){}}
function ngState(c,n){
  if(!c)return{gn:[],tee:null,temp:defTemp()};
  const need=n===9?1:2,nines=Object.keys(c.nines);
  let ng=S.ng&&S.ng.id===c.id?S.ng:null;
  if(!ng){const last=S.cad&&S.cad.id===c.id?S.cad:{};ng={id:c.id,gn:(last.gn&&last.gn.length?last.gn:nines).slice(0,need),tee:last.tee||c.rec,temp:last.temp||defTemp()};}
  ng=Object.assign({},ng,{gn:ng.gn.slice(-need)});
  return ng;
}
function newGuideHTML(){
  const c=courseByName(S.newCourse);if(!c)return '';
  const n=S.newHoles===9?9:18,ng=ngState(c,n),need=n/9;
  return `<div class="ngb"><span class="cap">Course guide found: ${esc(c.name)}. Tap ${need===1?'the nine you play':'your front nine, then your back nine'}.</span>
    <div class="pills" role="group" aria-label="Nines">${Object.keys(c.nines).map(x=>`<button class="pl" data-act="ngn" data-v="${x}" aria-pressed="${ng.gn.includes(x)}">${x}${need===2&&ng.gn.includes(x)&&!/^(front|back)$/i.test(x)?` <small>${ng.gn.indexOf(x)===0?'front':'back'}</small>`:''}</button>`).join('')}</div>
    <div class="seg" role="group" aria-label="Tees">${c.tees.map(t=>`<button data-act="ngtee" data-v="${t.k}" aria-pressed="${ng.tee===t.k}">${t.short||t.name}</button>`).join('')}</div>
    <div class="seg" role="group" aria-label="Temperature">${TEMPS.map(([v,l,s])=>`<button data-act="ngtemp" data-v="${v}" aria-pressed="${ng.temp===v}">${l}<small>${s}</small></button>`).join('')}</div>
    ${ng.gn.length<need?`<span class="cap">Pick ${need-ng.gn.length} more nine${need-ng.gn.length>1?'s':''} to use the guide.</span>`:''}</div>`;
}
/* The hole number on the course's own card (a round can start on 10) */
function holeNo(r,i){const G=gHole(r,i);return G&&G.hd.n?G.hd.n:i+1;}
function ordn(n){const t=n%100,e=n%10;return n+(t>10&&t<14?'th':e===1?'st':e===2?'nd':e===3?'rd':'th');}
/* caddy:end */
/* ---------- actions ---------- */
function tapped(h,msg){S.justTapped=true;S.staleOk=null;if(!isQuick(h))derive(h);touch(S.cur);render();S.justTapped=false;toast(msg,true);}
document.addEventListener('click',ev=>{
  const go=ev.target.closest('[data-go]');if(go){S.sheet=null;renderSheet();setView(go.dataset.go);return;}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,{r,i,h}=curHole();
  if(act!=='del'&&S.confirmDel){S.confirmDel=null;}
  if(!S.canWrite&&['start','res','drop','putt','undo','plus1','par','npar','tclub','qssave','tap','finish','del','fp','miss','hit','pstep','cond','doimport'].includes(act)){renderBanner();return;}
  const redo=()=>{if(h&&!isQuick(h))derive(h);touch(S.cur);render();};
  switch(act){
    case 'pages':{const g=$('gmOpen');if(g)g.click();break;}
    case 'cad':{const G=gHole(r,i);if(G){S.cadHole=[G.nine,G.n];S.sheet='cad';renderSheet();}break;}
    case 'cadhole':S.cadHole=[b.dataset.nine,+b.dataset.n];S.sheet='cad';renderSheet();break;
    case 'cadcourse':{const v=b.dataset.v;S.cadId=v;if(S.cad.id!==v){S.cad={id:v};saveCad();}render();window.scrollTo(0,0);break;}
    case 'cadnine':{const st=cadState();if(!st||st.r)break;let gn=st.gn.slice();const v=b.dataset.v;gn=gn.includes(v)?(gn.length>1?gn.filter(x=>x!==v):gn):gn.concat(v).slice(-2);S.cad=Object.assign({},S.cad,{id:st.c.id,gn});saveCad();render();break;}
    case 'cadtee':case 'cadtemp':{const st=cadState();if(!st)break;const k=act==='cadtee'?'tee':'temp';
      if(st.r){st.r[k]=b.dataset.v;if(k==='tee')st.r.h.forEach((x,j)=>{const G=gHole(st.r,j);if(G&&!holeDone(x))x.len=ydOf(G.c,G.hd,st.r.tee);});touch(S.cur);}
      S.cad=Object.assign({},S.cad,{id:st.c.id,[k]:b.dataset.v});saveCad();render();break;}
    case 'rtemp':r.temp=b.dataset.v;S.condOpen=true;touch(S.cur);renderSheet();break;
    case 'ngn':case 'ngtee':case 'ngtemp':{const gc=courseByName(S.newCourse),ng=ngState(gc,S.newHoles===9?9:18);if(!gc)break;
      if(act==='ngn'){const v=b.dataset.v,need=S.newHoles===9?1:2;ng.gn=ng.gn.includes(v)?ng.gn.filter(x=>x!==v):ng.gn.concat(v).slice(-need);}
      else ng[act==='ngtee'?'tee':'temp']=b.dataset.v;S.ng=ng;const bx=$('ng-box');if(bx)bx.innerHTML=newGuideHTML();break;}
    case 'nh':S.newHoles=+b.dataset.v;S.ng=null;render();break;
    case 'pickcourse':S.newCourse=b.dataset.v;S.ng=null;render();break;
    case 'start':{const n=S.newHoles===9?9:18,id='r'+Date.now().toString(36),course=(($('f-course')||{}).value||'').trim();
      const prev=course?sortedRounds().map(x=>x[1]).find(x=>!x.example&&(x.course||'').trim().toLowerCase()===course.toLowerCase()):null;
      S.rounds[id]={course,date:($('f-date')||{}).value||today(),holes:n,h:Array.from({length:n},(_,j)=>{const x=blankHole(prev&&prev.h[j]?prev.h[j].par:4);if(prev&&prev.h[j]&&prev.h[j].len)x.len=prev.h[j].len;if(prev&&prev.h[j]&&prev.h[j].parSet)x.parSet=1;return x;}),status:'playing',created:Date.now(),updated:Date.now()};
      const gc=courseByName(course),ng=ngState(gc,n);
      if(gc&&ng.gn.length===n/9){const rr=S.rounds[id];rr.g=gc.id;rr.gn=ng.gn.slice();rr.tee=ng.tee;rr.temp=ng.temp;rr.h.forEach((x,j)=>{const G=gHole(rr,j);if(G){x.par=G.hd.par;x.parSet=1;x.len=ydOf(gc,G.hd,rr.tee);}});S.cad={id:gc.id,gn:rr.gn.slice(),tee:rr.tee,temp:rr.temp};saveCad();}
      S.cur=id;S.hole=0;S.newCourse='';touch(id);setView('play');break;}
    case 'open':{S.cur=b.dataset.id;const rr=S.rounds[S.cur];const k=rr?rr.h.findIndex(x=>!holeDone(x)):0;S.hole=k<0?0:k;saveLocal();setView('play');break;}
    case 'summary':S.cur=b.dataset.id;saveLocal();setView('summary');break;
    case 'fill':S.hole=+b.dataset.v;saveLocal();S.qs={s:null,p:null};S.sheet='qs';setView('play');renderSheet();break;
    case 'del':{const id=b.dataset.id;if(S.confirmDel!==id){S.confirmDel=id;render();break;}
      S.confirmDel=null;delete S.rounds[id];pending.delete(id);pendingDel.add(id);if(S.cur===id)S.cur=null;saveLocal();clearTimeout(flushTimer);flushTimer=setTimeout(flush,300);syncLabel();setView('rounds');break;}
    case 'holes':S.sheet='holes';renderSheet();break;
    case 'hole':S.hole=+b.dataset.v;S.sheet=null;saveLocal();renderSheet();render();window.scrollTo(0,0);break;
    case 'next':S.hole=Math.min(r.h.length-1,S.hole+1);saveLocal();render();window.scrollTo(0,0);break;
    case 'finish':r.status='done';S.sheet=null;renderSheet();touch(S.cur);setView('summary');break;
    case 'close':{const was=S.sheet;if(was==='plan')savePlanYd();S.sheet=null;renderSheet();if(was==='plan')render();break;}
    case 'par':h.par=+b.dataset.v;h.parSet=1;if(h.par===3){h.tee=null;h.club=null;}redo();if(S.sheet==='plan')renderSheet();break;
    case 'npar':{const nx=r.h[i+1];if(nx){nx.par=+b.dataset.v;if(!isQuick(nx)&&nx.sh&&nx.sh.length)derive(nx);}touch(S.cur);render();break;}
    case 'tclub':r.tc=b.dataset.v;h.tc=b.dataset.v;touch(S.cur);render();break;
    case 'res':{if(!h.sh)h.sh=[];const c=strokesOf(h),e=stamp({to:b.dataset.v,t:Date.now()});
      if(c.n===0&&pos(h)==='T'&&h.par>=4)e.c=teeClubFor(r,h);
      const nx=h.nextPk&&h.nextPk.n===c.n?h.nextPk:null;
      if(nx){e.pk=nx.k;e.d=nx.d;}
      else if(e.c&&CODE2YC[e.c]){e.pk=CODE2YC[e.c];e.d=Math.round(clubMid(e.pk,planCtx()));}
      else{const rem=remainingYd(h);if(rem){const s0=planFor(h,rem.yd).steps[0];e.d=stepDist(s0);}}
      const svg=b.closest('svg');const pt=svg?svgPt(svg,ev):null;if(pt){e.x=pt[0];e.y=pt[1];}
      h.sh.push(e);if(h.cond)h.cond=Object.assign({},h.cond,{l:lieFor(e.to),s:'flat'});
      tapped(h,`Shot ${c.n+c.p+1}: ${e.to==='H'?'holed':LBL[e.to].toLowerCase()}`);break;}
    case 'drop':{const v=b.dataset.v,e=stamp(v==='same'?{drop:prevFrom(h),same:1,t:Date.now()}:{drop:v,t:Date.now()});
      const svg=b.closest('svg');const pt=svg?svgPt(svg,ev):null;if(pt){e.x=pt[0];e.y=pt[1];}
      h.sh.push(e);if(h.cond)h.cond=Object.assign({},h.cond,{l:lieFor(e.drop)});tapped(h,`Playing from ${v==='same'?'the same spot':LBL[v].toLowerCase()}`);break;}
    case 'putt':{if(!h.sh)h.sh=[];const k=(h.putts||0)+1;if(k===1)learnGreen(r,i);h.sh.push(stamp({to:b.dataset.v==='made'?'H':'G',t:Date.now()}));tapped(h,b.dataset.v==='made'?`Holed on putt ${k}`:`Putt ${k} missed`);if(pos(h)==='H')window.scrollTo(0,0);break;}
    case 'plus1':{if(!h.sh)h.sh=[];h.sh.push(stamp({to:pos(h),f:1,t:Date.now()}));const c=strokesOf(h);tapped(h,`Added a shot. Now on shot ${c.n+c.p+1}`);break;}
    case 'undo':{$('toast').hidden=true;if(h&&h.sh&&h.sh.length&&!isQuick(h)){h.sh.pop();redo();}break;}
    case 'staleok':S.staleOk=S.cur+':'+i;render();break;
    case 'fp':h.fp=h.fp===b.dataset.v?null:b.dataset.v;touch(S.cur);render();break;
    case 'miss':h.miss=h.miss===b.dataset.v?null:b.dataset.v;touch(S.cur);render();break;
    case 'qs':S.qs={s:h.s!=null?h.s:null,p:h.s!=null?h.putts:null};S.sheet='qs';renderSheet();break;
    case 'qsn':S.qs.s=+b.dataset.v;renderSheet();break;
    case 'qsp':S.qs.p=S.qs.p===+b.dataset.v?null:+b.dataset.v;renderSheet();break;
    case 'qssave':{if(S.qs.s==null)break;h.quick=true;h.s=S.qs.s;h.putts=S.qs.p;S.sheet=null;renderSheet();touch(S.cur);render();window.scrollTo(0,0);toast(`Hole ${i+1}: ${h.s} saved`,false);break;}
    case 'tap':h.quick=false;if(!h.sh)h.sh=[];redo();break;
    case 'plan':{const rem=remainingYd(h),c=strokesOf(h),tee=c.n===0&&pos(h)==='T';S.planYd=rem?rem.yd:(tee?(h.par===3?150:h.par===5?480:370):150);S.planSrc=null;S.sheet='plan';renderSheet();break;}
    case 'pstep':setPlanYd(S.planYd+(+b.dataset.d),'b');savePlanYd();break;
    case 'gpsuse':{const g=gpsYards();if(g){setPlanYd(g.mid,'b');S.planSrc='gps';const t=$('pl-src');if(t)t.textContent='GPS yards to the middle of the green';const l=$('gpsline');if(l)l.innerHTML=gpsLineHTML();}break;}
    case 'cond':{const c=Object.assign({},h.cond||defCond(h));c[b.dataset.k]=b.dataset.v;h.cond=c;S.condOpen=true;touch(S.cur);renderSheet();break;}
    case 'hit':{const k=b.dataset.k,d=+b.dataset.d,c=strokesOf(h),tee=c.n===0&&pos(h)==='T';
      if(S.planSrc==='set')savePlanYd();
      h.nextPk={n:c.n,k,d};
      if(tee&&h.par>=4)h.tc=TEECODE[k]||'iron';
      if(b.dataset.reach==='1'){h.app=YCODE[k]||null;h.pick=k;h.pickAt=c.n;h.miss=null;if(!h.yd||h.ydN!==c.n){h.yd=S.planYd;h.ydN=c.n;}}
      S.sheet=null;renderSheet();redo();toast(`${YNAME[k]} it is. Tap where it lands.`,false);break;}
    case 'import':S.sheet='import';renderSheet();break;
    case 'doimport':{const n=importCode(($('imp')||{}).value);if(n<0){toast('That code didn’t read. Copy it again and paste the whole thing.',false);break;}S.sheet=null;renderSheet();render();toast(n?`Added ${n} ${n===1?'round':'rounds'}`:'Those rounds are already here',false);break;}
    case 'copyx':{const code=exportCode(),cnt=Object.values(S.rounds).filter(x=>!x.example).length;
      const ok=()=>toast(`Copied ${cnt} ${cnt===1?'round':'rounds'}. In your Stat Card: Rounds → Paste rounds.`,false),bad=()=>{S.sheet='export';renderSheet();const t=$('exp');if(t){t.focus();t.select();}};
      try{navigator.clipboard.writeText(code).then(ok,bad);}catch(e){bad();}break;}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.sheet){if(S.sheet==='plan')savePlanYd();S.sheet=null;renderSheet();render();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('z')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
document.addEventListener('input',e=>{
  if(e.target.id==='pl-r'){setPlanYd(+e.target.value,'s');return;}
  if(e.target.id==='pl-n'){const v=parseInt(e.target.value,10);if(v>0)setPlanYd(v,'n');return;}
  if(e.target.id==='f-course'){S.newCourse=e.target.value;const bx=$('ng-box');if(bx)bx.innerHTML=newGuideHTML();}
});
document.addEventListener('change',e=>{if(e.target.id==='pl-r'||e.target.id==='pl-n')savePlanYd();});
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='condd')S.condOpen=e.target.open;},true);
const ROUTES=['rounds','play','caddy','stats','summary'];
window.addEventListener('hashchange',()=>{let v=location.hash.slice(1);if(v==='patterns')v='stats';if(ROUTES.includes(v)&&v!==S.view){S.view=v;render();}});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&(pending.size||pendingDel.size)){clearTimeout(flushTimer);flush();}
  if(document.visibilityState==='hidden')gpsStop();
  if(document.visibilityState==='visible'&&S.view==='play'&&!S.sheet&&!editingText())render();
});
window.addEventListener('online',()=>{clearTimeout(flushTimer);flush();});
let fitT=null;window.addEventListener('resize',()=>{clearTimeout(fitT);fitT=setTimeout(fitMap,120);});
loadLocal();try{S.cad=JSON.parse(localStorage.getItem('psc.cad')||'{}')||{};}catch(e){}
let hv=location.hash.slice(1);if(hv==='patterns')hv='stats';
S.view=ROUTES.includes(hv)?hv:(S.cur&&S.rounds[S.cur]&&S.rounds[S.cur].status!=='done'?'play':'rounds');
render();syncLabel();connect();
})();
</script>

<style>
  /* Page menu: a frosted-glass "Pages" button; on phones it opens a sheet from the bottom, on wide screens a floating panel on the right. */
  body::after { content: ""; display: block; height: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .gm-fab { position: fixed; z-index: 30; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: inline-flex; align-items: center; height: 50px; padding: 0 15px; border-radius: 999px; border: 0.5px solid var(--glass-edge);
    background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
    color: var(--ink); font: 600 0.95rem/1 var(--body); letter-spacing: -0.015em; cursor: pointer;
    box-shadow: var(--shadow-float), inset 0 1px 0 var(--glass-hi);

    transition: max-width 0.45s var(--ease), margin 0.45s var(--ease), opacity 0.25s var(--ease-out); }
  .gm-fab.gm-tuck { padding: 0 13px; }
  .gm-fab.gm-tuck span { max-width: 0; margin-left: 0; opacity: 0; }
  .gm-fab:active { transform: scale(0.92); }

  .gm-sheet { position: fixed; inset: auto max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
    margin: 0; padding: 0; width: auto; height: auto; max-width: none; max-height: calc(100% - 56px - env(safe-area-inset-top, 0px));
    border: 0.5px solid var(--glass-edge); border-radius: 32px; overflow: hidden;
    background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: saturate(180%) blur(32px); backdrop-filter: saturate(180%) blur(32px);
    color: var(--ink); font: 16px/1.45 var(--body); letter-spacing: -0.011em; box-shadow: 0 30px 80px -24px rgba(0, 0, 0, 0.4), inset 0 1px 0 var(--glass-hi); }
  .gm-sheet[open] { display: flex; flex-direction: column; animation: gmUp 0.56s var(--ease) both; }
  .gm-sheet::backdrop { background: var(--scrim); }
  .gm-sheet[open]::backdrop { animation: gmFade 0.4s ease both; }
  .gm-sheet.gm-closing { animation: gmDown 0.34s cubic-bezier(0.4, 0, 0.9, 0.6) both; }
  .gm-sheet.gm-closing::backdrop { animation: gmFadeOut 0.34s ease both; }
  .gm-sheet.gm-dragging { animation: none; }
  @keyframes gmUp { from { transform: translateY(110%); } }
  @keyframes gmDown { to { transform: translateY(110%); } }
  @keyframes gmIn { from { transform: translateX(calc(100% + 24px)); } }
  @keyframes gmOut { to { transform: translateX(calc(100% + 24px)); } }
  @keyframes gmFade { from { opacity: 0; } }
  @keyframes gmFadeOut { to { opacity: 0; } }

  .gm-grab { flex: none; height: 22px; display: grid; place-items: center; touch-action: none; cursor: grab; }
  .gm-grab span { width: 38px; height: 5px; border-radius: 3px; background: var(--fill-strong); }
  .gm-scroll { overflow-y: auto; overscroll-behavior: contain; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 24px; padding-bottom: 22px; }
  .gm-scroll > * { min-width: 0; }
  .gm-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 20px 0; touch-action: none; }
  .gm-top h2 { margin: 0; font: 700 2rem/1.05 var(--display); letter-spacing: -0.035em; }
  .gm-x { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 999px; background: var(--fill); color: var(--muted); cursor: pointer; transition: transform 0.4s var(--ease-out), background-color 0.2s; }
  .gm-x svg { width: 12px; height: 12px; }
  .gm-x:hover { background: var(--fill-strong); }
  .gm-x:active { transform: scale(0.9); }

  .gm-label { margin: 0 0 7px; padding: 0 16px; font: 600 0.82rem/1.2 var(--body); letter-spacing: -0.006em; color: var(--muted); }
  .gm-jump { display: flex; gap: 8px; overflow-x: auto; padding: 2px 20px 6px; scrollbar-width: none; scroll-snap-type: x proximity; scroll-padding-inline: 20px; }
  .gm-jump::-webkit-scrollbar { display: none; }
  .gm-jump a { flex: none; scroll-snap-align: start; padding: 9px 15px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-card); color: var(--ink); text-decoration: none; font: 500 0.9rem/1 var(--body); letter-spacing: -0.012em; white-space: nowrap; transition: transform 0.4s var(--ease-out); }
  .gm-jump a:active { transform: scale(0.94); }
  .gm-here .gm-label { padding: 0 20px; }

  .gm-groups { display: grid; gap: 22px; padding: 0 12px; }
  .gm-group { min-width: 0; }
  .gm-list { background: var(--surface); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-card); }
  .gm-row { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 13px; padding: 11px 14px; color: var(--ink); text-decoration: none; transition: background-color 0.2s; }
  .gm-row + .gm-row::before { content: ""; position: absolute; top: 0; left: 63px; right: 0; height: 0.5px; background: var(--hair); }
  .gm-row:hover { background: color-mix(in srgb, var(--fill) 50%, transparent); }
  .gm-row:active { background: var(--fill); }
  .gm-ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--c); box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
  .gm-ico svg { width: 21px; height: 21px; fill: none; stroke: #FFFFFF; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .gm-ico svg .f { fill: #FFFFFF; stroke: none; }
  .gm-txt { display: grid; gap: 1px; min-width: 0; }
  .gm-txt b { font: 600 1rem/1.25 var(--body); letter-spacing: -0.016em; }
  .gm-txt small { font: 400 0.82rem/1.3 var(--body); letter-spacing: -0.006em; color: var(--muted); }
  .gm-end { width: 18px; height: 18px; color: color-mix(in srgb, var(--muted) 70%, transparent); }
  .gm-row[aria-current="page"] .gm-end { color: var(--accent); }
  .gm-foot { margin: 0; padding: 0 24px; font-size: 0.8rem; color: var(--muted); }

  [data-gm-list] .gm-groups { padding: 0; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); align-items: start; }
  [data-gm-list] .gm-label { padding: 0 4px; }

  @media (min-width: 720px) {
    .gm-sheet { inset: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 12px auto; width: 404px; max-height: none; }
    .gm-sheet[open] { animation-name: gmIn; }
    .gm-sheet.gm-closing { animation-name: gmOut; }
    .gm-grab { display: none; }
    .gm-scroll { padding-top: 18px; }
    .gm-top, .gm-jump { touch-action: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gm-sheet[open], .gm-sheet.gm-closing, .gm-sheet[open]::backdrop, .gm-sheet.gm-closing::backdrop { animation-duration: 0.01ms; }
  }
</style>
<button type="button" class="gm-fab" id="gmOpen" aria-haspopup="dialog" aria-controls="gmDrawer" aria-expanded="false">
  <svg viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2.2" fill="currentColor"/><rect x="12" y="3" width="7" height="7" rx="2.2" fill="currentColor" opacity="0.55"/><rect x="3" y="12" width="7" height="7" rx="2.2" fill="currentColor" opacity="0.55"/><rect x="12" y="12" width="7" height="7" rx="2.2" fill="currentColor" opacity="0.55"/></svg>

</button>
<dialog class="gm-sheet" id="gmDrawer" aria-labelledby="gmTitle">
  <div class="gm-grab" id="gmGrab" aria-hidden="true"><span></span></div>
  <div class="gm-scroll">
    <div class="gm-top" id="gmTop">
      <h2 id="gmTitle">Pages</h2>
      <button type="button" class="gm-x" id="gmClose" aria-label="Close"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="gm-here" id="gmHere" hidden>
      <p class="gm-label">On this page</p>
      <div class="gm-jump"></div>
    </div>
    <div class="gm-groups"></div>
    <p class="gm-foot">Other pages open in a new tab.</p>
  </div>
</dialog>
<script>
(() => {
  const HERE = 'stat';
  const ART = 'https://claude.ai/artifact/';
  // Glyphs drawn on a 22-unit grid, white on each page's color tile.
  const ICONS = {
    yardage: '<path d="M7 19V3.5"/><path class="f" d="M7.6 3.2 16.5 7 7.6 10.8z"/><path d="M4 19h7"/>',
    smarts: '<path d="M5 18.5c1.2-4.6 3.4-6 6.2-7s4.6-3 4.8-6.8"/><circle class="f" cx="16" cy="4.6" r="2"/><circle class="f" cx="5" cy="18.4" r="1.4"/>',
    plan: '<rect x="3.5" y="5" width="15" height="13.5" rx="3"/><path d="M3.5 9.5h15M7.5 3v4M14.5 3v4"/><circle class="f" cx="8" cy="13.6" r="1.2"/><circle class="f" cx="11" cy="13.6" r="1.2"/>',
    lab: '<path d="M4.5 17.5C6.5 9.5 11 5.5 17.5 4.5"/><path d="M14 3.6l3.6.9-1.4 3.4"/><circle class="f" cx="4.6" cy="17.4" r="2"/>',
    doctor: '<path d="M11 5v12M5 11h12" stroke-width="3"/>',
    school: '<circle cx="11" cy="4.6" r="2"/><path d="M11 7v6.5M11 13.5 7.5 19M11 13.5l3.5 5.5M6.5 9.5h9"/>',
    words: '<path d="M5 4.5h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-6.5L6.5 19v-3.5H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z"/>',
    dict: '<path d="M11 6.5C9 5 6.2 4.7 3.5 5.3v12c2.7-.6 5.5-.3 7.5 1.2 2-1.5 4.8-1.8 7.5-1.2v-12C15.8 4.7 13 5 11 6.5zM11 6.5v12"/>',
    quiz: '<path d="M8 8.2a3 3 0 1 1 4.3 2.7c-.9.5-1.3 1.2-1.3 2.1v.6"/><circle class="f" cx="11" cy="17" r="1.3"/>',
    bag: '<path d="M7 3l7.5 13.5"/><path class="f" d="M13.4 15.2l4.2-1.6 1 3.4c-1.7 1.3-3.6 1.5-4.8.5z"/>',
    putt: '<path d="M8.5 3l2.6 12.6"/><path class="f" d="M8 15h6.5a2 2 0 0 1 0 4H8z"/><circle class="f" cx="17.5" cy="10.5" r="1.9"/>',
    hips: '<rect x="5" y="3.5" width="12" height="15" rx="2.2"/><path d="M5 10h12M13.5 13h1.8"/>',
    short: '<path d="M3.5 17c3-2 5-2 7.5 0s4.5 2 7.5 0"/><circle class="f" cx="11" cy="10" r="2.3"/><path d="M7 7.5 5.6 5.4M15 7.5l1.4-2.1M11 6V3.6"/>',
    stat: '<rect x="4.5" y="3.5" width="13" height="15.5" rx="2.6"/><path d="M8 8h6M8 11.5h6M8 15h3.5"/>',
    anybag: '<rect x="6.5" y="8" width="9" height="11" rx="2.2"/><path d="M9 8V4M13 8V5.5M6.5 13h9"/><circle class="f" cx="9" cy="3.4" r="1.3"/><circle class="f" cx="13" cy="4.8" r="1.3"/>'
  };
  const GROUPS = [
    ['On the course', [
      ['stat', 'Pocket Stat Card', 'VcfNY1dxSAwn9mLK8Jzr3U', 'Log each hole; it picks your club and finds your leaks.', '#0B6E99'],
      ['yardage', 'Yardage Card', 'R21VqgaRqjZ4Ueao7tNRoJ', 'Yards and wind in, club out.', '#34C759']
    ]],
    ['Fix your game', [
      ['hips', 'Car Door Hips', '8Z35pNogEvSzqEgLWsseiJ', 'Early extension and spine angle, in 3D.', '#D97706'],
      ['short', 'Short Game School', '8b6MXTYjy6bSchY3kZzVWk', 'Chips, pitches, bunkers and trouble shots.', '#0E7490'],
      ['putt', 'Putting Lab', 'DE1uvTn7rwDe9e5bKfLoK9', 'Toe check, pace, reads and short putts.', '#2563EB'],
      ['doctor', 'Shot Doctor', '1dnk9NojF8CyRyfXe1WcNU', 'Pick a bad shot, get the cause and the fix.', '#FF2D55']
    ]],
    ['Your swing and numbers', [
      ['lab', 'Ball Flight Lab', '25WmYhfQDj9BWgzXRbjRB2', 'Your Trackman sessions, explained.', '#007AFF'],
      ['school', 'Swing School', '9DRQaFabXJ85qXRBvyLoZ9', 'Grip, posture, stance and aim in 3D.', '#AF52DE']
    ]],
    ['Your gear', [
      ['anybag', 'Any-Brand Bag', 'Bc1W159KgbRqmzh5GzshWt', 'The best club per slot, from any brand.', '#0F766E'],
      ['bag', 'Mizuno Bag', 'TjzsnvZ115vkRrUm5XGKyQ', 'The clubs and specs your numbers point to.', '#48484A']
    ]]
  ];
  const ARROW = '<svg class="gm-end" viewBox="0 0 18 18" aria-hidden="true"><path d="M6 12 12 6M7 6h5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CHECK = '<svg class="gm-end" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 9.5 7.5 13 14 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const dlg = document.getElementById('gmDrawer');
  const fab = document.getElementById('gmOpen');
  const wide = matchMedia('(min-width: 720px)');
  const still = matchMedia('(prefers-reduced-motion: reduce)');

  function fill(box) {
    box.textContent = '';
    GROUPS.forEach(([label, pages]) => {
      const g = document.createElement('div');
      g.className = 'gm-group';
      const l = document.createElement('p');
      l.className = 'gm-label';
      l.textContent = label;
      const list = document.createElement('div');
      list.className = 'gm-list';
      pages.forEach(([key, name, id, blurb, color]) => {
        const a = document.createElement('a');
        a.className = 'gm-row';
        const here = key === HERE;
        a.innerHTML = '<span class="gm-ico" style="--c:' + color + '"><svg viewBox="0 0 22 22" aria-hidden="true">' + ICONS[key] + '</svg></span>' +
          '<span class="gm-txt"><b></b><small></small></span>' + (here ? CHECK : ARROW);
        a.querySelector('b').textContent = name;
        a.querySelector('small').textContent = here ? 'You’re here' : blurb;
        if (here) {
          a.href = '#';
          a.setAttribute('aria-current', 'page');
          a.addEventListener('click', e => { e.preventDefault(); close(); window.scrollTo({ top: 0, behavior: still.matches ? 'auto' : 'smooth' }); });
        } else {
          a.href = ART + id;
          a.target = '_blank';
          a.rel = 'noopener';
        }
        list.appendChild(a);
      });
      g.append(l, list);
      box.appendChild(g);
    });
  }

  // Open and close with the sheet's own motion; the native dialog keeps focus, Esc and the dimmed page.
  let closing = false;
  function open() {
    if (dlg.open) return;
    dlg.classList.remove('gm-closing', 'gm-dragging');
    dlg.style.transform = '';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    fab.setAttribute('aria-expanded', 'true');
  }
  function finish() {
    closing = false;
    dlg.classList.remove('gm-closing', 'gm-dragging');
    dlg.style.transform = '';
    if (dlg.close) dlg.close(); else dlg.removeAttribute('open');
    fab.setAttribute('aria-expanded', 'false');
  }
  function close() {
    if (!dlg.open || closing) return;
    closing = true;
    dlg.classList.remove('gm-dragging');
    if (still.matches) { finish(); return; }
    dlg.classList.add('gm-closing');
    let done = false;
    const end = () => { if (!done) { done = true; finish(); } };
    dlg.addEventListener('animationend', end, { once: true });
    setTimeout(end, 420);
  }
  dlg.addEventListener('cancel', e => { e.preventDefault(); close(); });
  dlg.addEventListener('click', e => { if (e.target === dlg) close(); });
  fab.addEventListener('click', open);
  document.getElementById('gmClose').addEventListener('click', close);

  // Pull the sheet down to dismiss it (phones); a short or slow pull springs back.
  let drag = null;
  function down(e) {
    if (wide.matches || e.button > 0 || e.target.closest('button, a')) return;
    drag = { y: e.clientY, t: performance.now(), dy: 0, v: 0, id: e.pointerId };
    dlg.classList.add('gm-dragging');
    dlg.style.transition = 'none';
    e.currentTarget.setPointerCapture(e.pointerId);
  }
  function move(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const now = performance.now();
    const dy = e.clientY - drag.y;
    drag.v = (dy - drag.dy) / Math.max(1, now - drag.t);
    drag.dy = dy; drag.t = now;
    dlg.style.transform = 'translateY(' + (dy > 0 ? dy : dy / 4) + 'px)';
  }
  function up(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const { dy, v } = drag;
    drag = null;
    dlg.style.transition = '';
    if (dy > 110 || (dy > 24 && v > 0.55)) { close(); return; }
    dlg.style.transition = 'transform 0.5s var(--ease)';
    dlg.style.transform = '';
    setTimeout(() => { dlg.style.transition = ''; dlg.classList.remove('gm-dragging'); }, 520);
  }
  ['gmGrab', 'gmTop'].forEach(id => {
    const h = document.getElementById(id);
    h.addEventListener('pointerdown', down);
    h.addEventListener('pointermove', move);
    h.addEventListener('pointerup', up);
    h.addEventListener('pointercancel', up);
  });

  // "On this page" mirrors the page's own section bar, minus its old "More pages" tab.
  const tabs = [...document.querySelectorAll('nav.tabs a[href^="#"]')].filter(a => a.getAttribute('href') !== '#more');
  if (tabs.length) {
    const jump = dlg.querySelector('.gm-jump');
    tabs.forEach(t => {
      const c = t.cloneNode(true);
      c.querySelectorAll('b').forEach(b => b.remove());
      const a = document.createElement('a');
      a.textContent = c.textContent.trim();
      a.href = t.getAttribute('href');
      a.addEventListener('click', e => { e.preventDefault(); close(); setTimeout(() => { location.hash = a.getAttribute('href').slice(1); }, still.matches ? 0 : 200); });
      jump.appendChild(a);
    });
    document.getElementById('gmHere').hidden = false;
  }

  fill(dlg.querySelector('.gm-groups'));
  document.querySelectorAll('[data-gm-list]').forEach(box => {
    const groups = document.createElement('div');
    groups.className = 'gm-groups';
    box.appendChild(groups);
    fill(groups);
  });

  // The section bar highlights the section you're reading and keeps that pill in view.
  const strip = document.querySelector('nav.tabs .in');
  const spy = new Map();
  document.querySelectorAll('nav.tabs a[href^="#"]').forEach(a => {
    const s = document.getElementById(a.getAttribute('href').slice(1));
    if (s) spy.set(s, a);
  });
  if (strip && spy.size && 'IntersectionObserver' in window) {
    let current = null;
    const mark = a => {
      if (a === current) return;
      if (current) current.removeAttribute('aria-current');
      current = a;
      if (!a) return;
      a.setAttribute('aria-current', 'true');
      const left = a.offsetLeft - (strip.clientWidth - a.offsetWidth) / 2;
      strip.scrollTo({ left: Math.max(0, left), behavior: still.matches ? 'auto' : 'smooth' });
    };
    const seen = new Set();
    const first = spy.keys().next().value;
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) seen.add(en.target); else seen.delete(en.target); });
      const top = [...seen].sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top)[0];
      if (top) mark(spy.get(top));
      else if (first.getBoundingClientRect().top > window.innerHeight * 0.3) mark(null);
    }, { rootMargin: '-28% 0px -66% 0px' });
    spy.forEach((a, s) => io.observe(s));
  }

  // The button shrinks to its icon while you scroll down and grows back when you scroll up.
  let lastY = window.scrollY, ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      if (Math.abs(y - lastY) > 8) {
        fab.classList.toggle('gm-tuck', y > lastY && y > 240);
        lastY = y;
      }
      ticking = false;
    });
  }, { passive: true });
})();
</script>
